[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rocketdict-workbench"
version = "0.1.0"
description = "Local product/research workbench for RocketDict dictionary creation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rocketdict-workbench = "rocketdict_workbench.cli:main"
rocketdict-product-run = "rocketdict_workbench.product_run_cli:main"
rocketdict-recover-core = "rocketdict_workbench.core_recovery:main"
rocketdict-recover-plan = "rocketdict_workbench.core_compatibility:main"
rocketdict-recover-wheel = "rocketdict_workbench.core_wheel_pipeline:main"
rocketdict-recover-scan = "rocketdict_workbench.core_scan_pipeline:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
