          </g>
          <g stroke="#14293C" stroke-width="2.1" stroke-linecap="round">
            <path d="M30 8v26"/><path d="M18.8 14.5l22.4 13"/><path d="M41.2 14.5l-22.4 13"/>
            <path d="M25 11l5 4.5 5-4.5M25 31l5-4.5 5 4.5"/>
            <path d="M20.8 20l6.2 1.5-1.5-6.2M39.2 20l-6.2 1.5 1.5-6.2"/>
            <path d="M20.8 22l6.2-1.5-1.5 6.2M39.2 22l-6.2-1.5 1.5 6.2"/>
          </g>
        </g>
      </g>
      <circle cx="22" cy="64" r="5" fill="#55E6A5"/>
      <circle cx="44" cy="64" r="5" fill="#FFB457"/>
      <circle cx="66" cy="64" r="5" fill="#FF6B6B"/>
    </g>
  </g>

  <g transform="translate(330 548)" class="cow-scene cow-clean">
