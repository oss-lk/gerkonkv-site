<svg viewBox="0 0 1400 820" xmlns="http://www.w3.org/2000/svg">
      <style>
    .cloud{animation: drift 14s ease-in-out infinite alternate}
    .cloud2{animation-duration:18s}

    .tank-screen .screen-mode{opacity:0; animation: tankScreenCycle 14s steps(1,end) infinite}
    .tank-screen .mode-hot{animation-delay:0s}
    .tank-screen .mode-alkali{animation-delay:2s}
    .tank-screen .mode-cold{animation-delay:4s}
    .tank-screen .mode-acid{animation-delay:6s}
    .tank-screen .mode-prop{animation-delay:8s}
    .tank-screen .mode-ready{animation-delay:10s}
    .tank-screen .mode-snow{animation-delay:12s}
    .tank-screen .propeller{transform-origin:30px 21px; animation: propSpin 1.25s linear infinite}

    .cow-clean .cow-body{transform-origin:132px 86px; animation: cleanCowBreathe 4.8s ease-in-out infinite}
    .cow-clean .cow-head{transform-origin:204px 66px; animation: cleanCowHead 7.2s ease-in-out infinite}
    .cow-clean .cow-tail{transform-origin:45px 48px; animation: cleanCowTail 4.2s ease-in-out infinite}
    .cow-clean .cow-ear-l{transform-origin:190px 36px; animation: cleanEarLeft 7.2s ease-in-out infinite}
    .cow-clean .cow-ear-r{transform-origin:232px 39px; animation: cleanEarRight 6.5s ease-in-out infinite}
    .cow-clean .cow-mouth{transform-origin:235px 88px; animation: cleanMouth 7.2s ease-in-out infinite}
    .cow-clean .moo{opacity:0; animation: cleanMooOpacity 7.2s ease-in-out infinite}
    .cow-clean .leg-a{transform-origin:78px 108px; animation: legSoftA 4.8s ease-in-out infinite}
    .cow-clean .leg-b{transform-origin:110px 108px; animation: legSoftB 4.8s ease-in-out infinite}
    .cow-clean .leg-c{transform-origin:164px 108px; animation: legSoftA 4.8s ease-in-out infinite}
    .cow-clean .leg-d{transform-origin:198px 108px; animation: legSoftB 4.8s ease-in-out infinite}

    @keyframes drift{to{transform:translateX(34px)}}
    @keyframes tankScreenCycle{0%,14.19%{opacity:1}14.2%,100%{opacity:0}}
    @keyframes propSpin{to{transform:rotate(360deg)}}
    @keyframes cleanCowBreathe{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(1px) scaleY(1.014)}}
    @keyframes cleanCowHead{0%,18%{transform:rotate(0deg) translate(0,0)}26%,44%{transform:rotate(4deg) translate(-4px,7px)}54%,62%{transform:rotate(0deg) translate(0,0)}70%,82%{transform:rotate(-7deg) translate(3px,-9px)}90%,100%{transform:rotate(0deg) translate(0,0)}}
    @keyframes cleanCowTail{0%,35%,100%{transform:rotate(0deg)}44%{transform:rotate(14deg)}54%{transform:rotate(-8deg)}64%{transform:rotate(8deg)}}
    @keyframes cleanEarLeft{0%,55%,100%{transform:rotate(0deg)}60%{transform:rotate(-10deg)}67%{transform:rotate(6deg)}74%{transform:rotate(0deg)}}
    @keyframes cleanEarRight{0%,35%,100%{transform:rotate(0deg)}42%{transform:rotate(10deg)}50%{transform:rotate(-5deg)}58%{transform:rotate(0deg)}}
    @keyframes cleanMouth{0%,62%,88%,100%{transform:scaleY(.35);opacity:.35}68%,80%{transform:scaleY(1);opacity:1}}
    @keyframes cleanMooOpacity{0%,62%,88%,100%{opacity:0}68%,80%{opacity:1}}
    @keyframes legSoftA{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-1.2deg)}}
    @keyframes legSoftB{0%,100%{transform:rotate(0deg)}50%{transform:rotate(1.2deg)}}
      .cow-clean .cow-eye{animation:none; transform:none}
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#BEEBFF"/><stop offset=".6" stop-color="#DDF7EF"/><stop offset="1" stop-color="#FFF0C2"/></linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8EDC92"/><stop offset="1" stop-color="#48A96B"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#DCEAF2"/><stop offset=".55" stop-color="#95B8C8"/><stop offset="1" stop-color="#6A91A7"/></linearGradient>
  </defs>

  <rect width="1400" height="820" fill="url(#sky)"/>
  <circle cx="118" cy="114" r="66" fill="#FFD172" opacity=".75"/>

  <g class="cloud" fill="#fff" opacity=".88">
    <ellipse cx="240" cy="120" rx="70" ry="28"/><ellipse cx="306" cy="108" rx="50" ry="32"/><ellipse cx="358" cy="124" rx="76" ry="26"/>
  </g>
  <g class="cloud cloud2" fill="#fff" opacity=".78">
    <ellipse cx="950" cy="156" rx="82" ry="24"/><ellipse cx="1018" cy="143" rx="48" ry="30"/><ellipse cx="1074" cy="158" rx="78" ry="22"/>
  </g>

