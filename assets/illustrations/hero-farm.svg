        </g>
        <g class="screen-mode mode-acid" transform="translate(14 12)">
          <circle cx="23" cy="26" r="8" fill="#3478FF" stroke="#14293C" stroke-width="2.4"/>
          <circle cx="37" cy="23" r="9" fill="#3478FF" stroke="#14293C" stroke-width="2.4"/>
          <circle cx="39" cy="34" r="6" fill="#3478FF" stroke="#14293C" stroke-width="2.4"/>
          <circle cx="25" cy="12" r="3.5" fill="#3478FF" stroke="#14293C" stroke-width="1.8"/>
          <circle cx="41" cy="12" r="2.8" fill="#3478FF" stroke="#14293C" stroke-width="1.8"/>
        </g>
        <g class="screen-mode mode-prop" transform="translate(14 12)">
