  <path d="M0 686h1400v134H0z" fill="#E7C78D"/>
  <path d="M80 722c168-56 360-72 560-50 224 25 436 10 680-58" fill="none" stroke="#D1A25E" stroke-width="16" opacity=".45"/>

  <g transform="translate(715 274)">
    <path d="M0 152h388v238H0z" fill="#4F7E94"/>
    <path d="M-40 152 190 48l236 104z" fill="#264D63"/>
    <rect x="28" y="188" width="72" height="82" rx="8" fill="#C9EAF7"/>
    <rect x="130" y="188" width="72" height="82" rx="8" fill="#C9EAF7"/>
    <rect x="232" y="188" width="72" height="82" rx="8" fill="#C9EAF7"/>
    <rect x="324" y="164" width="100" height="226" fill="#305F76"/>
    <path d="M-18 390h460" stroke="#27465A" stroke-width="18" stroke-linecap="round"/>
  </g>

  <g transform="translate(1052 326)" class="tank-panel-scene">
    <ellipse cx="106" cy="270" rx="82" ry="20" fill="#5C8798" opacity=".34"/>

    <g class="small-milk-tank">
      <rect x="44" y="62" width="126" height="196" rx="44" fill="url(#steel)" stroke="#517286" stroke-width="6"/>
      <ellipse cx="107" cy="63" rx="54" ry="20" fill="#CFE7F1" stroke="#557B8D" stroke-width="5"/>
