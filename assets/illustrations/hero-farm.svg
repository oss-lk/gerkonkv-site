        <g class="screen-mode mode-ready" transform="translate(14 12)">
          <path d="M17 23l9 9 18-20" fill="none" stroke="#25B86A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g class="screen-mode mode-snow" transform="translate(14 12)">
