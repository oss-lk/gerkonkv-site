        <ellipse cx="110" cy="170" rx="15" ry="7" fill="#233247"/>
      </g>
      <g class="leg-c">
        <rect x="156" y="108" width="19" height="58" rx="9" fill="#fff" stroke="#233247" stroke-width="3"/>
        <ellipse cx="165" cy="170" rx="15" ry="7" fill="#233247"/>
      </g>
      <g class="leg-d">
        <rect x="186" y="106" width="19" height="60" rx="9" fill="#fff" stroke="#233247" stroke-width="3"/>
        <ellipse cx="195" cy="170" rx="15" ry="7" fill="#233247"/>
