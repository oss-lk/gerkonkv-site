[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rocketdict-product-core"
version = "1.0.0.dev1"
description = "Maintained local Product Core for RocketDict"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
subtitle = ["pysubs2>=1.7,<2"]
nlp = ["spacy>=3.8,<4"]
mt = ["ctranslate2>=4.8,<5", "sentencepiece>=0.2,<0.3"]
alt-mt = [
  "ctranslate2>=4.8,<5",
  "sentencepiece>=0.2,<0.3",
  "transformers==4.56.2",
  "sacremoses>=0.1,<0.2",
]
alt-mt-build = [
  "ctranslate2>=4.8,<5",
  "sentencepiece>=0.2,<0.3",
  "transformers==4.56.2",
  "sacremoses>=0.1,<0.2",
  "safetensors>=0.6,<0.7",
  "torch>=2.8,<2.9",
]
pronunciation = ["cmudict>=1,<2"]
production = [
  "pysubs2>=1.7,<2",
  "spacy>=3.8,<4",
  "ctranslate2>=4.8,<5",
  "sentencepiece>=0.2,<0.3",
  "cmudict>=1,<2",
]
test = ["pytest>=8,<10"]

[project.scripts]
rocketdict-core = "rocketdict.api.cli:main"
rocketdict-assets = "rocketdict.assets:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
