name: RocketDict Full Opticks Illustration Product Rescue

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - 'rocketdict-product-core/src/rocketdict/runtime.py'
      - 'rocketdict-product-core/src/rocketdict/translation_rescue.py'
      - 'rocketdict-product-core/src/rocketdict/translation_stage.py'
      - 'rocketdict-product-core/src/rocketdict/translation_length_rescue_stage.py'
      - 'rocketdict-product-core/src/rocketdict/translation_citation_rescue_stage.py'
      - 'rocketdict-product-core/src/rocketdict/translation_numeric_hard_rescue_stage.py'
      - 'rocketdict-product-core/src/rocketdict/translation_illustration_rescue_stage.py'
      - 'rocketdict-workbench/tests/real_translation_full_opticks_illustration_product_rescue.py'
      - '.github/workflows/rocketdict-full-opticks-illustration-product-rescue.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  illustration-product-rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_RUN_ID: '34601313026'
      BASE_ARTIFACT_NAME: rocketdict-full-opticks-numeric-hard-product-rescue
      BASE_DB_SHA256: a84b2118f00bc386953fe11db48bdc29fcfe8db62735f9acf86178e1dbacf9a2
      OPUS_URL: https://object.pouta.csc.fi/OPUS-MT-models/en-ru/opus-2020-02-11.zip
      OPUS_SHA256: 798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677
      ROCKETDICT_OPUS_ASSET_DIR: ${{ github.workspace }}/work/opus-asset
      ROCKETDICT_ILLUSTRATION_PRODUCT_ROOT: ${{ github.workspace }}/work/illustration-product-rescue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install maintained Product and Workbench runtimes
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './rocketdict-product-core[production]'
          python -m pip install -e ./rocketdict-workbench
      - name: Download immutable run-8 Product evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BASE_ARTIFACT_NAME }}
          path: work/base
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BASE_RUN_ID }}
      - name: Assemble and verify immutable run-8 database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROCKETDICT_ILLUSTRATION_PRODUCT_ROOT"
          cp work/base/numeric-hard-product-rescue/rocketdict.sqlite \
            "$ROCKETDICT_ILLUSTRATION_PRODUCT_ROOT/rocketdict.sqlite"
          echo "$BASE_DB_SHA256  $ROCKETDICT_ILLUSTRATION_PRODUCT_ROOT/rocketdict.sqlite" | sha256sum -c -
          cp "$ROCKETDICT_ILLUSTRATION_PRODUCT_ROOT/rocketdict.sqlite" \
            "$ROCKETDICT_ILLUSTRATION_PRODUCT_ROOT/rocketdict-before.sqlite"
      - name: Restore pinned OPUS archive cache
        uses: actions/cache@v4
        with:
          path: work/opus-2020-02-11.zip
          key: rocketdict-opus-en-ru-2020-02-11-798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677
      - name: Obtain and verify pinned OPUS archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          if [ ! -s work/opus-2020-02-11.zip ]; then
            rm -f work/opus-2020-02-11.zip.tmp
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
              "$OPUS_URL" -o work/opus-2020-02-11.zip.tmp
            echo "$OPUS_SHA256  work/opus-2020-02-11.zip.tmp" | sha256sum -c -
            mv work/opus-2020-02-11.zip.tmp work/opus-2020-02-11.zip
          fi
          echo "$OPUS_SHA256  work/opus-2020-02-11.zip" | sha256sum -c -
      - name: Build verified offline CTranslate2 float32 asset
        run: |
          rocketdict-assets build-opus-en-ru work/opus-2020-02-11.zip "$ROCKETDICT_OPUS_ASSET_DIR" \
            | tee work/opus-asset-build.json
          test -s "$ROCKETDICT_OPUS_ASSET_DIR/rocketdict-opus-asset.json"
          test -s "$ROCKETDICT_OPUS_ASSET_DIR/ct2/model.bin"
      - name: Run persisted illustration-label Product Stage12 audit
        run: python -u rocketdict-workbench/tests/real_translation_full_opticks_illustration_product_rescue.py
      - name: Verify persisted evidence and fail-closed invariants
        shell: bash
        run: |
          set -euo pipefail
          evidence="$ROCKETDICT_ILLUSTRATION_PRODUCT_ROOT/full-opticks-illustration-label-product-rescue-optin.json"
          test -s "$evidence"
          test -s "$ROCKETDICT_ILLUSTRATION_PRODUCT_ROOT/rocketdict.sqlite"
          echo "$BASE_DB_SHA256  $ROCKETDICT_ILLUSTRATION_PRODUCT_ROOT/rocketdict-before.sqlite" | sha256sum -c -
          python - <<'PY'
          import json, os, sqlite3
          from pathlib import Path
          root = Path(os.environ['ROCKETDICT_ILLUSTRATION_PRODUCT_ROOT'])
          evidence = json.loads((root / 'full-opticks-illustration-label-product-rescue-optin.json').read_text(encoding='utf-8'))
          if evidence['schema'] != 'rocketdict-full-opticks-illustration-label-product-rescue-optin/1':
              raise SystemExit(f"schema drift: {evidence['schema']!r}")
          if evidence['base_translation_run_id'] != 8:
              raise SystemExit(f"base run drift: {evidence['base_translation_run_id']!r}")
          if evidence['base_hard_gate_counts'] != {'numeric_symbol': 25, 'punctuation': 33, 'length': 0, 'unique': 55}:
              raise SystemExit(f"base gate drift: {evidence['base_hard_gate_counts']!r}")
          if evidence['enabled_hard_gate_counts'] != {'numeric_symbol': 24, 'punctuation': 30, 'length': 0, 'unique': 52}:
              raise SystemExit(f"enabled gate drift: {evidence['enabled_hard_gate_counts']!r}")
          if evidence['base_segment_count'] != 3343 or evidence['enabled_segment_count'] != 3346:
              raise SystemExit(f"segment drift: {evidence['base_segment_count']}->{evidence['enabled_segment_count']}")
          if evidence['attempted_source_starts'] != [72401, 90105, 203786]:
              raise SystemExit(f"attempted source drift: {evidence['attempted_source_starts']!r}")
          if evidence['accepted_source_starts'] != [72401, 90105, 203786]:
              raise SystemExit(f"accepted source drift: {evidence['accepted_source_starts']!r}")
          if evidence['selected_ranks'] != [3, 3, 0]:
              raise SystemExit(f"selected rank drift: {evidence['selected_ranks']!r}")
          if evidence['selected_targets'] != ['Иллюстрация.', 'Иллюстрация.', 'С центром O']:
              raise SystemExit(f"selected target drift: {evidence['selected_targets']!r}")
          if evidence['untouched_base_exact_count'] != 3340:
              raise SystemExit(f"untouched-row drift: {evidence['untouched_base_exact_count']!r}")
          if evidence['source_coverage_byte_exact'] is not True:
              raise SystemExit('source coverage proof missing')
          if evidence['research_v3']['evidence_sha256'] != '5a24353ab6996ed9d31cc474c76c8896464a5b9b20b0909328fba91277829e93':
              raise SystemExit('research-v3 evidence identity drift')
          if evidence['promotion_allowed'] is not False or evidence['automatic_product_default_allowed'] is not False or evidence['public_stage12_surface_allowed'] is not False:
              raise SystemExit('audit unexpectedly authorizes promotion')
          for flag in ('source_bytes_rewritten','target_rewriting','placeholders','post_translation_literal_injection'):
              if evidence[flag] is not False:
                  raise SystemExit(f"unsafe flag drift: {flag}={evidence[flag]!r}")
          with sqlite3.connect(root / 'rocketdict.sqlite') as connection:
              integrity = connection.execute('PRAGMA integrity_check').fetchone()[0]
              foreign_keys = connection.execute('PRAGMA foreign_key_check').fetchall()
          if integrity != 'ok' or foreign_keys:
              raise SystemExit(f"database integrity drift: {integrity!r} {foreign_keys[:10]!r}")
          print('Illustration Product rescue evidence verified; SQLite integrity_check=ok; foreign_key_check=0')
          PY
      - name: Record runtime and persisted identities
        if: always()
        shell: bash
        run: |
          mkdir -p work/illustration-product-runtime
          python -VV > work/illustration-product-runtime/python.txt || true
          python -m pip freeze | sort > work/illustration-product-runtime/pip-freeze.txt || true
          df -h > work/illustration-product-runtime/disk.txt || true
          free -h > work/illustration-product-runtime/memory.txt || true
          printf '%s\n' "$BASE_RUN_ID" > work/illustration-product-runtime/base-run-id.txt
          sha256sum work/opus-2020-02-11.zip > work/illustration-product-runtime/opus.sha256 || true
          if [ -s "$ROCKETDICT_ILLUSTRATION_PRODUCT_ROOT/rocketdict.sqlite" ]; then
            sha256sum "$ROCKETDICT_ILLUSTRATION_PRODUCT_ROOT/rocketdict.sqlite" > work/illustration-product-runtime/persisted-db.sha256
          fi
          if [ -s "$ROCKETDICT_ILLUSTRATION_PRODUCT_ROOT/full-opticks-illustration-label-product-rescue-optin.json" ]; then
            sha256sum "$ROCKETDICT_ILLUSTRATION_PRODUCT_ROOT/full-opticks-illustration-label-product-rescue-optin.json" > work/illustration-product-runtime/evidence.sha256
          fi
      - name: Upload persisted illustration-label Product rescue evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-full-opticks-illustration-label-product-rescue
          path: |
            work/opus-asset-build.json
            work/illustration-product-rescue/full-opticks-illustration-label-product-rescue-optin.json
            work/illustration-product-rescue/rocketdict.sqlite
            work/illustration-product-runtime/**
          if-no-files-found: warn
          retention-days: 90
