name: RocketDict Full Opticks Run20 Fraction Denominator Truncation DOE

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - 'rocketdict-workbench/tests/real_translation_full_opticks_run20_fraction_denominator_truncation_doe.py'
      - '.github/workflows/rocketdict-full-opticks-run20-fraction-denominator-truncation-doe.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  run20-fraction-denominator-truncation-doe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE_RUN_ID: '34678965465'
      BASE_ARTIFACT_NAME: rocketdict-full-opticks-parenthetical-whole-context-rescue
      BASE_DB_SHA256: 879ea83d0f6803e2fdce609e4ef0dc57017626e4fd0e007d3440b12c7f6f4f2d
      TC_BIG_REPO: Helsinki-NLP/opus-mt-tc-big-en-zle
      TC_BIG_REVISION: 708be1d372fe4c358a352f404e6dc9ca0126ba48
      TC_BIG_WEIGHTS_SHA256: e68caa9a233c177a3489257b69c18cece6da97767ab2581918ce3fc3c3899416
      TC_BIG_SNAPSHOT: ${{ github.workspace }}/work/tc-big-snapshot
      ROCKETDICT_TC_BIG_ASSET_DIR: ${{ github.workspace }}/work/tc-big-asset
      ROCKETDICT_RUN20_FRACTION_TRUNCATION_DOE_ROOT: ${{ github.workspace }}/work/run20-fraction-denominator-truncation-doe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install maintained research runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e './rocketdict-product-core[alt-mt]' -e ./rocketdict-workbench \
            'ctranslate2==4.8.2' 'sentencepiece==0.2.1' 'transformers==4.56.2' \
            'sacremoses==0.1.1' 'huggingface_hub==0.34.4' 'safetensors==0.6.2'
      - name: Download exact persisted run20 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BASE_ARTIFACT_NAME }}
          path: work/base
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BASE_RUN_ID }}
      - name: Stage exact run20 database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROCKETDICT_RUN20_FRACTION_TRUNCATION_DOE_ROOT"
          cp work/base/full-opticks-parenthetical-whole-context-rescue/rocketdict.sqlite "$ROCKETDICT_RUN20_FRACTION_TRUNCATION_DOE_ROOT/rocketdict.sqlite"
          echo "$BASE_DB_SHA256  $ROCKETDICT_RUN20_FRACTION_TRUNCATION_DOE_ROOT/rocketdict.sqlite" | sha256sum -c -
      - name: Restore pinned TC-big snapshot cache
        uses: actions/cache@v4
        with:
          path: work/tc-big-snapshot
          key: rocketdict-tc-big-en-zle-708be1d372fe4c358a352f404e6dc9ca0126ba48-e68caa9a
      - name: Obtain exact pinned TC-big snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id=os.environ['TC_BIG_REPO'],revision=os.environ['TC_BIG_REVISION'],local_dir=os.environ['TC_BIG_SNAPSHOT'],allow_patterns=['README.md','config.json','generation_config.json','model.safetensors','source.spm','special_tokens_map.json','target.spm','tokenizer_config.json','vocab.json'])
          PY
          echo "$TC_BIG_WEIGHTS_SHA256  $TC_BIG_SNAPSHOT/model.safetensors" | sha256sum -c -
      - name: Build byte-verified TC-big asset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROCKETDICT_TC_BIG_ASSET_DIR"
          rocketdict-assets build-tc-big-en-ru "$TC_BIG_SNAPSHOT" "$ROCKETDICT_TC_BIG_ASSET_DIR" | tee work/tc-big-asset-build.json
      - name: Run exact read-only fraction DOE
        run: python -u rocketdict-workbench/tests/real_translation_full_opticks_run20_fraction_denominator_truncation_doe.py
      - name: Verify immutable DOE contract
        shell: bash
        run: |
          set -euo pipefail
          echo "$BASE_DB_SHA256  $ROCKETDICT_RUN20_FRACTION_TRUNCATION_DOE_ROOT/rocketdict.sqlite" | sha256sum -c -
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROCKETDICT_RUN20_FRACTION_TRUNCATION_DOE_ROOT'])
          e=json.loads((root/'full-opticks-run20-fraction-denominator-truncation-doe.json').read_text(encoding='utf-8'))
          if e['schema']!='rocketdict-full-opticks-run20-fraction-denominator-truncation-doe/1': raise SystemExit('schema drift')
          if e['trigger_sequences']!=[1570] or len(e['records'])!=1: raise SystemExit('trigger census drift')
          if e['database_unchanged'] is not True or e['source_coverage_byte_exact'] is not True: raise SystemExit('read-only invariant drift')
          if e['promotion_allowed'] is not False or e['automatic_product_default_allowed'] is not False: raise SystemExit('DOE unexpectedly authorizes promotion')
          if e['n_best_cherry_picking'] is not False: raise SystemExit('n-best policy drift')
          print('Run20 fraction-denominator truncation DOE verified.')
          PY
      - name: Upload DOE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-full-opticks-run20-fraction-denominator-truncation-doe
          path: |
            work/tc-big-asset-build.json
            work/run20-fraction-denominator-truncation-doe/*.json
          if-no-files-found: error
          retention-days: 90
