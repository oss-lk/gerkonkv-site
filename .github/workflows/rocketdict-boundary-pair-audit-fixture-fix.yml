name: RocketDict Boundary-Pair Audit Fixture Fix

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - '.github/workflows/rocketdict-boundary-pair-audit-fixture-fix.yml'

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/product-core-forward
          fetch-depth: 0

      - name: Replace only the independently observed beam-6 rank0 fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('rocketdict-workbench/tests/real_translation_full_opticks_tc_big_boundary_pair_punctuation_rescue.py')
          text = path.read_text(encoding='utf-8')
          old = (
              '    "И откуда, кроме как от этой притягательной силы, та вода, которая одна только "\n'
              '    "источает мягкую теплую жару, не источает из соли татарской без большой жары?"\n'
          )
          new = (
              '    "И откуда, кроме как от этой притягательной силы, та вода, которая одна только "\n'
              '    "источает мягкую теплую жару, не будет источать из соли татарской без большой жары?"\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected-target fixture drift: occurrences={text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- rocketdict-workbench/tests/real_translation_full_opticks_tc_big_boundary_pair_punctuation_rescue.py

      - name: Commit verified fixture observation and remove one-shot workflow
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/rocketdict-boundary-pair-audit-fixture-fix.yml
          git add rocketdict-workbench/tests/real_translation_full_opticks_tc_big_boundary_pair_punctuation_rescue.py
          git diff --cached --check
          git commit -m "Pin observed beam-6 boundary-pair rank0 evidence"
          git push origin HEAD:chatgpt/product-core-forward

      - name: Dispatch the persisted full-Opticks replay on the repaired HEAD
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run rocketdict-full-opticks-tc-big-boundary-pair-punctuation-rescue.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref chatgpt/product-core-forward
