name: RocketDict Full Opticks Run18 Capped Question Context DOE

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - 'rocketdict-workbench/tests/real_translation_full_opticks_run18_capped_question_context_doe.py'
      - '.github/workflows/rocketdict-full-opticks-run18-capped-question-context-doe.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  run18-capped-question-context-doe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUN18_RUN_ID: '34675224977'
      RUN18_ARTIFACT_NAME: rocketdict-full-opticks-tc-big-orphan-closing-parenthesis-rescue
      RUN18_DB_SHA256: 803a2cbccb287ad0fadf4b14d932e1e33ebafef2ec5406619b0caf0898525143
      OPUS_URL: https://object.pouta.csc.fi/OPUS-MT-models/en-ru/opus-2020-02-11.zip
      OPUS_SHA256: 798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677
      ROCKETDICT_OPUS_ASSET_DIR: ${{ github.workspace }}/work/opus-asset
      TC_BIG_REPO: Helsinki-NLP/opus-mt-tc-big-en-zle
      TC_BIG_REVISION: 708be1d372fe4c358a352f404e6dc9ca0126ba48
      TC_BIG_WEIGHTS_SHA256: e68caa9a233c177a3489257b69c18cece6da97767ab2581918ce3fc3c3899416
      TC_BIG_SNAPSHOT: ${{ github.workspace }}/work/tc-big-snapshot
      ROCKETDICT_TC_BIG_ASSET_DIR: ${{ github.workspace }}/work/tc-big-asset
      ROCKETDICT_RUN18_QUESTION_CONTEXT_ROOT: ${{ github.workspace }}/work/full-opticks-run18-capped-question-context-doe
      HF_HUB_DISABLE_XET: '1'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install asset builders
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e './rocketdict-product-core[production,alt-mt]' -e ./rocketdict-workbench \
            'ctranslate2==4.8.2' 'sentencepiece==0.2.1' \
            'transformers==4.56.2' 'sacremoses==0.1.1' \
            'huggingface_hub==0.34.4' 'safetensors==0.6.2'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'

      - name: Download immutable run18 evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.RUN18_ARTIFACT_NAME }}
          path: work/run18
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.RUN18_RUN_ID }}

      - name: Stage exact run18 database
        shell: bash
        run: |
          set -euo pipefail
          source_db=work/run18/full-opticks-tc-big-orphan-closing-parenthesis-rescue/rocketdict.sqlite
          test -s "$source_db"
          echo "$RUN18_DB_SHA256  $source_db" | sha256sum -c -
          mkdir -p "$ROCKETDICT_RUN18_QUESTION_CONTEXT_ROOT"
          cp "$source_db" "$ROCKETDICT_RUN18_QUESTION_CONTEXT_ROOT/rocketdict.sqlite"
          echo "$RUN18_DB_SHA256  $ROCKETDICT_RUN18_QUESTION_CONTEXT_ROOT/rocketdict.sqlite" | sha256sum -c -

      - name: Restore pinned OPUS archive cache
        uses: actions/cache@v4
        with:
          path: work/opus-2020-02-11.zip
          key: rocketdict-opus-en-ru-2020-02-11-798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677

      - name: Obtain and verify pinned OPUS archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          if [ ! -s work/opus-2020-02-11.zip ]; then
            rm -f work/opus-2020-02-11.zip.tmp
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 "$OPUS_URL" -o work/opus-2020-02-11.zip.tmp
            echo "$OPUS_SHA256  work/opus-2020-02-11.zip.tmp" | sha256sum -c -
            mv work/opus-2020-02-11.zip.tmp work/opus-2020-02-11.zip
          fi
          echo "$OPUS_SHA256  work/opus-2020-02-11.zip" | sha256sum -c -

      - name: Build verified offline OPUS asset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROCKETDICT_OPUS_ASSET_DIR"
          rocketdict-assets build-opus-en-ru work/opus-2020-02-11.zip "$ROCKETDICT_OPUS_ASSET_DIR" \
            | tee work/question-context-opus-asset-build.json

      - name: Restore pinned TC-big snapshot cache
        uses: actions/cache@v4
        with:
          path: work/tc-big-snapshot
          key: rocketdict-tc-big-en-zle-708be1d372fe4c358a352f404e6dc9ca0126ba48-e68caa9a

      - name: Obtain exact pinned TC-big snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id=os.environ['TC_BIG_REPO'],
              revision=os.environ['TC_BIG_REVISION'],
              local_dir=os.environ['TC_BIG_SNAPSHOT'],
              allow_patterns=[
                  'README.md','config.json','generation_config.json','model.safetensors',
                  'source.spm','special_tokens_map.json','target.spm','tokenizer_config.json','vocab.json'
              ],
          )
          PY
          echo "$TC_BIG_WEIGHTS_SHA256  $TC_BIG_SNAPSHOT/model.safetensors" | sha256sum -c -

      - name: Build byte-verified offline TC-big asset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROCKETDICT_TC_BIG_ASSET_DIR"
          rocketdict-assets build-tc-big-en-ru "$TC_BIG_SNAPSHOT" "$ROCKETDICT_TC_BIG_ASSET_DIR" \
            | tee work/question-context-tc-big-asset-build.json

      - name: Build torch-free DOE runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m venv work/question-context-runtime
          work/question-context-runtime/bin/python -m pip install --upgrade pip
          work/question-context-runtime/bin/python -m pip install \
            -e './rocketdict-product-core[production,alt-mt]' -e ./rocketdict-workbench
          work/question-context-runtime/bin/python - <<'PY'
          import importlib.util
          if importlib.util.find_spec('torch') is not None:
              raise SystemExit('Torch unexpectedly installed in question-context inference runtime')
          PY

      - name: Run exact run18 capped question-context DOE
        shell: bash
        run: |
          set -euo pipefail
          work/question-context-runtime/bin/python -u \
            rocketdict-workbench/tests/real_translation_full_opticks_run18_capped_question_context_doe.py \
            | tee "$ROCKETDICT_RUN18_QUESTION_CONTEXT_ROOT/summary.json"

      - name: Verify persisted DOE contract
        shell: bash
        run: |
          set -euo pipefail
          echo "$RUN18_DB_SHA256  $ROCKETDICT_RUN18_QUESTION_CONTEXT_ROOT/rocketdict.sqlite" | sha256sum -c -
          work/question-context-runtime/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['ROCKETDICT_RUN18_QUESTION_CONTEXT_ROOT'])
          evidence = json.loads((root/'full-opticks-run18-capped-question-context-doe.json').read_text(encoding='utf-8'))
          if evidence['schema'] != 'rocketdict-full-opticks-run18-capped-question-context-doe/1':
              raise SystemExit('schema drift')
          if evidence['base_hard_gate_counts'] != {'numeric_symbol':20,'punctuation':16,'length':0,'unique':35}:
              raise SystemExit(f"base count drift: {evidence['base_hard_gate_counts']!r}")
          if evidence['context_sequences'] != [2462,2726] or evidence['whole_context_token_cap'] != 160:
              raise SystemExit('question-context cohort drift')
          cases = {row['context_sequence']: row for row in evidence['cases']}
          if cases[2462]['nlp_token_count'] != 71 or cases[2726]['nlp_token_count'] != 157:
              raise SystemExit('question-context token-count drift')
          if any(len(case['models']['opus']['candidates']) != 6 or len(case['models']['tc_big']['candidates']) != 6 for case in evidence['cases']):
              raise SystemExit('n-best cardinality drift')
          for result in evidence['counterfactuals'].values():
              counts = result['hard_gate_counts']
              base = evidence['base_hard_gate_counts']
              if any(counts[key] > base[key] for key in base):
                  raise SystemExit(f"counterfactual regression: {result!r}")
          if evidence['source_coverage_byte_exact'] is not True or evidence['database_unchanged'] is not True:
              raise SystemExit('read-only/source-coverage proof missing')
          for flag in ('source_bytes_rewritten','target_rewriting','placeholders','post_translation_literal_injection','corpus_specific_target_patches','evaluator_weakened'):
              if evidence[flag] is not False:
                  raise SystemExit(f"unsafe flag drift: {flag}")
          if evidence['promotion_allowed'] is not False or evidence['automatic_product_default_allowed'] is not False:
              raise SystemExit('DOE unexpectedly authorizes promotion')
          print(json.dumps({
              'contexts': evidence['context_sequences'],
              'counterfactuals': evidence['counterfactuals'],
              'evidence_sha256': evidence['evidence_sha256'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Record runtime evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$ROCKETDICT_RUN18_QUESTION_CONTEXT_ROOT/runtime-evidence"
          work/question-context-runtime/bin/python -VV > "$ROCKETDICT_RUN18_QUESTION_CONTEXT_ROOT/runtime-evidence/python.txt" 2>&1
          work/question-context-runtime/bin/python -m pip freeze | sort > "$ROCKETDICT_RUN18_QUESTION_CONTEXT_ROOT/runtime-evidence/pip-freeze.txt" 2>&1
          sha256sum work/opus-2020-02-11.zip > "$ROCKETDICT_RUN18_QUESTION_CONTEXT_ROOT/runtime-evidence/opus.sha256" 2>&1
          sha256sum "$TC_BIG_SNAPSHOT/model.safetensors" > "$ROCKETDICT_RUN18_QUESTION_CONTEXT_ROOT/runtime-evidence/tc-big-weights.sha256" 2>&1

      - name: Upload persisted DOE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-full-opticks-run18-capped-question-context-doe
          path: |
            work/full-opticks-run18-capped-question-context-doe/full-opticks-run18-capped-question-context-doe.json
            work/full-opticks-run18-capped-question-context-doe/summary.json
            work/full-opticks-run18-capped-question-context-doe/runtime-evidence
            work/question-context-opus-asset-build.json
            work/question-context-tc-big-asset-build.json
          if-no-files-found: warn
          retention-days: 90
