name: RocketDict Full Opticks TC-big Angular DMS Composed Product Rescue

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - 'rocketdict-product-core/src/rocketdict/translation_tc_big_angular_minute_rescue_stage.py'
      - 'rocketdict-product-core/src/rocketdict/translation_tc_big_short_angular_dms_rescue_stage.py'
      - 'rocketdict-product-core/tests/test_translation_tc_big_angular_minute_rescue_stage.py'
      - 'rocketdict-product-core/tests/test_translation_tc_big_short_angular_dms_rescue_stage.py'
      - 'rocketdict-workbench/tests/real_translation_full_opticks_tc_big_angular_dms_composed_product_rescue.py'
      - '.github/workflows/rocketdict-full-opticks-tc-big-angular-dms-composed-product-rescue.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  composed-product-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUN14_RUN_ID: '34643230375'
      RUN14_ARTIFACT_NAME: rocketdict-full-opticks-tc-big-equals-addition-product-rescue
      RUN14_DB_SHA256: dfce68a8f7cae08b90380630ae29e31418b4d6e8987d3e7001fe72fa1d781304
      TC_BIG_REPO: Helsinki-NLP/opus-mt-tc-big-en-zle
      TC_BIG_REVISION: 708be1d372fe4c358a352f404e6dc9ca0126ba48
      TC_BIG_WEIGHTS_SHA256: e68caa9a233c177a3489257b69c18cece6da97767ab2581918ce3fc3c3899416
      TC_BIG_SNAPSHOT: ${{ github.workspace }}/work/tc-big-snapshot
      ROCKETDICT_TC_BIG_ASSET_DIR: ${{ github.workspace }}/work/tc-big-asset
      ROCKETDICT_TC_BIG_ANGULAR_DMS_PRODUCT_ROOT: ${{ github.workspace }}/work/tc-big-angular-dms-composed-product-rescue
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install builder and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ./rocketdict-product-core \
            'pytest>=8,<9' 'ctranslate2==4.8.2' 'sentencepiece==0.2.1' 'transformers==4.56.2' \
            'sacremoses==0.1.1' 'huggingface_hub==0.34.4' 'safetensors==0.6.2'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'

      - name: Run narrow wrapper unit regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            rocketdict-product-core/tests/test_translation_tc_big_angular_minute_rescue_stage.py \
            rocketdict-product-core/tests/test_translation_tc_big_short_angular_dms_rescue_stage.py

      - name: Download immutable persisted run-14 database
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.RUN14_ARTIFACT_NAME }}
          path: work/run14
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.RUN14_RUN_ID }}

      - name: Verify immutable run-14 database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROCKETDICT_TC_BIG_ANGULAR_DMS_PRODUCT_ROOT"
          cp work/run14/tc-big-equals-product-rescue/rocketdict.sqlite "$ROCKETDICT_TC_BIG_ANGULAR_DMS_PRODUCT_ROOT/rocketdict.sqlite"
          echo "$RUN14_DB_SHA256  $ROCKETDICT_TC_BIG_ANGULAR_DMS_PRODUCT_ROOT/rocketdict.sqlite" | sha256sum -c -

      - name: Restore pinned TC-big snapshot cache
        uses: actions/cache@v4
        with:
          path: work/tc-big-snapshot
          key: rocketdict-tc-big-en-zle-708be1d372fe4c358a352f404e6dc9ca0126ba48-e68caa9a

      - name: Obtain exact pinned TC-big snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id=os.environ['TC_BIG_REPO'],
              revision=os.environ['TC_BIG_REVISION'],
              local_dir=os.environ['TC_BIG_SNAPSHOT'],
              allow_patterns=[
                  'README.md','config.json','generation_config.json','model.safetensors',
                  'source.spm','special_tokens_map.json','target.spm','tokenizer_config.json','vocab.json'
              ],
          )
          PY
          echo "$TC_BIG_WEIGHTS_SHA256  $TC_BIG_SNAPSHOT/model.safetensors" | sha256sum -c -

      - name: Build byte-verified offline TC-big asset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROCKETDICT_TC_BIG_ASSET_DIR"
          rocketdict-assets build-tc-big-en-ru "$TC_BIG_SNAPSHOT" "$ROCKETDICT_TC_BIG_ASSET_DIR" | tee work/angular-dms-asset-build.json

      - name: Build torch-free product-audit runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m venv work/angular-dms-runtime-venv
          work/angular-dms-runtime-venv/bin/python -m pip install --upgrade pip
          work/angular-dms-runtime-venv/bin/python -m pip install -e './rocketdict-product-core[alt-mt]' -e ./rocketdict-workbench
          work/angular-dms-runtime-venv/bin/python - <<'PY'
          import importlib.util
          if importlib.util.find_spec('torch') is not None:
              raise SystemExit('Torch unexpectedly installed in product-audit inference runtime')
          PY

      - name: Run persisted composed full-corpus audit
        shell: bash
        run: |
          set -euo pipefail
          work/angular-dms-runtime-venv/bin/python -u \
            rocketdict-workbench/tests/real_translation_full_opticks_tc_big_angular_dms_composed_product_rescue.py

      - name: Verify persisted audit evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['ROCKETDICT_TC_BIG_ANGULAR_DMS_PRODUCT_ROOT'])
          p = root/'full-opticks-tc-big-angular-dms-composed-product-rescue.json'
          e = json.loads(p.read_text(encoding='utf-8'))
          if e['schema'] != 'rocketdict-full-opticks-tc-big-angular-dms-composed-product-rescue-optin/1':
              raise SystemExit('schema drift')
          if e['base_hard_gate_counts'] != {'numeric_symbol':22,'punctuation':18,'length':0,'unique':39}:
              raise SystemExit(f"base count drift: {e['base_hard_gate_counts']!r}")
          if e['angular_hard_gate_counts'] != {'numeric_symbol':21,'punctuation':18,'length':0,'unique':38}:
              raise SystemExit(f"angular count drift: {e['angular_hard_gate_counts']!r}")
          if e['final_hard_gate_counts'] != {'numeric_symbol':20,'punctuation':18,'length':0,'unique':37}:
              raise SystemExit(f"final count drift: {e['final_hard_gate_counts']!r}")
          if e['angular_changed_source_starts'] != [431358]:
              raise SystemExit('angular changed-row cohort drift')
          if e['dms_attempted_source_starts'] != [110881] or e['dms_accepted_source_starts'] != [110881]:
              raise SystemExit('DMS source cohort drift')
          if e['dms_selected_ranks'] != [2] or e['dms_selected_targets'] != ["Откуда этот угол 2 град. 0'. 7''."]:
              raise SystemExit('DMS selection drift')
          if e['dms_untouched_angular_exact_count'] != 3343 or e['source_coverage_byte_exact'] is not True:
              raise SystemExit('coverage/untouched drift')
          if e['sqlite_integrity_check'] != 'ok' or e['sqlite_foreign_key_violation_count'] != 0:
              raise SystemExit('SQLite integrity drift')
          if e['promotion_allowed'] is not False or e['automatic_product_default_allowed'] is not False or e['public_stage12_surface_allowed'] is not False:
              raise SystemExit('unsafe promotion flags')
          if any(e.get(flag) is not False for flag in ('source_bytes_rewritten','target_rewriting','placeholders','post_translation_literal_injection','corpus_specific_target_patches')):
              raise SystemExit('unsafe evidence flags')
          print(json.dumps({
              'final_run_id': e['final_translation_run_id'],
              'final_output_sha256': e['final_translation_output_sha256'],
              'persisted_database_sha256': e['persisted_database_sha256'],
              'evidence_sha256': e['evidence_sha256'],
          }, indent=2))
          PY

      - name: Upload composed persisted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-full-opticks-tc-big-angular-dms-composed-product-rescue
          path: |
            work/angular-dms-asset-build.json
            work/tc-big-angular-dms-composed-product-rescue/full-opticks-tc-big-angular-dms-composed-product-rescue.json
            work/tc-big-angular-dms-composed-product-rescue/rocketdict.sqlite
          if-no-files-found: warn
          retention-days: 90
