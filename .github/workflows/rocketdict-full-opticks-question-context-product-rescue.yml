name: RocketDict Full Opticks Question Context Product Rescue

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - 'rocketdict-product-core/src/rocketdict/translation_question_context_rescue_stage.py'
      - 'rocketdict-product-core/tests/test_translation_question_context_rescue_stage.py'
      - 'rocketdict-workbench/tests/real_translation_full_opticks_question_context_product_rescue.py'
      - '.github/workflows/rocketdict-full-opticks-question-context-product-rescue.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  full-opticks-question-context-rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      RUN18_RUN_ID: '34675224977'
      RUN18_ARTIFACT_NAME: rocketdict-full-opticks-tc-big-orphan-closing-parenthesis-rescue
      RUN18_DB_SHA256: 803a2cbccb287ad0fadf4b14d932e1e33ebafef2ec5406619b0caf0898525143
      OPUS_URL: https://object.pouta.csc.fi/OPUS-MT-models/en-ru/opus-2020-02-11.zip
      OPUS_SHA256: 798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677
      ROCKETDICT_OPUS_ASSET_DIR: ${{ github.workspace }}/work/opus-asset
      ROCKETDICT_QUESTION_CONTEXT_PRODUCT_ROOT: ${{ github.workspace }}/work/full-opticks-question-mark-whole-context-rescue

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install maintained Product and Workbench runtimes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e './rocketdict-product-core[production]' -e ./rocketdict-workbench

      - name: Download immutable run18 evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.RUN18_ARTIFACT_NAME }}
          path: work/run18
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.RUN18_RUN_ID }}

      - name: Stage exact run18 database
        shell: bash
        run: |
          set -euo pipefail
          source_db=work/run18/full-opticks-tc-big-orphan-closing-parenthesis-rescue/rocketdict.sqlite
          test -s "$source_db"
          echo "$RUN18_DB_SHA256  $source_db" | sha256sum -c -
          mkdir -p "$ROCKETDICT_QUESTION_CONTEXT_PRODUCT_ROOT"
          cp "$source_db" "$ROCKETDICT_QUESTION_CONTEXT_PRODUCT_ROOT/rocketdict.sqlite"
          echo "$RUN18_DB_SHA256  $ROCKETDICT_QUESTION_CONTEXT_PRODUCT_ROOT/rocketdict.sqlite" | sha256sum -c -

      - name: Restore pinned OPUS archive cache
        uses: actions/cache@v4
        with:
          path: work/opus-2020-02-11.zip
          key: rocketdict-opus-en-ru-2020-02-11-798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677

      - name: Obtain and verify official OPUS archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          if [ ! -s work/opus-2020-02-11.zip ]; then
            rm -f work/opus-2020-02-11.zip.tmp
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 "$OPUS_URL" -o work/opus-2020-02-11.zip.tmp
            echo "$OPUS_SHA256  work/opus-2020-02-11.zip.tmp" | sha256sum -c -
            mv work/opus-2020-02-11.zip.tmp work/opus-2020-02-11.zip
          fi
          echo "$OPUS_SHA256  work/opus-2020-02-11.zip" | sha256sum -c -

      - name: Build verified offline CTranslate2 float32 asset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROCKETDICT_OPUS_ASSET_DIR"
          rocketdict-assets build-opus-en-ru work/opus-2020-02-11.zip "$ROCKETDICT_OPUS_ASSET_DIR" \
            | tee work/question-context-opus-asset-build.json
          test -s "$ROCKETDICT_OPUS_ASSET_DIR/rocketdict-opus-asset.json"
          test -s "$ROCKETDICT_OPUS_ASSET_DIR/ct2/model.bin"

      - name: Prove inference runtime stays Torch-free
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          if importlib.util.find_spec('torch') is not None:
              raise SystemExit('Torch unexpectedly installed in question-context replay runtime')
          PY

      - name: Run exact run18 question-context rescue and audit
        shell: bash
        run: |
          set -euo pipefail
          python -u rocketdict-workbench/tests/real_translation_full_opticks_question_context_product_rescue.py \
            | tee "$ROCKETDICT_QUESTION_CONTEXT_PRODUCT_ROOT/summary.json"

      - name: Verify persisted evidence contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['ROCKETDICT_QUESTION_CONTEXT_PRODUCT_ROOT'])
          evidence = json.loads((root/'full-opticks-question-mark-whole-context-rescue.json').read_text(encoding='utf-8'))
          if evidence['schema'] != 'rocketdict-full-opticks-question-mark-whole-context-rescue-optin/1':
              raise SystemExit('schema drift')
          if evidence['base_hard_gate_counts'] != {'numeric_symbol':20,'punctuation':16,'length':0,'unique':35}:
              raise SystemExit(f"base count drift: {evidence['base_hard_gate_counts']!r}")
          if evidence['final_hard_gate_counts'] != {'numeric_symbol':20,'punctuation':15,'length':0,'unique':34}:
              raise SystemExit(f"final count drift: {evidence['final_hard_gate_counts']!r}")
          if evidence['attempted_context_sequences'] != [2462,2726]:
              raise SystemExit('attempt cohort drift')
          if evidence['accepted_context_sequences'] != [2462] or evidence['rejected_context_sequences'] != [2726]:
              raise SystemExit('selection cohort drift')
          if evidence['selected_rank'] != 0 or evidence['accepted_source_start'] != 477054:
              raise SystemExit('raw rank0 identity drift')
          if evidence['base_segment_count'] != 3343 or evidence['final_segment_count'] != 3342:
              raise SystemExit('segment-count drift')
          if evidence['untouched_base_row_count'] != 3341 or evidence['untouched_target_drift_count'] != 0:
              raise SystemExit('untouched-row drift')
          if evidence['source_coverage_byte_exact'] is not True:
              raise SystemExit('source coverage drift')
          if evidence['database_integrity_check'] != 'ok' or evidence['foreign_key_violation_count'] != 0:
              raise SystemExit('database integrity drift')
          if evidence['semantic_review']['all_diagnostic_anchors'] is not True:
              raise SystemExit('semantic diagnostic drift')
          if any(evidence.get(flag) is not False for flag in (
              'source_bytes_rewritten','target_rewriting','placeholders',
              'post_translation_literal_injection','corpus_specific_target_patches','evaluator_weakened'
          )):
              raise SystemExit('unsafe evidence flag')
          if evidence['promotion_allowed'] is not False or evidence['automatic_product_default_allowed'] is not False:
              raise SystemExit('research-only promotion guard drift')
          print(json.dumps({
              'base': evidence['base_hard_gate_counts'],
              'final': evidence['final_hard_gate_counts'],
              'attempted_contexts': evidence['attempted_context_sequences'],
              'accepted_contexts': evidence['accepted_context_sequences'],
              'rejected_contexts': evidence['rejected_context_sequences'],
              'final_output_sha256': evidence['final_output_sha256'],
              'final_database_sha256': evidence['final_database_sha256'],
              'evidence_sha256': evidence['evidence_sha256'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Record runtime evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$ROCKETDICT_QUESTION_CONTEXT_PRODUCT_ROOT/runtime-evidence"
          python -VV > "$ROCKETDICT_QUESTION_CONTEXT_PRODUCT_ROOT/runtime-evidence/python.txt" 2>&1
          python -m pip freeze | sort > "$ROCKETDICT_QUESTION_CONTEXT_PRODUCT_ROOT/runtime-evidence/pip-freeze.txt" 2>&1
          sha256sum work/opus-2020-02-11.zip > "$ROCKETDICT_QUESTION_CONTEXT_PRODUCT_ROOT/runtime-evidence/opus.sha256" 2>&1

      - name: Upload persisted question-context evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-full-opticks-question-mark-whole-context-rescue
          path: |
            work/full-opticks-question-mark-whole-context-rescue/full-opticks-question-mark-whole-context-rescue.json
            work/full-opticks-question-mark-whole-context-rescue/summary.json
            work/full-opticks-question-mark-whole-context-rescue/rocketdict.sqlite
            work/full-opticks-question-mark-whole-context-rescue/runtime-evidence
            work/question-context-opus-asset-build.json
          if-no-files-found: warn
          retention-days: 90
