name: RocketDict Stage 8 public API artifact recovery

on:
  push:
    branches: [main]
    paths:
      - 'rocketdict-ci/recover_stage8_api_artifacts.py'
      - '.github/workflows/rocketdict-stage8-api-artifact-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover-api-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Scan surviving Actions artifacts for exact RocketDict public API/core bytes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python rocketdict-ci/recover_stage8_api_artifacts.py
      - name: Upload API artifact recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-stage8-api-artifact-recovery
          path: rocketdict-stage8-api-artifact-recovery
          if-no-files-found: error
