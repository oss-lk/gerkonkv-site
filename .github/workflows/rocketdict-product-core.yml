name: RocketDict Product Core

on:
  push:
    branches: [main, chatgpt/product-core-forward]
    paths:
      - 'rocketdict-product-core/**'
      - 'rocketdict-workbench/**'
      - '.github/workflows/rocketdict-product-core.yml'
  pull_request:
    paths:
      - 'rocketdict-product-core/**'
      - 'rocketdict-workbench/**'
      - '.github/workflows/rocketdict-product-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-light:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install maintained core and Workbench
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ./rocketdict-product-core
          python -m pip install -e ./rocketdict-workbench
      - name: Compile maintained Product Core and Workbench
        run: |
          python -m compileall -q rocketdict-product-core/src
          python -m compileall -q rocketdict-workbench/src
      - name: Smoke installed Product/Core CLIs
        run: |
          rocketdict-core --help >/dev/null
          rocketdict-assets --help >/dev/null
          rocketdict-product-run --help >/dev/null
          rocketdict-workbench --help >/dev/null
      - name: Run Product Core tests
        run: pytest -q rocketdict-product-core/tests --ignore=rocketdict-product-core/tests/real_runtime_smoke.py
      - name: Run Workbench regressions against maintained core installation
        run: pytest -q rocketdict-workbench/tests

  real-runtime:
    needs: dependency-light
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPUS_URL: https://object.pouta.csc.fi/OPUS-MT-models/en-ru/opus-2020-02-11.zip
      OPUS_SHA256: 798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677
      CEFRJ_URL: https://raw.githubusercontent.com/openlanguageprofiles/olp-en-cefrj/master/cefrj-vocabulary-profile-1.5.csv
      CEFRJ_SHA256: b0dd3c635f1c9a4fdf1490c7e5b7c48e8bbe55b652ad0c9860a95f98e10ae498
      CEFRJ_BYTES: '233214'
      ROCKETDICT_OPUS_ASSET_DIR: ${{ github.workspace }}/work/opus-asset
      ROCKETDICT_CEFRJ_ASSET: ${{ github.workspace }}/work/cefrj-vocabulary-profile-1.5.csv
      ROCKETDICT_REAL_SMOKE_ROOT: ${{ github.workspace }}/work/real-smoke
      ROCKETDICT_PRODUCT_RUN_SMOKE_ROOT: ${{ github.workspace }}/work/product-run-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production NLP, MT and pronunciation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './rocketdict-product-core[production]'
          python -m pip install -e ./rocketdict-workbench
          python -m pip install 'https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl'
      - name: Restore pinned OPUS archive cache
        uses: actions/cache@v4
        with:
          path: work/opus-2020-02-11.zip
          key: rocketdict-opus-en-ru-2020-02-11-798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677
      - name: Obtain and verify official OPUS EN-RU archive
        run: |
          mkdir -p work
          if [ ! -s work/opus-2020-02-11.zip ]; then
            rm -f work/opus-2020-02-11.zip.tmp
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 "$OPUS_URL" -o work/opus-2020-02-11.zip.tmp
            echo "$OPUS_SHA256  work/opus-2020-02-11.zip.tmp" | sha256sum -c -
            mv work/opus-2020-02-11.zip.tmp work/opus-2020-02-11.zip
          fi
          echo "$OPUS_SHA256  work/opus-2020-02-11.zip" | sha256sum -c -
      - name: Build verified offline CTranslate2 float32 asset
        run: |
          rocketdict-assets build-opus-en-ru work/opus-2020-02-11.zip "$ROCKETDICT_OPUS_ASSET_DIR" | tee work/opus-asset-build.json
          test -s "$ROCKETDICT_OPUS_ASSET_DIR/rocketdict-opus-asset.json"
          test -s "$ROCKETDICT_OPUS_ASSET_DIR/ct2/model.bin"
      - name: Download and verify pinned CEFR-J evidence
        run: |
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 "$CEFRJ_URL" -o "$ROCKETDICT_CEFRJ_ASSET"
          echo "$CEFRJ_SHA256  $ROCKETDICT_CEFRJ_ASSET" | sha256sum -c -
          test "$(wc -c < "$ROCKETDICT_CEFRJ_ASSET" | tr -d ' ')" = "$CEFRJ_BYTES"
      - name: Prove live runtime and downstream evidence availability
        run: |
          python - <<'PY'
          import json
          from rocketdict.api.registry import lab_manifest
          manifest=lab_manifest(probe_runtime=True)
          stages={int(s['number']):s for s in manifest['stages']}
          def available(stage,key):
              row=next(i for i in stages[stage]['implementations'] if i['implementation_key']==key)
              return row['availability']
          evidence={
              'stage8':available(8,'en-sm'),
              'stage12':available(12,'opus-en-ru-ct2'),
              'stage20':available(20,'contextual-lexical-opus-v3'),
              'stage21':available(21,'cefrj-vocabulary-1.5'),
              'stage22':available(22,'cmudict-production'),
              'registry_hash':manifest['registry_hash'],
          }
          print(json.dumps(evidence,ensure_ascii=False,indent=2))
          for stage in ('stage8','stage12','stage20','stage21','stage22'):
              if evidence[stage].get('available') is not True:
                  raise SystemExit(f'{stage} production evidence is not available: {evidence[stage]}')
          PY
      - name: Run real maintained-core Stage8 through Stage25 smoke
        run: python rocketdict-product-core/tests/real_runtime_smoke.py
      - name: Run real unified rocketdict-product-run source through Stage25 smoke
        run: python -u rocketdict-workbench/tests/real_product_run_smoke.py
      - name: Record runtime identities and resources
        if: always()
        run: |
          mkdir -p work/evidence
          python -VV > work/evidence/python.txt || true
          python -m pip freeze | sort > work/evidence/pip-freeze.txt || true
          df -h > work/evidence/disk.txt || true
          free -h > work/evidence/memory.txt || true
          sha256sum work/opus-2020-02-11.zip > work/evidence/opus.sha256 || true
          sha256sum "$ROCKETDICT_CEFRJ_ASSET" > work/evidence/cefrj.sha256 || true
      - name: Upload real-runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-product-core-real-runtime
          path: |
            work/opus-asset-build.json
            work/real-smoke/real-runtime-smoke.json
            work/real-smoke/product-export.json
            work/product-run-smoke/real-product-run-smoke.json
            work/product-run-smoke/real-product-run-failure.json
            work/product-run-smoke/*.product-export.json
            work/evidence/**
          if-no-files-found: warn
          retention-days: 14
