name: RocketDict forward downstream readonly repair

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - '.github/workflows/rocketdict-forward-downstream-readonly-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/product-core-forward
      - name: Patch readonly schema boundaries and Stage23 parameters
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('rocketdict-product-core/src/rocketdict/downstream.py')
          text = path.read_text(encoding='utf-8')
          marker = '''def ensure_downstream_schema(connection) -> None:  # type: ignore[no-untyped-def]\n    ensure_lexical_schema(connection)\n    connection.executescript(_DOWNSTREAM_SCHEMA)\n'''
          replacement = marker + '''\n\ndef ensure_downstream_database(database: Path | str) -> None:\n    """Create/upgrade maintained downstream tables on a writable connection.\n\n    Read-only evidence paths must never attempt schema DDL.  Call this before\n    opening the corresponding read-only snapshot.\n    """\n    database = Path(database).expanduser().resolve()\n    with transaction(database) as connection:\n        ensure_downstream_schema(connection)\n'''
          if marker not in text:
              raise SystemExit('schema marker not found')
          text = text.replace(marker, replacement, 1)
          readonly = '''with connect(database, readonly=True) as connection:\n        ensure_downstream_schema(connection)'''
          replacement_readonly = '''ensure_downstream_database(database)\n    with connect(database, readonly=True) as connection:'''
          count = text.count(readonly)
          if count < 6:
              raise SystemExit(f'expected at least 6 readonly schema calls, found {count}')
          text = text.replace(readonly, replacement_readonly)
          bad = '''if parameters.get("corpus_snapshots") not in {None, []}:'''
          good = '''if parameters.get("corpus_snapshots") not in (None, []):'''
          if bad not in text:
              raise SystemExit('Stage23 corpus_snapshots marker not found')
          text = text.replace(bad, good, 1)
          path.write_text(text, encoding='utf-8')
          print(f'patched {count} readonly schema calls')
          PY
      - name: Compile patched downstream
        run: python -m compileall -q rocketdict-product-core/src
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rocketdict-product-core/src/rocketdict/downstream.py
          git commit -m 'Keep downstream read paths truly readonly'
          git push origin HEAD:chatgpt/product-core-forward
