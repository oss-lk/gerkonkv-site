name: RocketDict Fix Parenthetical Wrapper Base

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - '.github/workflows/rocketdict-fix-parenthetical-wrapper-base.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/product-core-forward
      - name: Rebase wrapper on illustration parent
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('rocketdict-product-core/src/rocketdict/translation_tc_big_parenthetical_row_rescue_stage.py')
          text=path.read_text(encoding='utf-8')
          old='from .translation_emphasized_modifier_boundary_rescue_stage import (\n    run_stage12 as run_base_stage12,\n)'
          new='from .translation_illustration_rescue_stage import run_stage12 as run_base_stage12'
          if text.count(old)!=1:
              raise SystemExit(f'expected exactly one old base import, found {text.count(old)}')
          text=text.replace(old,new)
          path.write_text(text,encoding='utf-8')
          PY
          python -m py_compile rocketdict-product-core/src/rocketdict/translation_tc_big_parenthetical_row_rescue_stage.py
          git diff --check
          git diff -- rocketdict-product-core/src/rocketdict/translation_tc_big_parenthetical_row_rescue_stage.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rocketdict-product-core/src/rocketdict/translation_tc_big_parenthetical_row_rescue_stage.py
          git commit -m 'Fix TC-big parenthetical wrapper parent chain'
          git push origin HEAD:chatgpt/product-core-forward
