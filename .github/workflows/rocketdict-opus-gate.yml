name: RocketDict official OPUS gate

on:
  push:
    branches: [rocketdict-opus-gate-public]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-opus-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPUS_URL: https://object.pouta.csc.fi/OPUS-MT-models/en-ru/opus-2020-02-11.zip
      GUTENBERG_URL: https://www.gutenberg.org/cache/epub/33504/pg33504.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'ctranslate2>=4.5,<5' 'sentencepiece>=0.2,<1'
      - name: Download official model and public-domain Opticks
        run: |
          mkdir -p work/model-src work/model-ct2 work/corpus work/evidence work/output
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 "$OPUS_URL" -o work/opus.zip
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 "$GUTENBERG_URL" -o work/corpus/opticks.txt
          sha256sum work/opus.zip | tee work/evidence/opus.sha256
          sha256sum work/corpus/opticks.txt | tee work/evidence/opticks.sha256
          unzip -q work/opus.zip -d work/model-src
          find work/model-src -maxdepth 2 -type f -printf '%P\t%s bytes\n' | sort | tee work/evidence/opus-inventory.txt
      - name: Convert float32 and run real representative pilot
        run: |
          python - <<'PY'
          import json, os, pathlib, re, time
          import ctranslate2
          import sentencepiece as spm
          root=pathlib.Path('work'); src=root/'model-src'; ct2=root/'model-ct2'; ev=root/'evidence'
          candidates=[src]+[p for p in src.iterdir() if p.is_dir()]
          model=next((p for p in candidates if (p/'model.npz').is_file() and (p/'decoder.yml').is_file()),None)
          if model is None: raise SystemExit('Original Marian model not found')
          t=time.time(); ctranslate2.converters.OpusMTConverter(str(model)).convert(str(ct2),quantization='float32',force=True); conv=time.time()-t
          models=sorted(model.glob('*.spm')) or sorted(src.rglob('*.spm'))
          if len(models)<2: raise SystemExit(f'Need source and target SentencePiece models: {models}')
          ssp=next((p for p in models if 'source' in p.name.lower()),models[0])
          tsp=next((p for p in models if 'target' in p.name.lower() and p!=ssp),None) or next(p for p in models if p!=ssp)
          st=spm.SentencePieceProcessor(model_file=str(ssp)); tt=spm.SentencePieceProcessor(model_file=str(tsp))
          tr=ctranslate2.Translator(str(ct2),device='cpu',compute_type='float32')
          def tx(xs):
              r=tr.translate_batch([st.encode(x,out_type=str) for x in xs],beam_size=4,max_batch_size=32)
              return [tt.decode(y.hypotheses[0]) for y in r]
          smoke=['Light is composed of rays differently refrangible.','The same plane was used in the experiment.','The distance was 15 inches and not 50 inches.']
          smoke_ru=tx(smoke)
          if any(not x.strip() for x in smoke_ru): raise SystemExit('Empty real-model smoke')
          text=(root/'corpus'/'opticks.txt').read_text(encoding='utf-8-sig',errors='replace')
          words=len(re.findall(r"\b[\w’'-]+\b",text,flags=re.UNICODE))
          if words<90000: raise SystemExit(f'Opticks too small: {words}')
          sentences=[x.strip() for x in re.split(r'(?<=[.!?])\s+',text) if 4<=len(x.split())<=80]
          picks=[]
          for f in (.05,.25,.5,.75,.95):
              c=min(len(sentences)-1,int(len(sentences)*f)); picks+=sentences[max(0,c-12):min(len(sentences),c+12)]
          picks=picks[:120]
          t=time.time(); out=[]
          for i in range(0,len(picks),16): out+=tx(picks[i:i+16])
          pilot=time.time()-t
          if len(out)!=len(picks) or any(not x.strip() for x in out): raise SystemExit('Incomplete real pilot')
          payload={'schema':'rocketdict-github-real-opus-gate/1','real_model':True,'fake_or_identity_translation':False,'official_opus_url':os.environ['OPUS_URL'],'ctranslate2_version':ctranslate2.__version__,'sentencepiece_version':getattr(spm,'__version__',None),'compute_type':'float32','conversion_seconds':conv,'opticks_words_regex':words,'meets_90000_word_requirement':words>=90000,'representative_sentences':len(picks),'representative_words':sum(len(x.split()) for x in picks),'pilot_seconds':pilot,'smoke':[{'source':s,'translation':r} for s,r in zip(smoke,smoke_ru)],'representative_sample':[{'source':s,'translation':r} for s,r in list(zip(picks,out))[:20]]}
          ev.joinpath('real-opus-gate.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          root.joinpath('output/representative.tsv').write_text(''.join(f'{s}\t{r}\n' for s,r in zip(picks,out)),encoding='utf-8')
          print(json.dumps(payload,ensure_ascii=False,indent=2))
          PY
      - name: Runner evidence
        if: always()
        run: |
          df -h | tee work/evidence/disk.txt || true
          free -h | tee work/evidence/memory.txt || true
          python -VV | tee work/evidence/python.txt || true
          python -m pip freeze | sort | tee work/evidence/pip-freeze.txt || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-real-opus-gate
          path: |
            work/evidence/**
            work/output/**
          retention-days: 14
