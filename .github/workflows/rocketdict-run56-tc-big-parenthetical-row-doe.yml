name: RocketDict Run56 TC-big Parenthetical Row DOE

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - 'rocketdict-workbench/tests/real_translation_run56_tc_big_parenthetical_row_doe.py'
      - '.github/workflows/rocketdict-run56-tc-big-parenthetical-row-doe.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  tc-big-parenthetical-row-doe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE_WORKFLOW_RUN_ID: '34743281964'
      BASE_ARTIFACT_NAME: rocketdict-full-opticks-illustration-structural-promotion
      BASE_DB_SHA256: cb4568584e70be0fb4d011cd9de212ae01edd046dec8c5ec104ee3bb0e91dc56
      TC_BIG_REPO: Helsinki-NLP/opus-mt-tc-big-en-zle
      TC_BIG_REVISION: 708be1d372fe4c358a352f404e6dc9ca0126ba48
      TC_BIG_WEIGHTS_SHA256: e68caa9a233c177a3489257b69c18cece6da97767ab2581918ce3fc3c3899416
      TC_BIG_SNAPSHOT: ${{ github.workspace }}/work/tc-big-snapshot
      ROCKETDICT_TC_BIG_ASSET_DIR: ${{ github.workspace }}/work/tc-big-asset
      ROCKETDICT_RUN56_PARENTHESES_ROW_DOE_ROOT: ${{ github.workspace }}/work/run56-tc-big-parenthetical-row-doe
      ROCKETDICT_RUN56_PARENTHESES_ROW_DOE_DB: ${{ github.workspace }}/work/run56-tc-big-parenthetical-row-doe/rocketdict.sqlite
      HF_HUB_DISABLE_XET: '1'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install asset builders
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e './rocketdict-product-core[production,alt-mt]' -e ./rocketdict-workbench \
            'ctranslate2==4.8.2' 'sentencepiece==0.2.1' 'transformers==4.56.2' \
            'sacremoses==0.1.1' 'huggingface_hub==0.34.4' 'safetensors==0.6.2'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
      - name: Download verified run56 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BASE_ARTIFACT_NAME }}
          path: work/base
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BASE_WORKFLOW_RUN_ID }}
      - name: Authenticate and stage run56 database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROCKETDICT_RUN56_PARENTHESES_ROW_DOE_ROOT"
          python - <<'PY'
          import hashlib,os
          from pathlib import Path
          dbs=[p for p in Path('work/base').rglob('rocketdict.sqlite') if p.is_file()]
          if len(dbs)!=1: raise SystemExit(f'run56 DB cardinality drift: {dbs}')
          sha=hashlib.sha256(dbs[0].read_bytes()).hexdigest()
          if sha!=os.environ['BASE_DB_SHA256']: raise SystemExit(f'run56 DB identity drift: {sha}')
          Path(os.environ['ROCKETDICT_RUN56_PARENTHESES_ROW_DOE_DB']).write_bytes(dbs[0].read_bytes())
          PY
          echo "$BASE_DB_SHA256  $ROCKETDICT_RUN56_PARENTHESES_ROW_DOE_DB" | sha256sum -c -
      - name: Restore pinned TC-big snapshot cache
        uses: actions/cache@v4
        with:
          path: work/tc-big-snapshot
          key: rocketdict-tc-big-en-zle-708be1d372fe4c358a352f404e6dc9ca0126ba48-e68caa9a
      - name: Obtain and build pinned TC-big
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id=os.environ['TC_BIG_REPO'], revision=os.environ['TC_BIG_REVISION'], local_dir=os.environ['TC_BIG_SNAPSHOT'], allow_patterns=['README.md','config.json','generation_config.json','model.safetensors','source.spm','special_tokens_map.json','target.spm','tokenizer_config.json','vocab.json'])
          PY
          echo "$TC_BIG_WEIGHTS_SHA256  $TC_BIG_SNAPSHOT/model.safetensors" | sha256sum -c -
          rm -rf "$ROCKETDICT_TC_BIG_ASSET_DIR"
          rocketdict-assets build-tc-big-en-ru "$TC_BIG_SNAPSHOT" "$ROCKETDICT_TC_BIG_ASSET_DIR" > work/run56-parenthetical-row-tc-big.json
      - name: Build torch-free DOE runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m venv work/doe-venv
          work/doe-venv/bin/python -m pip install --upgrade pip
          work/doe-venv/bin/python -m pip install -e './rocketdict-product-core[production,alt-mt]' -e ./rocketdict-workbench
          work/doe-venv/bin/python - <<'PY'
          import importlib.util
          if importlib.util.find_spec('torch') is not None: raise SystemExit('torch leaked into row DOE runtime')
          PY
      - name: Run source-defined TC-big parenthetical row DOE
        shell: bash
        run: |
          set -euo pipefail
          work/doe-venv/bin/python -u rocketdict-workbench/tests/real_translation_run56_tc_big_parenthetical_row_doe.py | tee work/run56-parenthetical-row-doe.log
          echo "$BASE_DB_SHA256  $ROCKETDICT_RUN56_PARENTHESES_ROW_DOE_DB" | sha256sum -c -
      - name: Verify evidence contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ['ROCKETDICT_RUN56_PARENTHESES_ROW_DOE_ROOT'])/'run56-tc-big-parenthetical-row-doe.json'
          e=json.loads(p.read_text(encoding='utf-8'))
          if e['schema']!='rocketdict-run56-tc-big-parenthetical-row-doe/1': raise SystemExit('schema drift')
          if e['base_translation_run_id']!=56 or e['base_database_sha256']!=os.environ['BASE_DB_SHA256']: raise SystemExit('base identity drift')
          if e['punctuation_failure_count']!=14 or e['translation_segment_count']!=3335: raise SystemExit('cohort drift')
          if e['trigger_attempt_sequences']!=[741,1497,2108,2589,2719,3081]: raise SystemExit(f"trigger cohort drift: {e['trigger_attempt_sequences']}")
          if e['accepted_sequences']!=[741,1497,2108,2589]: raise SystemExit(f"accepted cohort drift: {e['accepted_sequences']}")
          if e['rejected_sequences']!=[2719,3081]: raise SystemExit(f"rejected cohort drift: {e['rejected_sequences']}")
          if not (e['database_unchanged'] and e['source_coverage_byte_exact'] and e['model_input_equals_immutable_source'] and e['raw_rank0_only']): raise SystemExit('DOE invariant drift')
          for case in e['cases']:
              if case['raw_rank']!=0 or case['model_input']!=case['source_text'] or case['model_input_equals_source'] is not True:
                  raise SystemExit(f"rank/model-input drift at {case['sequence_number']}")
          for flag in ('source_bytes_rewritten','model_input_source_rewritten','target_rewriting','placeholders','post_translation_literal_injection','corpus_specific_target_patches','evaluator_weakened','n_best_cherry_picking','automatic_n_best_cherry_picking'):
              if e[flag] is not False: raise SystemExit(f'unsafe flag {flag}')
          c=dict(e); recorded=c.pop('evidence_sha256'); actual=hashlib.sha256(json.dumps(c,ensure_ascii=False,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          if actual!=recorded: raise SystemExit('evidence SHA drift')
          print(json.dumps({'attempts':e['trigger_attempt_sequences'],'accepted':e['accepted_sequences'],'rejected':e['rejected_sequences'],'evidence_sha256':recorded},indent=2,ensure_ascii=False))
          PY
      - name: Upload row DOE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-run56-tc-big-parenthetical-row-doe
          path: |
            work/run56-parenthetical-row-tc-big.json
            work/run56-parenthetical-row-doe.log
            work/run56-tc-big-parenthetical-row-doe/*.json
          if-no-files-found: warn
          retention-days: 90
