name: RocketDict Stage7 structural recovery

on:
  push:
    branches: [main]
    paths:
      - 'rocketdict-ci/stage7_structural_recovery.py'
      - '.github/workflows/rocketdict-stage7-structural-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-stage7:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install historical Stage7 sentence runtime
        run: python -m pip install --disable-pip-version-check 'spacy==3.8.11' 'click==8.1.8'
      - name: Recover Stage7 from independent 90k invariants
        run: python rocketdict-ci/stage7_structural_recovery.py
      - uses: actions/upload-artifact@v4
        with:
          name: rocketdict-stage7-structural-recovery
          path: work-stage7-structural-recovery/output
          if-no-files-found: error
