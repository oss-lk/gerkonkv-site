name: RocketDict Run59 TC-big Complementary Question Clause DOE

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - 'rocketdict-workbench/tests/real_translation_run59_tc_big_complementary_question_clause_doe.py'
      - '.github/workflows/rocketdict-full-opticks-tc-big-ct2-parity-run9.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  tc-big-complementary-question-doe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUN59_RUN_ID: '34753122528'
      RUN59_ARTIFACT_NAME: rocketdict-canonical-run59-m2m100-arithmetic
      RUN59_DB_SHA256: 41bafa00619c83b87f55f7e452f8e9e27a1871d601bb5c846d3d561531dbb78d
      TC_BIG_REPO: Helsinki-NLP/opus-mt-tc-big-en-zle
      TC_BIG_REVISION: 708be1d372fe4c358a352f404e6dc9ca0126ba48
      TC_BIG_WEIGHTS_SHA256: e68caa9a233c177a3489257b69c18cece6da97767ab2581918ce3fc3c3899416
      ROCKETDICT_TC_BIG_MODEL_DIR: ${{ github.workspace }}/work/tc-big-source
      ROCKETDICT_TC_BIG_ASSET_DIR: ${{ github.workspace }}/work/tc-big-asset
      ROCKETDICT_RUN59_TC_BIG_COMPLEMENTARY_QUESTION_DOE_ROOT: ${{ github.workspace }}/work/run59-tc-big-complementary-question-clause-doe
      HF_HUB_DISABLE_XET: '1'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install provisioning runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e './rocketdict-product-core[production]' -e ./rocketdict-workbench \
            'transformers==4.56.2' 'huggingface_hub==0.34.4' 'safetensors==0.6.2' 'sentencepiece==0.2.1' 'sacremoses==0.1.1'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
      - name: Download canonical run59
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.RUN59_ARTIFACT_NAME }}
          path: work/run59
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.RUN59_RUN_ID }}
      - name: Stage exact canonical run59 database
        shell: bash
        run: |
          set -euo pipefail
          source_db=work/run59/canonical/rocketdict.sqlite
          echo "$RUN59_DB_SHA256  $source_db" | sha256sum -c -
          mkdir -p "$ROCKETDICT_RUN59_TC_BIG_COMPLEMENTARY_QUESTION_DOE_ROOT"
          cp "$source_db" "$ROCKETDICT_RUN59_TC_BIG_COMPLEMENTARY_QUESTION_DOE_ROOT/rocketdict.sqlite"
          echo "$RUN59_DB_SHA256  $ROCKETDICT_RUN59_TC_BIG_COMPLEMENTARY_QUESTION_DOE_ROOT/rocketdict.sqlite" | sha256sum -c -
      - name: Restore pinned TC-big source cache
        uses: actions/cache@v4
        with:
          path: work/tc-big-source
          key: rocketdict-alt-mt-tc-big-en-zle-708be1d-e68caa9
      - name: Obtain exact pinned TC-big snapshot
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$ROCKETDICT_TC_BIG_MODEL_DIR/model.safetensors" ] || ! echo "$TC_BIG_WEIGHTS_SHA256  $ROCKETDICT_TC_BIG_MODEL_DIR/model.safetensors" | sha256sum -c - >/dev/null; then
            rm -rf "$ROCKETDICT_TC_BIG_MODEL_DIR"
            python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id=os.environ['TC_BIG_REPO'], revision=os.environ['TC_BIG_REVISION'],
              local_dir=os.environ['ROCKETDICT_TC_BIG_MODEL_DIR'],
              allow_patterns=['README.md','config.json','generation_config.json','model.safetensors','source.spm','special_tokens_map.json','target.spm','tokenizer_config.json','vocab.json'],
          )
          PY
          fi
          echo "$TC_BIG_WEIGHTS_SHA256  $ROCKETDICT_TC_BIG_MODEL_DIR/model.safetensors" | sha256sum -c -
      - name: Build verified TC-big float32 asset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROCKETDICT_TC_BIG_ASSET_DIR"
          rocketdict-assets build-tc-big-en-ru "$ROCKETDICT_TC_BIG_MODEL_DIR" "$ROCKETDICT_TC_BIG_ASSET_DIR" | tee work/tc-big-asset-build.json
          test -s "$ROCKETDICT_TC_BIG_ASSET_DIR/rocketdict-tc-big-asset.json"
          test -s "$ROCKETDICT_TC_BIG_ASSET_DIR/ct2/model.bin"
      - name: Build torch-free inference venv
        shell: bash
        run: |
          set -euo pipefail
          python -m venv work/tc-big-runtime
          work/tc-big-runtime/bin/python -m pip install --upgrade pip
          work/tc-big-runtime/bin/python -m pip install -e './rocketdict-product-core[production]' -e ./rocketdict-workbench \
            'transformers==4.56.2' 'sentencepiece==0.2.1' 'sacremoses==0.1.1'
          work/tc-big-runtime/bin/python - <<'PY'
          import importlib.util
          if importlib.util.find_spec('torch') is not None: raise SystemExit('torch unexpectedly present')
          PY
      - name: Run exact read-only TC-big DOE
        shell: bash
        run: |
          set -euo pipefail
          work/tc-big-runtime/bin/python -u rocketdict-workbench/tests/real_translation_run59_tc_big_complementary_question_clause_doe.py | tee "$ROCKETDICT_RUN59_TC_BIG_COMPLEMENTARY_QUESTION_DOE_ROOT/summary.json"
          echo "$RUN59_DB_SHA256  $ROCKETDICT_RUN59_TC_BIG_COMPLEMENTARY_QUESTION_DOE_ROOT/rocketdict.sqlite" | sha256sum -c -
      - name: Verify evidence shape
        shell: bash
        run: |
          set -euo pipefail
          work/tc-big-runtime/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROCKETDICT_RUN59_TC_BIG_COMPLEMENTARY_QUESTION_DOE_ROOT'])
          e=json.loads((root/'run59-tc-big-complementary-question-clause-doe.json').read_text(encoding='utf-8'))
          assert e['schema']=='rocketdict-run59-tc-big-complementary-question-clause-doe/1'
          assert e['base_run_id']==59 and e['segment_count']==3335 and e['discovered_context_count']==1
          assert e['context_sequence']==2730 and e['base_member_sequences']==[3005,3006,3007,3008,3009]
          assert e['addition_sequence']==3005 and e['loss_sequence']==3009
          assert e['candidate_source_token_counts']==[42,52,30,38,54,44,56]
          assert max(e['candidate_source_token_counts'])<=64
          assert all(int(r['hypothesis']['rank'])==0 and r['hypothesis']['text']==r['raw_rank0_target'] for r in e['candidate_rows'])
          assert e['source_coverage_byte_exact'] is True and e['database_unchanged'] is True
          assert e['promotion_allowed'] is False and e['automatic_product_default_allowed'] is False
          print(json.dumps({'accepted':e['aggregate_selection']['accepted'],'strict':e['aggregate_selection']['strict_research_passed'],'hard':e['aggregate_selection']['product_hard_passed'],'evidence_sha256':e['evidence_sha256']},indent=2))
          PY
      - name: Record runtime evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$ROCKETDICT_RUN59_TC_BIG_COMPLEMENTARY_QUESTION_DOE_ROOT/runtime-evidence"
          work/tc-big-runtime/bin/python -VV > "$ROCKETDICT_RUN59_TC_BIG_COMPLEMENTARY_QUESTION_DOE_ROOT/runtime-evidence/python.txt" 2>&1
          work/tc-big-runtime/bin/python -m pip freeze | sort > "$ROCKETDICT_RUN59_TC_BIG_COMPLEMENTARY_QUESTION_DOE_ROOT/runtime-evidence/pip-freeze.txt" 2>&1
          sha256sum "$ROCKETDICT_TC_BIG_ASSET_DIR"/ct2/* > "$ROCKETDICT_RUN59_TC_BIG_COMPLEMENTARY_QUESTION_DOE_ROOT/runtime-evidence/ct2-files.sha256" 2>&1
      - name: Upload TC-big DOE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-run59-tc-big-complementary-question-clause-doe
          path: |
            work/run59-tc-big-complementary-question-clause-doe/*.json
            work/run59-tc-big-complementary-question-clause-doe/runtime-evidence
            work/tc-big-asset-build.json
          if-no-files-found: warn
          retention-days: 90
