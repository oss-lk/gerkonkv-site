name: RocketDict Full Opticks Short Angular DMS Feasibility

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - 'rocketdict-product-core/src/rocketdict/alternative_mt_runtime.py'
      - 'rocketdict-product-core/src/rocketdict/translation_tc_big_short_angular_dms_rescue_stage.py'
      - 'rocketdict-product-core/tests/test_translation_tc_big_short_angular_dms_rescue_stage.py'
      - 'rocketdict-workbench/tests/real_translation_full_opticks_short_angular_dms_feasibility.py'
      - '.github/workflows/rocketdict-full-opticks-short-angular-dms-feasibility.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  short-angular-dms-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUN14_RUN_ID: '34643230375'
      RUN14_ARTIFACT_NAME: rocketdict-full-opticks-tc-big-equals-addition-product-rescue
      RUN14_DB_SHA256: dfce68a8f7cae08b90380630ae29e31418b4d6e8987d3e7001fe72fa1d781304
      TC_BIG_REPO: Helsinki-NLP/opus-mt-tc-big-en-zle
      TC_BIG_REVISION: 708be1d372fe4c358a352f404e6dc9ca0126ba48
      TC_BIG_WEIGHTS_SHA256: e68caa9a233c177a3489257b69c18cece6da97767ab2581918ce3fc3c3899416
      TC_BIG_SNAPSHOT: ${{ github.workspace }}/work/tc-big-snapshot
      ROCKETDICT_TC_BIG_ASSET_DIR: ${{ github.workspace }}/work/tc-big-asset
      ROCKETDICT_SHORT_DMS_FEASIBILITY_ROOT: ${{ github.workspace }}/work/short-angular-dms-feasibility
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install TC-big builder
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ./rocketdict-product-core \
            'ctranslate2==4.8.2' 'sentencepiece==0.2.1' 'transformers==4.56.2' \
            'sacremoses==0.1.1' 'huggingface_hub==0.34.4' 'safetensors==0.6.2'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'

      - name: Download immutable persisted run-14 database
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.RUN14_ARTIFACT_NAME }}
          path: work/run14
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.RUN14_RUN_ID }}

      - name: Verify immutable run-14 database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROCKETDICT_SHORT_DMS_FEASIBILITY_ROOT"
          cp work/run14/tc-big-equals-product-rescue/rocketdict.sqlite "$ROCKETDICT_SHORT_DMS_FEASIBILITY_ROOT/rocketdict.sqlite"
          echo "$RUN14_DB_SHA256  $ROCKETDICT_SHORT_DMS_FEASIBILITY_ROOT/rocketdict.sqlite" | sha256sum -c -
          cp "$ROCKETDICT_SHORT_DMS_FEASIBILITY_ROOT/rocketdict.sqlite" "$ROCKETDICT_SHORT_DMS_FEASIBILITY_ROOT/rocketdict-before.sqlite"

      - name: Restore pinned TC-big snapshot cache
        uses: actions/cache@v4
        with:
          path: work/tc-big-snapshot
          key: rocketdict-tc-big-en-zle-708be1d372fe4c358a352f404e6dc9ca0126ba48-e68caa9a

      - name: Obtain exact pinned TC-big snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id=os.environ['TC_BIG_REPO'],
              revision=os.environ['TC_BIG_REVISION'],
              local_dir=os.environ['TC_BIG_SNAPSHOT'],
              allow_patterns=[
                  'README.md','config.json','generation_config.json','model.safetensors',
                  'source.spm','special_tokens_map.json','target.spm','tokenizer_config.json','vocab.json'
              ],
          )
          PY
          echo "$TC_BIG_WEIGHTS_SHA256  $TC_BIG_SNAPSHOT/model.safetensors" | sha256sum -c -

      - name: Build byte-verified offline TC-big asset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROCKETDICT_TC_BIG_ASSET_DIR"
          rocketdict-assets build-tc-big-en-ru "$TC_BIG_SNAPSHOT" "$ROCKETDICT_TC_BIG_ASSET_DIR" | tee work/short-dms-asset-build.json

      - name: Build torch-free research runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m venv work/short-dms-runtime-venv
          work/short-dms-runtime-venv/bin/python -m pip install --upgrade pip
          work/short-dms-runtime-venv/bin/python -m pip install -e './rocketdict-product-core[alt-mt]' -e ./rocketdict-workbench
          work/short-dms-runtime-venv/bin/python - <<'PY'
          import importlib.util
          if importlib.util.find_spec('torch') is not None:
              raise SystemExit('Torch unexpectedly installed in research inference runtime')
          PY

      - name: Run read-only short-DMS feasibility
        shell: bash
        run: |
          set -euo pipefail
          work/short-dms-runtime-venv/bin/python -u rocketdict-workbench/tests/real_translation_full_opticks_short_angular_dms_feasibility.py
          echo "$RUN14_DB_SHA256  $ROCKETDICT_SHORT_DMS_FEASIBILITY_ROOT/rocketdict.sqlite" | sha256sum -c -
          echo "$RUN14_DB_SHA256  $ROCKETDICT_SHORT_DMS_FEASIBILITY_ROOT/rocketdict-before.sqlite" | sha256sum -c -

      - name: Verify research evidence is non-promoting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['ROCKETDICT_SHORT_DMS_FEASIBILITY_ROOT'])
          p = root/'full-opticks-short-angular-dms-feasibility.json'
          e = json.loads(p.read_text(encoding='utf-8'))
          if e['schema'] != 'rocketdict-full-opticks-short-angular-dms-feasibility/1':
              raise SystemExit('schema drift')
          if e['source_start'] != 110881 or e['source_text'] != "Whence this Angle is 2 deg. 0'. 7''. ":
              raise SystemExit('short-DMS cohort drift')
          if e['database_mutated'] is not False or e['promotion_allowed'] is not False or e['automatic_product_default_allowed'] is not False:
              raise SystemExit('unsafe feasibility flags')
          if any(e.get(flag) is not False for flag in ('source_bytes_rewritten','target_rewriting','placeholders','post_translation_literal_injection','corpus_specific_target_patches')):
              raise SystemExit('unsafe evidence flags')
          print('Short angular DMS feasibility evidence verified.')
          PY

      - name: Upload feasibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-full-opticks-short-angular-dms-feasibility
          path: |
            work/short-dms-asset-build.json
            work/short-angular-dms-feasibility/full-opticks-short-angular-dms-feasibility.json
          if-no-files-found: warn
          retention-days: 90
