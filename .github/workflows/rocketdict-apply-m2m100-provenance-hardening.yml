name: RocketDict Apply M2M100 Provenance Hardening

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - '.github/workflows/rocketdict-apply-m2m100-provenance-hardening.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/product-core-forward
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply fail-closed provenance patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          stage = Path('rocketdict-product-core/src/rocketdict/translation_m2m100_arithmetic_rescue_stage.py')
          text = stage.read_text(encoding='utf-8')
          replacements = [
              (
                  'rocketdict-stage12-m2m100-arithmetic-restatement-row-rescue/1',
                  'rocketdict-stage12-m2m100-arithmetic-restatement-row-rescue/2',
              ),
              (
                  'm2m100-arithmetic-restatement-row-selected-v1',
                  'm2m100-arithmetic-restatement-row-selected-v2',
              ),
              (
                  '    "asset_payload_tree_sha256",\n    "repository",',
                  '    "asset_payload_tree_sha256",\n    "ctranslate2_version",\n    "repository",',
              ),
              (
                  '                        "rank0_target": target,\n                        "rank0_score": hypothesis.get("score"),\n                        "trigger": trigger,\n                        "selection": selection,',
                  '                        "rank0_target": target,\n                        "rank0_tokens": list(hypothesis.get("tokens") or []),\n                        "rank0_score": hypothesis.get("score"),\n                        "generation": {\n                            "beam_size": BEAM_SIZE,\n                            "num_hypotheses": NUM_HYPOTHESES,\n                            "max_decoding_length": MAX_DECODING_LENGTH,\n                        },\n                        "runtime_identity": _runtime_identity(runtime_status),\n                        "trigger": trigger,\n                        "selection": selection,',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'stage replacement cardinality drift for {old!r}: {count}')
              text = text.replace(old, new, 1)
          stage.write_text(text, encoding='utf-8')

          test = Path('rocketdict-product-core/tests/test_translation_m2m100_arithmetic_rescue_stage.py')
          text = test.read_text(encoding='utf-8')
          replacements = [
              (
                  '        "asset_payload_tree_sha256": "d" * 64,\n        "repository":',
                  '        "asset_payload_tree_sha256": "d" * 64,\n        "ctranslate2_version": "4.8.2",\n        "repository":',
              ),
              (
                  '    assert stage.MAX_DECODING_LENGTH == 512\n',
                  '    assert stage.MAX_DECODING_LENGTH == 512\n    assert stage.M2M100_ARITHMETIC_RESCUE_CONTRACT.endswith("/2")\n    assert stage.M2M100_ARITHMETIC_SELECTED_PHASE.endswith("-v2")\n',
              ),
              (
                  '    assert identity["m2m100_runtime_identity"]["revision"] == "revision-1"\n    assert identity["m2m100_runtime_identity"]["asset_payload_tree_sha256"] == "d" * 64\n',
                  '    assert identity["m2m100_runtime_identity"]["revision"] == "revision-1"\n    assert identity["m2m100_runtime_identity"]["asset_payload_tree_sha256"] == "d" * 64\n    assert identity["m2m100_runtime_identity"]["ctranslate2_version"] == "4.8.2"\n',
              ),
              (
                  '            bad = CANDIDATE.replace(" x ", " на ")\n            return [[{"rank": 0, "text": bad, "score": -0.1}]]\n',
                  '            bad = CANDIDATE.replace(" x ", " на ")\n            return [[{"rank": 0, "text": bad, "tokens": ["__ru__", "bad"], "score": -0.1}]]\n',
              ),
              (
                  '    assert result["m2m100_arithmetic_rescue_rejected_count"] == 1\n    items = completed["items"]\n',
                  '    assert result["m2m100_arithmetic_rescue_rejected_count"] == 1\n    rejected = result["m2m100_arithmetic_rescue_rejected"][0]\n    assert rejected["rank0_target"] == CANDIDATE.replace(" x ", " на ")\n    assert rejected["rank0_tokens"] == ["__ru__", "bad"]\n    assert rejected["generation"] == {"beam_size": 6, "num_hypotheses": 1, "max_decoding_length": 512}\n    assert rejected["runtime_identity"]["ctranslate2_version"] == "4.8.2"\n    items = completed["items"]\n',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'test replacement cardinality drift for {old!r}: {count}')
              text = text.replace(old, new, 1)
          test.write_text(text, encoding='utf-8')
          PY

      - name: Install maintained dependency-light test runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ./rocketdict-product-core -e ./rocketdict-workbench

      - name: Compile and run focused plus full regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q rocketdict-product-core/src rocketdict-workbench/src
          pytest -q \
            rocketdict-product-core/tests/test_m2m100_runtime.py \
            rocketdict-product-core/tests/test_translation_m2m100_arithmetic_rescue_stage.py
          pytest -q rocketdict-product-core/tests --ignore=rocketdict-product-core/tests/real_runtime_smoke.py
          pytest -q rocketdict-workbench/tests

      - name: Commit tested patch and delete one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/rocketdict-apply-m2m100-provenance-hardening.yml
          git status --short
          git config user.name 'oss-lk'
          git config user.email '182254225+oss-lk@users.noreply.github.com'
          git add \
            rocketdict-product-core/src/rocketdict/translation_m2m100_arithmetic_rescue_stage.py \
            rocketdict-product-core/tests/test_translation_m2m100_arithmetic_rescue_stage.py
          git commit -m 'Harden M2M100 arithmetic runtime provenance'
          git push origin HEAD:chatgpt/product-core-forward
