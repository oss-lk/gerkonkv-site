name: RocketDict Full Opticks Block Footnote Context NBest DOE Run9

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - 'rocketdict-product-core/src/rocketdict/runtime.py'
      - 'rocketdict-product-core/src/rocketdict/translation_rescue.py'
      - 'rocketdict-product-core/src/rocketdict/emphasis_markup.py'
      - 'rocketdict-workbench/tests/real_translation_full_opticks_block_footnote_context_nbest_doe_run9.py'
      - '.github/workflows/rocketdict-full-opticks-block-footnote-context-nbest-doe-run9.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  block-footnote-context-nbest-doe-run9:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_RUN_ID: '34610787826'
      BASE_ARTIFACT_NAME: rocketdict-full-opticks-illustration-label-product-rescue
      BASE_DB_SHA256: 9e79e95f67188c751cf50a348c5d7e54ffdef73cd423c7c92601f5cb8c6332ad
      OPUS_URL: https://object.pouta.csc.fi/OPUS-MT-models/en-ru/opus-2020-02-11.zip
      OPUS_SHA256: 798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677
      ROCKETDICT_OPUS_ASSET_DIR: ${{ github.workspace }}/work/opus-asset
      ROCKETDICT_FOOTNOTE_CONTEXT_NBEST_DOE_ROOT: ${{ github.workspace }}/work/footnote-context-nbest-doe-run9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install maintained Product and Workbench runtimes
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './rocketdict-product-core[production]'
          python -m pip install -e ./rocketdict-workbench
      - name: Download immutable illustration run-9 Product evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BASE_ARTIFACT_NAME }}
          path: work/base
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BASE_RUN_ID }}
      - name: Assemble and verify persisted run-9 database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROCKETDICT_FOOTNOTE_CONTEXT_NBEST_DOE_ROOT"
          cp work/base/illustration-product-rescue/rocketdict.sqlite "$ROCKETDICT_FOOTNOTE_CONTEXT_NBEST_DOE_ROOT/rocketdict.sqlite"
          echo "$BASE_DB_SHA256  $ROCKETDICT_FOOTNOTE_CONTEXT_NBEST_DOE_ROOT/rocketdict.sqlite" | sha256sum -c -
      - name: Restore pinned OPUS archive cache
        uses: actions/cache@v4
        with:
          path: work/opus-2020-02-11.zip
          key: rocketdict-opus-en-ru-2020-02-11-798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677
      - name: Obtain and verify pinned OPUS archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          if [ ! -s work/opus-2020-02-11.zip ]; then
            rm -f work/opus-2020-02-11.zip.tmp
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 "$OPUS_URL" -o work/opus-2020-02-11.zip.tmp
            echo "$OPUS_SHA256  work/opus-2020-02-11.zip.tmp" | sha256sum -c -
            mv work/opus-2020-02-11.zip.tmp work/opus-2020-02-11.zip
          fi
          echo "$OPUS_SHA256  work/opus-2020-02-11.zip" | sha256sum -c -
      - name: Build verified offline CTranslate2 float32 asset
        run: |
          rocketdict-assets build-opus-en-ru work/opus-2020-02-11.zip "$ROCKETDICT_OPUS_ASSET_DIR" | tee work/opus-asset-build.json
          test -s "$ROCKETDICT_OPUS_ASSET_DIR/rocketdict-opus-asset.json"
          test -s "$ROCKETDICT_OPUS_ASSET_DIR/ct2/model.bin"
      - name: Run exact-source footnote n-best depth DOE
        run: python -u rocketdict-workbench/tests/real_translation_full_opticks_block_footnote_context_nbest_doe_run9.py
      - name: Verify DOE evidence invariants
        shell: bash
        run: |
          set -euo pipefail
          evidence="$ROCKETDICT_FOOTNOTE_CONTEXT_NBEST_DOE_ROOT/full-opticks-block-footnote-context-nbest-doe-run9.json"
          test -s "$evidence"
          echo "$BASE_DB_SHA256  $ROCKETDICT_FOOTNOTE_CONTEXT_NBEST_DOE_ROOT/rocketdict.sqlite" | sha256sum -c -
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['ROCKETDICT_FOOTNOTE_CONTEXT_NBEST_DOE_ROOT'])
          evidence = json.loads((root / 'full-opticks-block-footnote-context-nbest-doe-run9.json').read_text(encoding='utf-8'))
          if evidence['schema'] != 'rocketdict-full-opticks-block-footnote-context-nbest-doe-run9/1':
              raise SystemExit(f"schema drift: {evidence['schema']!r}")
          if evidence['attempted_letters'] != list('GHJKM') or evidence['attempted_source_starts'] != [151466,151557,253849,253919,254102]:
              raise SystemExit('footnote DOE cohort drift')
          expected_cells=[{'beam_size':6,'num_hypotheses':6},{'beam_size':12,'num_hypotheses':12},{'beam_size':24,'num_hypotheses':24}]
          if evidence['cells'] != expected_cells:
              raise SystemExit(f"DOE cell drift: {evidence['cells']!r}")
          if evidence['total_hypothesis_count'] != 210:
              raise SystemExit(f"DOE hypothesis total drift: {evidence['total_hypothesis_count']!r}")
          for case in evidence['cases']:
              if len(case['cells']) != 3:
                  raise SystemExit(f"DOE cell count drift for {case['letter']}")
              for cell in case['cells']:
                  if len(cell['hypotheses']) != cell['num_hypotheses']:
                      raise SystemExit(f"DOE n-best cardinality drift for {case['letter']}")
                  for hypothesis in cell['hypotheses']:
                      if hypothesis['mechanically_admissible'] and hypothesis['emphasis_markup']['passed'] is not True:
                          raise SystemExit(f"emphasis veto bypassed for {case['letter']}")
          if evidence['database_unchanged'] is not True:
              raise SystemExit('DOE mutated run9 database')
          for flag in ('source_bytes_rewritten','target_rewriting','placeholders','post_translation_literal_injection'):
              if evidence[flag] is not False:
                  raise SystemExit(f"unsafe DOE flag drift: {flag}={evidence[flag]!r}")
          if evidence['promotion_allowed'] is not False or evidence['automatic_product_default_allowed'] is not False:
              raise SystemExit('DOE unexpectedly authorizes Product promotion')
          print('Run-9 footnote n-best depth DOE invariants verified.')
          PY
      - name: Record runtime identities
        if: always()
        shell: bash
        run: |
          mkdir -p work/footnote-context-nbest-runtime
          python -VV > work/footnote-context-nbest-runtime/python.txt || true
          python -m pip freeze | sort > work/footnote-context-nbest-runtime/pip-freeze.txt || true
          sha256sum work/opus-2020-02-11.zip > work/footnote-context-nbest-runtime/opus.sha256 || true
          if [ -s "$ROCKETDICT_FOOTNOTE_CONTEXT_NBEST_DOE_ROOT/full-opticks-block-footnote-context-nbest-doe-run9.json" ]; then
            sha256sum "$ROCKETDICT_FOOTNOTE_CONTEXT_NBEST_DOE_ROOT/full-opticks-block-footnote-context-nbest-doe-run9.json" > work/footnote-context-nbest-runtime/evidence.sha256
          fi
      - name: Upload footnote n-best DOE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-full-opticks-block-footnote-context-nbest-doe-run9
          path: |
            work/opus-asset-build.json
            work/footnote-context-nbest-doe-run9/full-opticks-block-footnote-context-nbest-doe-run9.json
            work/footnote-context-nbest-runtime/**
          if-no-files-found: warn
          retention-days: 90
