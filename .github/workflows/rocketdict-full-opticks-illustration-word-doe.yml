name: RocketDict Illustration Word OPUS DOE

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - 'rocketdict-product-core/src/rocketdict/runtime.py'
      - 'rocketdict-product-core/src/rocketdict/translation_rescue.py'
      - 'rocketdict-product-core/src/rocketdict/research_diagnostics.py'
      - 'rocketdict-product-core/src/rocketdict/numeric_integrity.py'
      - 'rocketdict-workbench/tests/real_translation_full_opticks_illustration_word_doe.py'
      - '.github/workflows/rocketdict-full-opticks-illustration-word-doe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  illustration-word-doe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPUS_URL: https://object.pouta.csc.fi/OPUS-MT-models/en-ru/opus-2020-02-11.zip
      OPUS_SHA256: 798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677
      ROCKETDICT_OPUS_ASSET_DIR: ${{ github.workspace }}/work/opus-asset
      ROCKETDICT_ILLUSTRATION_WORD_DOE_ROOT: ${{ github.workspace }}/work/illustration-word-doe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install maintained Product and Workbench runtimes
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './rocketdict-product-core[production]'
          python -m pip install -e ./rocketdict-workbench
      - name: Restore pinned OPUS archive cache
        uses: actions/cache@v4
        with:
          path: work/opus-2020-02-11.zip
          key: rocketdict-opus-en-ru-2020-02-11-798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677
      - name: Obtain and verify pinned OPUS archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          if [ ! -s work/opus-2020-02-11.zip ]; then
            rm -f work/opus-2020-02-11.zip.tmp
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 "$OPUS_URL" -o work/opus-2020-02-11.zip.tmp
            echo "$OPUS_SHA256  work/opus-2020-02-11.zip.tmp" | sha256sum -c -
            mv work/opus-2020-02-11.zip.tmp work/opus-2020-02-11.zip
          fi
          echo "$OPUS_SHA256  work/opus-2020-02-11.zip" | sha256sum -c -
      - name: Build verified offline CTranslate2 float32 asset
        run: |
          rocketdict-assets build-opus-en-ru work/opus-2020-02-11.zip "$ROCKETDICT_OPUS_ASSET_DIR" | tee work/opus-asset-build.json
          test -s "$ROCKETDICT_OPUS_ASSET_DIR/rocketdict-opus-asset.json"
          test -s "$ROCKETDICT_OPUS_ASSET_DIR/ct2/model.bin"
      - name: Run source-side illustration-word DOE
        run: python -u rocketdict-workbench/tests/real_translation_full_opticks_illustration_word_doe.py
      - name: Verify DOE evidence exists
        if: always()
        shell: bash
        run: |
          mkdir -p work/illustration-word-runtime
          python -VV > work/illustration-word-runtime/python.txt || true
          python -m pip freeze | sort > work/illustration-word-runtime/pip-freeze.txt || true
          sha256sum work/opus-2020-02-11.zip > work/illustration-word-runtime/opus.sha256 || true
          if [ -s "$ROCKETDICT_ILLUSTRATION_WORD_DOE_ROOT/full-opticks-illustration-word-opus-doe.json" ]; then
            sha256sum "$ROCKETDICT_ILLUSTRATION_WORD_DOE_ROOT/full-opticks-illustration-word-opus-doe.json" > work/illustration-word-runtime/evidence.sha256
          fi
      - name: Upload illustration-word DOE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-illustration-word-opus-doe
          path: |
            work/opus-asset-build.json
            work/illustration-word-doe/full-opticks-illustration-word-opus-doe.json
            work/illustration-word-runtime/**
          if-no-files-found: warn
          retention-days: 90
