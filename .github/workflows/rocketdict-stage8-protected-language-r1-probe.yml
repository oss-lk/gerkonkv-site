name: RocketDict Stage 8 protected language R1 probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rocketdict-stage8-protected-language-r1-probe.yml'
      - 'rocketdict-ci/stage8_protected_language_gate_r1_probe.py'
  workflow_dispatch:

jobs:
  protected-language-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact OPUS runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'ctranslate2>=4.5,<5' 'sentencepiece>=0.2,<1' 'PyYAML>=6,<7' 'sacrebleu>=2.4,<3' 'nltk>=3.9,<4'
      - name: Probe protected-aware language share
        run: python rocketdict-ci/stage8_protected_language_gate_r1_probe.py
      - name: Upload protected-language evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-stage8-protected-language-r1-probe
          path: work-stage8-protected-language-r1/evidence/**
          if-no-files-found: warn
          retention-days: 14
