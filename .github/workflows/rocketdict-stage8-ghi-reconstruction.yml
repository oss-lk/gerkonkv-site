name: RocketDict Stage 8 GHI reconstruction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rocketdict-stage8-ghi-reconstruction.yml'
      - 'rocketdict-ci/stage8_ghi_reconstruction_gate.py'
      - 'rocketdict-ci/stage8_ghi_reconstruction_v3.py'
      - 'rocketdict-ci/stage8_g_nbest_probe.py'
      - 'rocketdict-ci/real_opus_gate.py'
      - 'rocketdict-ci/stage8-ghi-reconstruction-trigger.txt'
  workflow_dispatch:

jobs:
  non-promotional-reconstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install real OPUS runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'ctranslate2>=4.5,<5' 'sentencepiece>=0.2,<1' 'PyYAML>=6,<7'
      - name: Run frozen 5044-word Stage 8 reconstruction v3
        run: python rocketdict-ci/stage8_ghi_reconstruction_v3.py
      - name: Upload reconstruction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-stage8-ghi-reconstruction
          path: |
            work-stage8-ghi-reconstruction/evidence/**
            work-stage8-ghi-reconstruction/output/**
          if-no-files-found: warn
          retention-days: 14
