name: RocketDict Bind Combined Greek Stage12

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - '.github/workflows/rocketdict-bind-combined-greek-stage12.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bind-stage12:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/product-core-forward
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact outer-binding patch and regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('rocketdict-product-core/src/rocketdict/api/operations.py')
          text = path.read_text(encoding='utf-8')
          old = 'from rocketdict.translation_m2m100_arithmetic_rescue_stage import run_stage12 as _run_stage12\n'
          new = 'from rocketdict.translation_combined_greek_rescue_stage import run_stage12 as _run_stage12\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy Stage12 binding, found {text.count(old)}')
          if new in text:
              raise SystemExit('combined Greek Stage12 binding already present')
          path.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('rocketdict-product-core/tests/test_api_stage12_outer_binding.py')
          if test.exists():
              raise SystemExit('binding regression test already exists')
          test.write_text('''from __future__ import annotations\n\nimport rocketdict.api.operations as operations\nimport rocketdict.translation_combined_greek_rescue_stage as combined_greek\n\n\ndef test_public_stage12_uses_combined_greek_outer_wrapper() -> None:\n    assert operations._run_stage12 is combined_greek.run_stage12\n\n\ndef test_public_stage12_descriptor_identity_remains_product_stage12() -> None:\n    assert operations.run_stage12.stage_number == 12\n    assert operations.run_stage12.stage_key == "translation"\n    assert operations.run_stage12.implementation_key == "opus-en-ru-ct2"\n    assert operations.run_stage12.required_inputs == ["context_run_id"]\n''', encoding='utf-8')
          PY
          git diff --check
      - name: Run maintained dependency-light regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ./rocketdict-product-core -e ./rocketdict-workbench pytest
          pytest -q rocketdict-product-core/tests rocketdict-workbench/tests
      - name: Commit verified binding and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/rocketdict-bind-combined-greek-stage12.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rocketdict-product-core/src/rocketdict/api/operations.py \
                  rocketdict-product-core/tests/test_api_stage12_outer_binding.py \
                  .github/workflows/rocketdict-bind-combined-greek-stage12.yml
          git commit -m 'Expose combined Greek rescue through public Stage12'
          git push origin HEAD:chatgpt/product-core-forward
