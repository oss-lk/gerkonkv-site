name: RocketDict Illustration Exact Source Hardening

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - '.github/workflows/rocketdict-illustration-exact-source-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/product-core-forward
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch illustration rescue to exact-source v3
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          src = Path('rocketdict-product-core/src/rocketdict/translation_illustration_rescue_stage.py')
          text = src.read_text(encoding='utf-8')
          text = text.replace(
              'Exact ``_Illustration._`` is the one proven ambiguity and therefore uses the\ncanonical ``Illustration.`` model input with beam6/n6 diagnostic evidence, but\nonly the unique raw rank0 may be persisted. Other suffixes use exact source input and rank0. Disabled by default; no source\nor target rewriting, placeholders, or post-translation literal injection.',
              'Every linguistic remainder is sent to MT exactly as it appears in the immutable\nsource. Exact ``_Illustration._`` remains a semantically constrained source class,\nbut it receives no canonicalization and only its unique raw rank0 may be persisted.\nDisabled by default; no source/model-input or target rewriting, placeholders, or\npost-translation literal injection.'
          )
          text = text.replace(
              'ILLUSTRATION_LABEL_RESCUE_CONTRACT = "rocketdict-stage12-illustration-label-rescue/2"\nILLUSTRATION_LABEL_SELECTOR_CONTRACT = "rocketdict-stage12-illustration-label-selector/2"',
              'ILLUSTRATION_LABEL_RESCUE_CONTRACT = "rocketdict-stage12-illustration-label-rescue/3"\nILLUSTRATION_LABEL_SELECTOR_CONTRACT = "rocketdict-stage12-illustration-label-selector/3"'
          )
          text = text.replace('ILLUSTRATION_LABEL_SELECTED_PHASE = "illustration-label-selected-v2"','ILLUSTRATION_LABEL_SELECTED_PHASE = "illustration-label-selected-v3"')
          text = text.replace('ILLUSTRATION_WORD_MODEL_INPUT = "Illustration."','ILLUSTRATION_WORD_MODEL_INPUT = ILLUSTRATION_WORD_SOURCE')
          old = '''def _model_input_for_remainder(remainder: str) -> tuple[str, bool, str]:\n    if remainder.strip() == ILLUSTRATION_WORD_SOURCE:\n        return ILLUSTRATION_WORD_MODEL_INPUT, True, "standalone_illustration_word"\n    return remainder, False, "ordinary_linguistic_suffix"\n'''
          new = '''def _model_input_for_remainder(remainder: str) -> tuple[str, bool, str]:\n    candidate_kind = (\n        "standalone_illustration_word"\n        if remainder.strip() == ILLUSTRATION_WORD_SOURCE\n        else "ordinary_linguistic_suffix"\n    )\n    return remainder, False, candidate_kind\n'''
          assert old in text
          text = text.replace(old, new)
          old = '''    target_shape = (\n        evaluate_illustration_word_target_shape(target)\n        if normalized_model_input\n        else {"contract": ILLUSTRATION_WORD_TARGET_FORM_CONTRACT, "applicable": False, "passed": True}\n    )\n'''
          new = '''    if normalized_model_input:\n        raise ValueError("illustration-label rescue forbids normalized model input")\n    standalone_word = remainder_source.strip() == ILLUSTRATION_WORD_SOURCE\n    target_shape = (\n        evaluate_illustration_word_target_shape(target)\n        if standalone_word\n        else {"contract": ILLUSTRATION_WORD_TARGET_FORM_CONTRACT, "applicable": False, "passed": True}\n    )\n'''
          assert old in text
          text = text.replace(old, new)
          text = text.replace('        "source_bytes_rewritten": False,\n        "target_rewriting": False,','        "source_bytes_rewritten": False,\n        "model_input_source_rewritten": False,\n        "target_rewriting": False,')
          old = '''    if selected_rank != 0:\n        raise ValueError("illustration-label rescue is rank0-only")\n'''
          new = '''    if selected_rank != 0:\n        raise ValueError("illustration-label rescue is rank0-only")\n    if normalized_model_input:\n        raise ValueError("illustration-label rescue forbids normalized model input")\n    if model_input != remainder_source:\n        raise ValueError("illustration-label rescue model input must equal source remainder")\n'''
          assert old in text
          text = text.replace(old, new)
          text = text.replace('        "source_model_input_normalized": normalized_model_input,\n        "generation": dict(generation),','        "source_model_input_normalized": False,\n        "model_input_source_exact": True,\n        "generation": dict(generation),')
          old = '''        normalized_attempts = [x for x in attempts if bool(x["normalized_model_input"])]\n        ordinary_attempts = [x for x in attempts if not bool(x["normalized_model_input"])]\n'''
          new = '''        normalized_attempts = [x for x in attempts if bool(x["normalized_model_input"])]\n        if normalized_attempts:\n            raise StageExecutionError("Stage12 illustration-label exact-source contract forbids normalized model input")\n        ordinary_attempts = list(attempts)\n'''
          assert old in text
          text = text.replace(old, new)
          start = text.index('            if normalized_attempts:\n                generated = primary_stage._translate_primary_request_batches(')
          end = text.index('            if ordinary_attempts:\n', start)
          text = text[:start] + text[end:]
          text = text.replace('            "illustration_label_rescue_normalized_model_input_source_starts": [int(value["source_start"]) for value in accepted_values if bool(value["normalized_model_input"])],','            "illustration_label_rescue_normalized_model_input_source_starts": [],\n            "illustration_label_rescue_model_inputs_source_exact": True,')
          src.write_text(text, encoding='utf-8')

          test = Path('rocketdict-product-core/tests/test_translation_illustration_rescue_stage.py')
          t = test.read_text(encoding='utf-8')
          t = t.replace('from __future__ import annotations\n\n', 'from __future__ import annotations\n\nimport pytest\n\n')
          t = t.replace('def test_exact_illustration_word_uses_canonical_model_input_only() -> None:\n    assert _model_input_for_remainder("_Illustration._ ") == (\n        ILLUSTRATION_WORD_MODEL_INPUT,\n        True,\n        "standalone_illustration_word",\n    )','def test_exact_illustration_word_uses_exact_source_model_input_only() -> None:\n    assert ILLUSTRATION_WORD_MODEL_INPUT == ILLUSTRATION_WORD_SOURCE\n    assert _model_input_for_remainder("_Illustration._ ") == (\n        "_Illustration._ ",\n        False,\n        "standalone_illustration_word",\n    )')
          t = t.replace('normalized_model_input=True,', 'normalized_model_input=False,')
          t = t.replace('        model_input=ILLUSTRATION_WORD_MODEL_INPUT,\n        normalized_model_input=False,','        model_input=remainder,\n        normalized_model_input=False,')
          t = t.replace('    assert rescue["source_model_input_normalized"] is True\n    assert rescue["model_input"] == ILLUSTRATION_WORD_MODEL_INPUT','    assert rescue["source_model_input_normalized"] is False\n    assert rescue["model_input_source_exact"] is True\n    assert rescue["model_input"] == remainder')
          t = t.replace('    assert rescue["source_bytes_rewritten"] is False\n    assert rescue["target_rewriting"] is False','    assert rescue["source_bytes_rewritten"] is False\n    assert rescue["model_input_source_rewritten"] is False\n    assert rescue["target_rewriting"] is False')
          t += '''\n\ndef test_candidate_rows_reject_any_non_exact_model_input() -> None:\n    row = _failing_row()\n    trigger = evaluate_illustration_label_trigger(row)\n    structural = str(trigger["structural_source"])\n    remainder = str(trigger["remainder_source"])\n    hypotheses = [{"rank": 0, "text": "Иллюстрация.", "score": -0.1}]\n    selection = evaluate_illustration_label_candidate(row, structural_source=structural, remainder_source=remainder, target="Иллюстрация.", normalized_model_input=False)\n    with pytest.raises(ValueError, match="model input must equal source remainder"):\n        _candidate_rows(base=row, structural_source=structural, remainder_source=remainder, model_input="Illustration.", normalized_model_input=False, candidate_kind="standalone_illustration_word", hypotheses=hypotheses, selected_rank=0, trigger=trigger, selection=selection, generation={"beam_size": 6, "num_hypotheses": 1})\n\n\ndef test_candidate_evaluation_rejects_normalized_model_input_flag() -> None:\n    row = _failing_row()\n    trigger = evaluate_illustration_label_trigger(row)\n    with pytest.raises(ValueError, match="forbids normalized model input"):\n        evaluate_illustration_label_candidate(row, structural_source=str(trigger["structural_source"]), remainder_source=str(trigger["remainder_source"]), target="Иллюстрация.", normalized_model_input=True)\n'''
          test.write_text(t, encoding='utf-8')
          PY
      - name: Run targeted exact-source regressions
        shell: bash
        run: |
          python -m pip install pytest
          python -m pip install -e ./rocketdict-product-core
          python -m pytest -q \
            rocketdict-product-core/tests/test_translation_illustration_rescue_stage.py \
            rocketdict-product-core/tests/test_translation_rank0.py
      - name: Commit exact-source hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rocketdict-product-core/src/rocketdict/translation_illustration_rescue_stage.py rocketdict-product-core/tests/test_translation_illustration_rescue_stage.py
          git diff --cached --check
          git commit -m "Enforce exact-source illustration model input"
          git push origin HEAD:chatgpt/product-core-forward
