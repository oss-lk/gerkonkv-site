name: RocketDict Stage 8 Pages snapshot recovery

on:
  push:
    branches: [main]
    paths:
      - 'rocketdict-ci/recover_stage8_pages_snapshots.py'
      - '.github/workflows/rocketdict-stage8-pages-snapshot-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover-pages-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Scan historical Pages TAR snapshots for exact Stage 8 payload/source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python rocketdict-ci/recover_stage8_pages_snapshots.py
      - name: Upload Pages snapshot recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-stage8-pages-snapshot-recovery
          path: rocketdict-stage8-pages-snapshot-recovery
          if-no-files-found: error
