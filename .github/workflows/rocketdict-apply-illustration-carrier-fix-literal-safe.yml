name: RocketDict apply illustration carrier fix literal safe

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - '.github/workflows/rocketdict-apply-illustration-carrier-fix-literal-safe.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/product-core-forward
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run corrected carrier applicator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          helper = Path('.github/workflows/rocketdict-apply-illustration-carrier-fix.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = helper.index(marker) + len(marker)
          end = helper.index("\n          PY\n", start)
          script = textwrap.dedent(helper[start:end])
          old = """tests, count = test_pattern.subn(\n    new_test + '\\n\\ndef test_structural_rows_reject_any_non_exact_model_input',\n    tests,\n    count=1,\n)"""
          new = """tests, count = test_pattern.subn(\n    lambda _match: new_test + '\\n\\ndef test_structural_rows_reject_any_non_exact_model_input',\n    tests,\n    count=1,\n)"""
          if old not in script:
              raise SystemExit('test replacement call not found')
          script = script.replace(old, new)
          old = """promotion, count = prov_pattern.subn(\n    provenance + '\\n\\ndef main() -> int:', promotion, count=1\n)"""
          new = """promotion, count = prov_pattern.subn(\n    lambda _match: provenance + '\\n\\ndef main() -> int:', promotion, count=1\n)"""
          if old not in script:
              raise SystemExit('promotion replacement call not found')
          script = script.replace(old, new)
          exec(compile(script, '<literal-safe-carrier-applicator>', 'exec'), {})
          PY
      - name: Verify targeted and maintained dependency-light regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ./rocketdict-product-core
          python -m pip install -e ./rocketdict-workbench
          python -m compileall -q rocketdict-product-core/src rocketdict-workbench/src
          pytest -q rocketdict-product-core/tests/test_translation_illustration_rescue_stage.py rocketdict-product-core/tests/test_translation_rank0_selection_policy.py
          pytest -q rocketdict-product-core/tests --ignore=rocketdict-product-core/tests/real_runtime_smoke.py
          pytest -q rocketdict-workbench/tests
      - name: Commit verified carrier representation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            rocketdict-product-core/src/rocketdict/translation_illustration_rescue_stage.py \
            rocketdict-product-core/tests/test_translation_illustration_rescue_stage.py \
            rocketdict-workbench/tests/real_translation_full_opticks_illustration_structural_promotion.py
          git diff --cached --check
          git diff --cached --quiet && { echo 'No carrier diff to commit'; exit 1; }
          git commit -m 'Render illustration structural plan through semantic carrier'
          git push origin HEAD:chatgpt/product-core-forward
