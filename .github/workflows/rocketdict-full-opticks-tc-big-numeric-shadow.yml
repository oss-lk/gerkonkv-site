name: RocketDict Full Opticks TC-big Numeric Row Promotion

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - 'rocketdict-workbench/tests/real_translation_full_opticks_tc_big_numeric_row_promotion.py'
      - '.github/workflows/rocketdict-full-opticks-tc-big-numeric-shadow.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE_WORKFLOW_RUN_ID: '34746052346'
      BASE_ARTIFACT_NAME: rocketdict-full-opticks-tc-big-parenthetical-row-promotion
      BASE_DB_SHA256: f6eae41e02211a35f3519c8abcdeceb2699f4f0089dc2c2fa10800682fe06115
      TC_BIG_REPO: Helsinki-NLP/opus-mt-tc-big-en-zle
      TC_BIG_REVISION: 708be1d372fe4c358a352f404e6dc9ca0126ba48
      TC_BIG_WEIGHTS_SHA256: e68caa9a233c177a3489257b69c18cece6da97767ab2581918ce3fc3c3899416
      TC_BIG_SNAPSHOT: ${{ github.workspace }}/work/tc-big-snapshot
      ROCKETDICT_TC_BIG_ASSET_DIR: ${{ github.workspace }}/work/tc-big-asset
      ROCKETDICT_NUMERIC_ROW_PROMOTION_ROOT: ${{ github.workspace }}/work/full-opticks-tc-big-numeric-row-promotion
      ROCKETDICT_NUMERIC_ROW_PROMOTION_DB: ${{ github.workspace }}/work/full-opticks-tc-big-numeric-row-promotion/rocketdict.sqlite
      HF_HUB_DISABLE_XET: '1'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install TC-big asset builder
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e './rocketdict-product-core[production,alt-mt]' -e ./rocketdict-workbench \
            'ctranslate2==4.8.2' 'sentencepiece==0.2.1' 'transformers==4.56.2' \
            'sacremoses==0.1.1' 'huggingface_hub==0.34.4' 'safetensors==0.6.2'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'

      - name: Download authenticated run57 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BASE_ARTIFACT_NAME }}
          path: work/base
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BASE_WORKFLOW_RUN_ID }}

      - name: Authenticate and stage exact run57 SQLite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROCKETDICT_NUMERIC_ROW_PROMOTION_ROOT"
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          dbs=[p for p in Path('work/base').rglob('rocketdict.sqlite') if p.is_file()]
          if len(dbs)!=1: raise SystemExit(f'run57 DB cardinality drift: {dbs}')
          sha=hashlib.sha256(dbs[0].read_bytes()).hexdigest()
          if sha!=os.environ['BASE_DB_SHA256']: raise SystemExit(f'run57 DB identity drift: {sha}')
          Path(os.environ['ROCKETDICT_NUMERIC_ROW_PROMOTION_DB']).write_bytes(dbs[0].read_bytes())
          PY
          echo "$BASE_DB_SHA256  $ROCKETDICT_NUMERIC_ROW_PROMOTION_DB" | sha256sum -c -

      - name: Restore pinned TC-big snapshot cache
        uses: actions/cache@v4
        with:
          path: work/tc-big-snapshot
          key: rocketdict-tc-big-en-zle-708be1d372fe4c358a352f404e6dc9ca0126ba48-e68caa9a

      - name: Obtain and build pinned TC-big
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id=os.environ['TC_BIG_REPO'],
              revision=os.environ['TC_BIG_REVISION'],
              local_dir=os.environ['TC_BIG_SNAPSHOT'],
              allow_patterns=['README.md','config.json','generation_config.json','model.safetensors','source.spm','special_tokens_map.json','target.spm','tokenizer_config.json','vocab.json'],
          )
          PY
          echo "$TC_BIG_WEIGHTS_SHA256  $TC_BIG_SNAPSHOT/model.safetensors" | sha256sum -c -
          rm -rf "$ROCKETDICT_TC_BIG_ASSET_DIR"
          rocketdict-assets build-tc-big-en-ru "$TC_BIG_SNAPSHOT" "$ROCKETDICT_TC_BIG_ASSET_DIR" > work/numeric-row-promotion-tc-big.json

      - name: Build torch-free promotion runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m venv work/promotion-venv
          work/promotion-venv/bin/python -m pip install --upgrade pip
          work/promotion-venv/bin/python -m pip install -e './rocketdict-product-core[production,alt-mt]' -e ./rocketdict-workbench
          work/promotion-venv/bin/python - <<'PY'
          import importlib.util
          if importlib.util.find_spec('torch') is not None:
              raise SystemExit('torch leaked into promotion inference runtime')
          PY

      - name: Promote exact run57 with TC-big numeric row rescue
        shell: bash
        run: |
          set -euo pipefail
          work/promotion-venv/bin/python -u rocketdict-workbench/tests/real_translation_full_opticks_tc_big_numeric_row_promotion.py | tee work/numeric-row-promotion.log

      - name: Run independent residual census on promoted run
        shell: bash
        run: |
          set -euo pipefail
          PROMOTED_RUN_ID=$(python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['ROCKETDICT_NUMERIC_ROW_PROMOTION_ROOT'])/'summary.json'
          print(json.loads(p.read_text(encoding='utf-8'))['promoted_translation_run_id'])
          PY
          )
          PROMOTED_DB_SHA=$(sha256sum "$ROCKETDICT_NUMERIC_ROW_PROMOTION_DB" | awk '{print $1}')
          export ROCKETDICT_RESIDUAL_CENSUS_ROOT="$ROCKETDICT_NUMERIC_ROW_PROMOTION_ROOT/residual-census"
          export ROCKETDICT_RESIDUAL_CENSUS_DB="$ROCKETDICT_NUMERIC_ROW_PROMOTION_DB"
          export ROCKETDICT_RESIDUAL_TRANSLATION_RUN_ID="$PROMOTED_RUN_ID"
          export ROCKETDICT_RESIDUAL_EXPECTED_DB_SHA256="$PROMOTED_DB_SHA"
          work/promotion-venv/bin/python -u rocketdict-workbench/tests/audit_translation_residual_census.py | tee work/numeric-row-residual-census.log

      - name: Verify promotion and independent census
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, sqlite3
          from pathlib import Path
          root=Path(os.environ['ROCKETDICT_NUMERIC_ROW_PROMOTION_ROOT'])
          promotion=json.loads((root/'numeric-row-promotion-evidence.json').read_text(encoding='utf-8'))
          census=json.loads((root/'residual-census'/'translation-residual-census.json').read_text(encoding='utf-8'))
          expected={'numeric_symbol':16,'punctuation':10,'length':0,'unique':25}
          if promotion['promoted_hard_counts']!=expected: raise SystemExit(f"promotion count drift: {promotion['promoted_hard_counts']}")
          if census['hard_gate_counts']!=expected: raise SystemExit(f"census count drift: {census['hard_gate_counts']}")
          if promotion['promoted_translation_run_id']!=census['translation_run_id']: raise SystemExit('run id cross-check drift')
          if promotion['promoted_translation_output_sha256']!=census['translation_output_sha256']: raise SystemExit('output SHA cross-check drift')
          if promotion['promoted_database_sha256']!=census['database_sha256']: raise SystemExit('database SHA cross-check drift')
          if promotion['changed_target_sequences']!=[2288,2355]: raise SystemExit('changed-target cohort drift')
          if promotion['unchanged_target_count']!=3333 or promotion['promoted_segment_count']!=3335: raise SystemExit('segmentation/unchanged drift')
          if promotion.get('rejected_progression_source_start')!=268952: raise SystemExit('progression negative-control drift')
          for flag in ('source_bytes_rewritten','model_input_source_rewritten','target_rewriting','placeholders','post_translation_literal_injection','corpus_specific_target_patches','evaluator_weakened','n_best_cherry_picking','automatic_n_best_cherry_picking'):
              if promotion[flag] is not False: raise SystemExit(f'unsafe promotion flag {flag}')
          for evidence in (promotion,census):
              c=dict(evidence); recorded=c.pop('evidence_sha256'); actual=hashlib.sha256(json.dumps(c,ensure_ascii=False,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
              if actual!=recorded: raise SystemExit('evidence SHA drift')
          db=Path(os.environ['ROCKETDICT_NUMERIC_ROW_PROMOTION_DB'])
          sha=hashlib.sha256(db.read_bytes()).hexdigest()
          if sha!=promotion['promoted_database_sha256']: raise SystemExit('persisted DB SHA drift')
          con=sqlite3.connect(db)
          integrity=con.execute('PRAGMA integrity_check').fetchone()[0]
          fk=len(con.execute('PRAGMA foreign_key_check').fetchall())
          con.close()
          if integrity!='ok' or fk!=0: raise SystemExit(f'SQLite integrity drift {integrity=} {fk=}')
          print(json.dumps({
              'promoted_run_id':promotion['promoted_translation_run_id'],
              'hard_counts':expected,
              'promotion_evidence_sha256':promotion['evidence_sha256'],
              'census_evidence_sha256':census['evidence_sha256'],
              'database_sha256':sha,
          },indent=2,ensure_ascii=False))
          PY

      - name: Upload promoted parent and evidence
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-full-opticks-tc-big-numeric-row-promotion
          path: |
            work/numeric-row-promotion-tc-big.json
            work/numeric-row-promotion.log
            work/numeric-row-residual-census.log
            work/full-opticks-tc-big-numeric-row-promotion/rocketdict.sqlite
            work/full-opticks-tc-big-numeric-row-promotion/*.json
            work/full-opticks-tc-big-numeric-row-promotion/residual-census/*.json
          if-no-files-found: error
          retention-days: 90
