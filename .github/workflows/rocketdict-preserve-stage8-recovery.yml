name: Preserve RocketDict Stage8 recovery evidence

on:
  push:
    paths:
      - .github/workflows/rocketdict-preserve-stage8-recovery.yml

permissions:
  contents: write
  actions: read

jobs:
  preserve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Recover exact registry member from surviving artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage8-recovery
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/9681838606/zip > /tmp/stage8-recovery/artifact.zip
          unzip -q /tmp/stage8-recovery/artifact.zip -d /tmp/stage8-recovery/unpacked
          src=/tmp/stage8-recovery/unpacked/members/src/rocketdict/nlp/registry.py
          test -f "$src"
          actual=$(sha256sum "$src" | awk '{print $1}')
          expected=02cfbb2347f141d9b77f4fca143322a4e4d7773dcf535611b664473510fbaf69
          test "$actual" = "$expected"
          test "$(stat -c %s "$src")" = "29072"
          mkdir -p rocketdict/recovered/stage8-0.30.40/src/rocketdict/nlp
          cp "$src" rocketdict/recovered/stage8-0.30.40/src/rocketdict/nlp/registry.py
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('rocketdict/recovered/stage8-0.30.40/recovery.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          members = data['stage8_overlay_prefix']['complete_members']
          registry = next(row for row in members if row['path'] == 'src/rocketdict/nlp/registry.py')
          registry['preserved_in_repository'] = 'rocketdict/recovered/stage8-0.30.40/src/rocketdict/nlp/registry.py'
          data['runtime_blocker'] = {
              'status': 'exact_core_incomplete',
              'runnable_product_core': False,
              'missing_public_api_modules_proven_by_package_root': [
                  'rocketdict.api.contracts',
                  'rocketdict.api.client',
                  'rocketdict.api.cli'
              ],
              'structured_callable_mapping_recovered': False,
              'full_required_stage_implementations_recovered': False,
              'promotion_rule': 'No Product dispatch until an exact compatible runtime imports successfully and passes live Workbench registry/API/binding/execution-contract verification.'
          }
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('rocketdict/recovered/stage8-0.30.40/src/rocketdict/nlp/registry.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '02cfbb2347f141d9b77f4fca143322a4e4d7773dcf535611b664473510fbaf69'
          data = json.loads(Path('rocketdict/recovered/stage8-0.30.40/recovery.json').read_text(encoding='utf-8'))
          assert data['active_product_core_recovered'] is False
          assert data['promotion_allowed'] is False
          assert data['runtime_blocker']['runnable_product_core'] is False
          PY
      - name: Commit exact recovery evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rocketdict/recovered/stage8-0.30.40/src/rocketdict/nlp/registry.py rocketdict/recovered/stage8-0.30.40/recovery.json
          git diff --cached --check
          git commit -m "Preserve exact recovered 0.30.40 NLP registry"
          git push origin HEAD:main
