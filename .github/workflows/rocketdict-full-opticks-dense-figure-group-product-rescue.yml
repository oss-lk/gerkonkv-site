name: RocketDict Full Opticks Dense Figure Group Product Rescue

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - 'rocketdict-product-core/src/rocketdict/translation_dense_figure_group_rescue_stage.py'
      - 'rocketdict-product-core/tests/test_translation_dense_figure_group_rescue_stage.py'
      - 'rocketdict-workbench/tests/real_translation_full_opticks_dense_figure_group_product_rescue.py'
      - '.github/workflows/rocketdict-full-opticks-dense-figure-group-product-rescue.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  full-opticks-dense-figure-group-rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_RUN_ID: '34678965465'
      BASE_ARTIFACT_NAME: rocketdict-full-opticks-parenthetical-whole-context-rescue
      BASE_DB_SHA256: 879ea83d0f6803e2fdce609e4ef0dc57017626e4fd0e007d3440b12c7f6f4f2d
      OPUS_URL: https://object.pouta.csc.fi/OPUS-MT-models/en-ru/opus-2020-02-11.zip
      OPUS_SHA256: 798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677
      ROCKETDICT_OPUS_ASSET_DIR: ${{ github.workspace }}/work/opus-asset
      ROCKETDICT_DENSE_FIGURE_GROUP_PRODUCT_ROOT: ${{ github.workspace }}/work/full-opticks-dense-figure-label-group-rescue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install maintained Product and Workbench runtimes
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './rocketdict-product-core[production]'
          python -m pip install -e ./rocketdict-workbench
      - name: Download immutable run20 evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BASE_ARTIFACT_NAME }}
          path: work/base
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BASE_RUN_ID }}
      - name: Stage exact run20 database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROCKETDICT_DENSE_FIGURE_GROUP_PRODUCT_ROOT"
          cp work/base/full-opticks-parenthetical-whole-context-rescue/rocketdict.sqlite "$ROCKETDICT_DENSE_FIGURE_GROUP_PRODUCT_ROOT/rocketdict.sqlite"
          echo "$BASE_DB_SHA256  $ROCKETDICT_DENSE_FIGURE_GROUP_PRODUCT_ROOT/rocketdict.sqlite" | sha256sum -c -
      - name: Restore pinned OPUS archive cache
        uses: actions/cache@v4
        with:
          path: work/opus-2020-02-11.zip
          key: rocketdict-opus-en-ru-2020-02-11-798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677
      - name: Obtain and verify official OPUS archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          if [ ! -s work/opus-2020-02-11.zip ]; then
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 "$OPUS_URL" -o work/opus-2020-02-11.zip.tmp
            echo "$OPUS_SHA256  work/opus-2020-02-11.zip.tmp" | sha256sum -c -
            mv work/opus-2020-02-11.zip.tmp work/opus-2020-02-11.zip
          fi
          echo "$OPUS_SHA256  work/opus-2020-02-11.zip" | sha256sum -c -
      - name: Build verified offline CTranslate2 float32 asset
        run: |
          rocketdict-assets build-opus-en-ru work/opus-2020-02-11.zip "$ROCKETDICT_OPUS_ASSET_DIR" | tee work/opus-asset-build.json
          test -s "$ROCKETDICT_OPUS_ASSET_DIR/rocketdict-opus-asset.json"
          test -s "$ROCKETDICT_OPUS_ASSET_DIR/ct2/model.bin"
      - name: Prove inference runtime stays Torch-free
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          if importlib.util.find_spec('torch') is not None:
              raise SystemExit('torch unexpectedly installed in dense-figure replay runtime')
          print('Torch-free OPUS runtime verified.')
          PY
      - name: Run exact run20 dense figure-label rescue and audit
        run: python -u rocketdict-workbench/tests/real_translation_full_opticks_dense_figure_group_product_rescue.py
      - name: Verify persisted evidence contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['ROCKETDICT_DENSE_FIGURE_GROUP_PRODUCT_ROOT'])
          evidence_path = root / 'full-opticks-dense-figure-label-group-rescue.json'
          summary_path = root / 'summary.json'
          db_path = root / 'rocketdict.sqlite'
          out_path = root / 'full-opticks-dense-figure-label-group-rescue.txt'
          for path in (evidence_path, summary_path, db_path, out_path):
              if not path.is_file() or path.stat().st_size <= 0:
                  raise SystemExit(f'missing persisted artifact: {path}')
          evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
          if evidence['schema'] != 'rocketdict-full-opticks-dense-figure-label-group-rescue-optin/1':
              raise SystemExit('schema drift')
          if evidence['final_hard_gate_counts'] != {'numeric_symbol': 19, 'punctuation': 14, 'length': 0, 'unique': 32}:
              raise SystemExit(f"hard-gate drift: {evidence['final_hard_gate_counts']!r}")
          if evidence['attempted_groups'] != [[1640, 1641]] or evidence['accepted_groups'] != [[1640, 1641]]:
              raise SystemExit('dense figure cohort drift')
          if evidence['selected_ranks'] != [0] or evidence['untouched_row_count'] != 3338:
              raise SystemExit('selection/untouched drift')
          if evidence['source_coverage_byte_exact'] is not True or evidence['untouched_source_target_exact'] is not True:
              raise SystemExit('source/untouched proof missing')
          if evidence['database_integrity_check'] != 'ok' or evidence['foreign_key_violation_count'] != 0:
              raise SystemExit('database integrity drift')
          if evidence['semantic_review']['all_diagnostic_anchors'] is not True:
              raise SystemExit('semantic diagnostic anchor drift')
          if evidence['semantic_review']['product_default_promotion_allowed'] is not False:
              raise SystemExit('research replay unexpectedly authorizes Product promotion')
          for flag in ('source_bytes_rewritten','target_rewriting','placeholders','post_translation_literal_injection','corpus_specific_target_patches','evaluator_weakened','n_best_cherry_picking'):
              if evidence[flag] is not False:
                  raise SystemExit(f'unsafe flag drift: {flag}')
          def sha(path):
              h=hashlib.sha256(); h.update(path.read_bytes()); return h.hexdigest()
          if sha(db_path) != evidence['final_database_sha256'] or sha(out_path) != evidence['final_text_sha256']:
              raise SystemExit('persisted SHA drift')
          canonical = dict(evidence); expected = canonical.pop('evidence_sha256')
          actual = hashlib.sha256(json.dumps(canonical, ensure_ascii=False, sort_keys=True, separators=(',',':'), allow_nan=False).encode('utf-8')).hexdigest()
          if actual != expected:
              raise SystemExit('canonical evidence SHA drift')
          print('Run21 dense figure-label evidence contract verified.')
          PY
      - name: Record runtime evidence
        if: always()
        shell: bash
        run: |
          mkdir -p work/dense-figure-runtime
          python -VV > work/dense-figure-runtime/python.txt || true
          python -m pip freeze | sort > work/dense-figure-runtime/pip-freeze.txt || true
          sha256sum work/opus-2020-02-11.zip > work/dense-figure-runtime/opus.sha256 || true
          if [ -s "$ROCKETDICT_DENSE_FIGURE_GROUP_PRODUCT_ROOT/full-opticks-dense-figure-label-group-rescue.json" ]; then
            sha256sum "$ROCKETDICT_DENSE_FIGURE_GROUP_PRODUCT_ROOT/full-opticks-dense-figure-label-group-rescue.json" > work/dense-figure-runtime/evidence-file.sha256
          fi
      - name: Upload persisted dense figure-label evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-full-opticks-dense-figure-label-group-rescue
          path: |
            work/opus-asset-build.json
            work/full-opticks-dense-figure-label-group-rescue/**
            work/dense-figure-runtime/**
          if-no-files-found: error
          retention-days: 90
