name: RocketDict Full Opticks TC-big Boundary-Pair Punctuation Rescue

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - 'rocketdict-product-core/src/rocketdict/translation_tc_big_boundary_pair_punctuation_rescue_stage.py'
      - 'rocketdict-workbench/tests/real_translation_full_opticks_tc_big_boundary_pair_punctuation_rescue.py'
      - '.github/workflows/rocketdict-full-opticks-tc-big-boundary-pair-punctuation-rescue.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  full-opticks-boundary-pair-rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUN16_RUN_ID: '34645769684'
      RUN16_ARTIFACT_NAME: rocketdict-full-opticks-tc-big-angular-dms-composed-product-rescue
      RUN16_DB_SHA256: 573a32c5dd3ba46f6bb16a91d7a3ca949c521dcf4f033b4ff040bf498cc2ad11
      TC_BIG_REPO: Helsinki-NLP/opus-mt-tc-big-en-zle
      TC_BIG_REVISION: 708be1d372fe4c358a352f404e6dc9ca0126ba48
      TC_BIG_WEIGHTS_SHA256: e68caa9a233c177a3489257b69c18cece6da97767ab2581918ce3fc3c3899416
      TC_BIG_SNAPSHOT: ${{ github.workspace }}/work/tc-big-snapshot
      ROCKETDICT_TC_BIG_ASSET_DIR: ${{ github.workspace }}/work/tc-big-asset
      ROCKETDICT_BOUNDARY_PAIR_PRODUCT_ROOT: ${{ github.workspace }}/work/full-opticks-tc-big-boundary-pair-punctuation-rescue
      HF_HUB_DISABLE_XET: '1'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install TC-big asset builder
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e './rocketdict-product-core[alt-mt]' \
            'ctranslate2==4.8.2' 'sentencepiece==0.2.1' \
            'transformers==4.56.2' 'sacremoses==0.1.1' \
            'huggingface_hub==0.34.4' 'safetensors==0.6.2'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'

      - name: Download immutable run-16 evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.RUN16_ARTIFACT_NAME }}
          path: work/run16
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.RUN16_RUN_ID }}

      - name: Stage exact run-16 database
        shell: bash
        run: |
          set -euo pipefail
          source_db=work/run16/tc-big-angular-dms-composed-product-rescue/rocketdict.sqlite
          test -s "$source_db"
          echo "$RUN16_DB_SHA256  $source_db" | sha256sum -c -
          mkdir -p "$ROCKETDICT_BOUNDARY_PAIR_PRODUCT_ROOT"
          cp "$source_db" "$ROCKETDICT_BOUNDARY_PAIR_PRODUCT_ROOT/rocketdict.sqlite"
          echo "$RUN16_DB_SHA256  $ROCKETDICT_BOUNDARY_PAIR_PRODUCT_ROOT/rocketdict.sqlite" | sha256sum -c -

      - name: Restore pinned TC-big snapshot cache
        uses: actions/cache@v4
        with:
          path: work/tc-big-snapshot
          key: rocketdict-tc-big-en-zle-708be1d372fe4c358a352f404e6dc9ca0126ba48-e68caa9a

      - name: Obtain exact pinned TC-big snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id=os.environ['TC_BIG_REPO'],
              revision=os.environ['TC_BIG_REVISION'],
              local_dir=os.environ['TC_BIG_SNAPSHOT'],
              allow_patterns=[
                  'README.md','config.json','generation_config.json','model.safetensors',
                  'source.spm','special_tokens_map.json','target.spm','tokenizer_config.json','vocab.json'
              ],
          )
          PY
          echo "$TC_BIG_WEIGHTS_SHA256  $TC_BIG_SNAPSHOT/model.safetensors" | sha256sum -c -

      - name: Build byte-verified offline TC-big asset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROCKETDICT_TC_BIG_ASSET_DIR"
          rocketdict-assets build-tc-big-en-ru "$TC_BIG_SNAPSHOT" "$ROCKETDICT_TC_BIG_ASSET_DIR" \
            | tee work/boundary-pair-tc-big-asset-build.json

      - name: Build torch-free replay runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m venv work/boundary-pair-runtime
          work/boundary-pair-runtime/bin/python -m pip install --upgrade pip
          work/boundary-pair-runtime/bin/python -m pip install \
            -e './rocketdict-product-core[alt-mt]' -e ./rocketdict-workbench
          work/boundary-pair-runtime/bin/python - <<'PY'
          import importlib.util
          if importlib.util.find_spec('torch') is not None:
              raise SystemExit('Torch unexpectedly installed in boundary-pair inference runtime')
          PY

      - name: Run exact run16 boundary-pair rescue and audit
        shell: bash
        run: |
          set -euo pipefail
          work/boundary-pair-runtime/bin/python -u \
            rocketdict-workbench/tests/real_translation_full_opticks_tc_big_boundary_pair_punctuation_rescue.py \
            | tee "$ROCKETDICT_BOUNDARY_PAIR_PRODUCT_ROOT/summary.json"

      - name: Verify persisted evidence contract
        shell: bash
        run: |
          set -euo pipefail
          work/boundary-pair-runtime/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['ROCKETDICT_BOUNDARY_PAIR_PRODUCT_ROOT'])
          evidence = json.loads((root/'full-opticks-tc-big-boundary-pair-punctuation-rescue.json').read_text(encoding='utf-8'))
          if evidence['schema'] != 'rocketdict-full-opticks-tc-big-boundary-pair-punctuation-rescue-optin/1':
              raise SystemExit('schema drift')
          if evidence['base_hard_gate_counts'] != {'numeric_symbol':20,'punctuation':18,'length':0,'unique':37}:
              raise SystemExit(f"base count drift: {evidence['base_hard_gate_counts']!r}")
          if evidence['final_hard_gate_counts'] != {'numeric_symbol':20,'punctuation':17,'length':0,'unique':36}:
              raise SystemExit(f"final count drift: {evidence['final_hard_gate_counts']!r}")
          if evidence['accepted_pair_count'] != 1 or evidence['accepted_pairs'][0]['boundary_offset'] != 522572:
              raise SystemExit('accepted pair drift')
          if evidence['untouched_base_row_count'] != 3342 or evidence['untouched_target_drift_count'] != 0:
              raise SystemExit('untouched-row drift')
          if evidence['source_coverage_byte_exact'] is not True:
              raise SystemExit('source coverage drift')
          if evidence['database_integrity_check'] != 'ok' or evidence['foreign_key_violation_count'] != 0:
              raise SystemExit('database integrity drift')
          if any(evidence.get(flag) is not False for flag in (
              'source_bytes_rewritten','target_rewriting','placeholders',
              'post_translation_literal_injection','corpus_specific_target_patches','evaluator_weakened'
          )):
              raise SystemExit('unsafe evidence flag')
          if evidence['promotion_allowed'] is not False or evidence['automatic_product_default_allowed'] is not False:
              raise SystemExit('research-only promotion guard drift')
          print(json.dumps({
              'base': evidence['base_hard_gate_counts'],
              'final': evidence['final_hard_gate_counts'],
              'accepted_boundary': evidence['accepted_pairs'][0]['boundary_offset'],
              'final_output_sha256': evidence['final_output_sha256'],
              'final_database_sha256': evidence['final_database_sha256'],
              'evidence_sha256': evidence['evidence_sha256'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Record runtime evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$ROCKETDICT_BOUNDARY_PAIR_PRODUCT_ROOT/runtime-evidence"
          work/boundary-pair-runtime/bin/python -VV > "$ROCKETDICT_BOUNDARY_PAIR_PRODUCT_ROOT/runtime-evidence/python.txt" 2>&1
          work/boundary-pair-runtime/bin/python -m pip freeze | sort > "$ROCKETDICT_BOUNDARY_PAIR_PRODUCT_ROOT/runtime-evidence/pip-freeze.txt" 2>&1
          sha256sum "$TC_BIG_SNAPSHOT/model.safetensors" > "$ROCKETDICT_BOUNDARY_PAIR_PRODUCT_ROOT/runtime-evidence/tc-big-weights.sha256" 2>&1

      - name: Upload persisted boundary-pair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-full-opticks-tc-big-boundary-pair-punctuation-rescue
          path: |
            work/full-opticks-tc-big-boundary-pair-punctuation-rescue/full-opticks-tc-big-boundary-pair-punctuation-rescue.json
            work/full-opticks-tc-big-boundary-pair-punctuation-rescue/summary.json
            work/full-opticks-tc-big-boundary-pair-punctuation-rescue/rocketdict.sqlite
            work/full-opticks-tc-big-boundary-pair-punctuation-rescue/runtime-evidence
            work/boundary-pair-tc-big-asset-build.json
          if-no-files-found: warn
          retention-days: 90
