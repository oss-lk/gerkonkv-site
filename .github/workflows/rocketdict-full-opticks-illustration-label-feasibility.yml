name: RocketDict Full Opticks Illustration Label Feasibility

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - 'rocketdict-product-core/src/rocketdict/runtime.py'
      - 'rocketdict-product-core/src/rocketdict/translation_rescue.py'
      - 'rocketdict-product-core/src/rocketdict/research_diagnostics.py'
      - 'rocketdict-product-core/src/rocketdict/numeric_integrity.py'
      - 'rocketdict-product-core/src/rocketdict/stages.py'
      - 'rocketdict-workbench/tests/real_translation_full_opticks_illustration_label_feasibility.py'
      - '.github/workflows/rocketdict-full-opticks-illustration-label-feasibility.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  illustration-label-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_RUN_ID: '34601313026'
      BASE_ARTIFACT_NAME: rocketdict-full-opticks-numeric-hard-product-rescue
      BASE_DB_SHA256: a84b2118f00bc386953fe11db48bdc29fcfe8db62735f9acf86178e1dbacf9a2
      OPUS_URL: https://object.pouta.csc.fi/OPUS-MT-models/en-ru/opus-2020-02-11.zip
      OPUS_SHA256: 798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677
      ROCKETDICT_OPUS_ASSET_DIR: ${{ github.workspace }}/work/opus-asset
      ROCKETDICT_ILLUSTRATION_FEASIBILITY_ROOT: ${{ github.workspace }}/work/illustration-feasibility
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install maintained Product and Workbench runtimes
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './rocketdict-product-core[production]'
          python -m pip install -e ./rocketdict-workbench
      - name: Download immutable run-8 Product evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BASE_ARTIFACT_NAME }}
          path: work/base
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BASE_RUN_ID }}
      - name: Assemble and verify persisted run-8 database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROCKETDICT_ILLUSTRATION_FEASIBILITY_ROOT"
          cp work/base/numeric-hard-product-rescue/rocketdict.sqlite "$ROCKETDICT_ILLUSTRATION_FEASIBILITY_ROOT/rocketdict.sqlite"
          echo "$BASE_DB_SHA256  $ROCKETDICT_ILLUSTRATION_FEASIBILITY_ROOT/rocketdict.sqlite" | sha256sum -c -
      - name: Restore pinned OPUS archive cache
        uses: actions/cache@v4
        with:
          path: work/opus-2020-02-11.zip
          key: rocketdict-opus-en-ru-2020-02-11-798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677
      - name: Obtain and verify pinned OPUS archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          if [ ! -s work/opus-2020-02-11.zip ]; then
            rm -f work/opus-2020-02-11.zip.tmp
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 "$OPUS_URL" -o work/opus-2020-02-11.zip.tmp
            echo "$OPUS_SHA256  work/opus-2020-02-11.zip.tmp" | sha256sum -c -
            mv work/opus-2020-02-11.zip.tmp work/opus-2020-02-11.zip
          fi
          echo "$OPUS_SHA256  work/opus-2020-02-11.zip" | sha256sum -c -
      - name: Build verified offline CTranslate2 float32 asset
        run: |
          rocketdict-assets build-opus-en-ru work/opus-2020-02-11.zip "$ROCKETDICT_OPUS_ASSET_DIR" | tee work/opus-asset-build.json
          test -s "$ROCKETDICT_OPUS_ASSET_DIR/rocketdict-opus-asset.json"
          test -s "$ROCKETDICT_OPUS_ASSET_DIR/ct2/model.bin"
      - name: Run illustration-label structural split feasibility
        run: python -u rocketdict-workbench/tests/real_translation_full_opticks_illustration_label_feasibility.py
      - name: Verify fail-closed v2 feasibility invariants
        shell: bash
        run: |
          set -euo pipefail
          test -s "$ROCKETDICT_ILLUSTRATION_FEASIBILITY_ROOT/full-opticks-illustration-label-feasibility.json"
          echo "$BASE_DB_SHA256  $ROCKETDICT_ILLUSTRATION_FEASIBILITY_ROOT/rocketdict.sqlite" | sha256sum -c -
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['ROCKETDICT_ILLUSTRATION_FEASIBILITY_ROOT'])
          evidence = json.loads((root / 'full-opticks-illustration-label-feasibility.json').read_text(encoding='utf-8'))
          if evidence['schema'] != 'rocketdict-full-opticks-illustration-label-feasibility/2':
              raise SystemExit(f"schema drift: {evidence['schema']!r}")
          if evidence['standalone_illustration_label_count'] != 57:
              raise SystemExit(f"illustration label count drift: {evidence['standalone_illustration_label_count']!r}")
          if evidence['attempted_source_starts'] != [72401, 90105, 203786]:
              raise SystemExit(f"illustration failure cohort drift: {evidence['attempted_source_starts']!r}")
          if evidence['normalized_model_input_source_starts'] != [72401, 90105]:
              raise SystemExit(f"normalized-input cohort drift: {evidence['normalized_model_input_source_starts']!r}")
          if evidence['accepted_source_starts'] != [203786]:
              raise SystemExit(f"fail-closed acceptance drift: {evidence['accepted_source_starts']!r}")
          normalized = [case for case in evidence['cases'] if case['source_model_input_normalized']]
          if [case['remainder_rank0_target'] for case in normalized] != ['Пример.', 'Пример.']:
              raise SystemExit(f"normalized OPUS target drift: {[case['remainder_rank0_target'] for case in normalized]!r}")
          if any(case['illustration_word_target_shape']['passed'] for case in normalized):
              raise SystemExit('ambiguous Illustration model input unexpectedly passed semantic target form')
          if evidence['v1_negative_evidence']['observed_raw_rank0_target'] != '*Иллюстрация._':
              raise SystemExit('v1 markup-corruption evidence drift')
          if evidence['base_hard_gate_counts'] != {'numeric_symbol': 25, 'punctuation': 33, 'length': 0, 'unique': 55}:
              raise SystemExit(f"base hard gates drift: {evidence['base_hard_gate_counts']!r}")
          if evidence['counterfactual_hard_gate_counts'] != {'numeric_symbol': 24, 'punctuation': 32, 'length': 0, 'unique': 54}:
              raise SystemExit(f"counterfactual hard gates drift: {evidence['counterfactual_hard_gate_counts']!r}")
          if evidence['source_coverage_byte_exact'] is not True or evidence['database_unchanged'] is not True:
              raise SystemExit('read-only/source-coverage proof missing')
          print('Illustration-label fail-closed v2 evidence verified.')
          PY
      - name: Record runtime identities
        if: always()
        shell: bash
        run: |
          mkdir -p work/illustration-runtime
          python -VV > work/illustration-runtime/python.txt || true
          python -m pip freeze | sort > work/illustration-runtime/pip-freeze.txt || true
          printf '%s\n' "$BASE_RUN_ID" > work/illustration-runtime/base-run-id.txt
          sha256sum work/opus-2020-02-11.zip > work/illustration-runtime/opus.sha256 || true
          if [ -s "$ROCKETDICT_ILLUSTRATION_FEASIBILITY_ROOT/full-opticks-illustration-label-feasibility.json" ]; then
            sha256sum "$ROCKETDICT_ILLUSTRATION_FEASIBILITY_ROOT/full-opticks-illustration-label-feasibility.json" > work/illustration-runtime/evidence.sha256
          fi
      - name: Upload illustration-label feasibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-full-opticks-illustration-label-feasibility
          path: |
            work/opus-asset-build.json
            work/illustration-feasibility/full-opticks-illustration-label-feasibility.json
            work/illustration-runtime/**
          if-no-files-found: warn
          retention-days: 90
