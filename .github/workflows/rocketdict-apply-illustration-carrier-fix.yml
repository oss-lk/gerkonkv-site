name: RocketDict apply illustration carrier fix

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - '.github/workflows/rocketdict-apply-illustration-carrier-fix.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/product-core-forward
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply semantic-carrier representation fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          source_path = Path('rocketdict-product-core/src/rocketdict/translation_illustration_rescue_stage.py')
          source = source_path.read_text(encoding='utf-8')
          source = source.replace(
              'ILLUSTRATION_LABEL_RESCUE_CONTRACT = "rocketdict-stage12-illustration-label-rescue/4"',
              'ILLUSTRATION_LABEL_RESCUE_CONTRACT = "rocketdict-stage12-illustration-label-rescue/5"',
          )
          source = source.replace(
              'ILLUSTRATION_LABEL_SELECTED_PHASE = "illustration-label-selected-v4"',
              'ILLUSTRATION_LABEL_SELECTED_PHASE = "illustration-label-selected-v5"',
          )

          replacement = r'''def _structural_candidate_rows(
              *, base: dict[str, Any], plan: dict[str, Any],
              label_model_input: str, suffix_model_input: str,
              label_hypotheses: list[dict[str, Any]], suffix_hypotheses: list[dict[str, Any]],
              label_selected_rank: int, suffix_selected_rank: int,
              trigger: dict[str, Any], selection: dict[str, Any],
          ) -> list[dict[str, Any]]:
              """Persist one hard-gate-safe carrier row for a four-piece source plan.

              The logical plan remains label/separator/suffix/trailing and is created
              before MT.  Only the two lexical spans are model inputs.  Source-owned
              structural spans are rendered from immutable source bytes into the one
              semantic carrier target; they are not persisted as standalone whitespace
              translation rows because Product hard gates are intentionally row-local.
              """
              if label_selected_rank != 0 or suffix_selected_rank != 0:
                  raise ValueError("illustration structural rescue is rank0-only")
              label = str(plan["label_source"])
              separator = str(plan["separator_source"])
              suffix = str(plan["suffix_source"])
              trailing = str(plan["trailing_source"])
              if label_model_input != label or suffix_model_input != suffix:
                  raise ValueError("illustration structural model input must equal exact source piece")
              label_rank0 = _unique_rank0(
                  label_hypotheses, label="illustration structural label"
              )
              suffix_rank0 = _unique_rank0(
                  suffix_hypotheses, label="illustration structural suffix"
              )
              label_target = str(label_rank0.get("text") or "")
              suffix_target = str(suffix_rank0.get("text") or "")
              expected_aggregate = label_target + separator + suffix_target + trailing
              if selection.get("accepted") is not True:
                  raise ValueError("illustration structural selection is not accepted")
              if str(selection.get("aggregate_target") or "") != expected_aggregate:
                  raise ValueError("illustration structural selection target drift")
              aggregate_verdict = dict(selection.get("aggregate_verdict") or {})
              if aggregate_verdict.get("strictly_eligible") is not True:
                  raise ValueError("illustration structural aggregate is not strictly eligible")

              start = int(base["source_start"])
              label_end = start + len(label)
              separator_end = label_end + len(separator)
              suffix_end = separator_end + len(suffix)
              end = int(base["source_end"])
              source = str(base.get("source_text") or "")
              if suffix_end + len(trailing) != end:
                  raise ValueError("illustration structural source bounds drift")
              if label + separator + suffix + trailing != source:
                  raise ValueError("illustration structural source plan no longer matches base source")

              generation = {
                  "beam_size": STRUCTURAL_WORD_BEAM_SIZE,
                  "num_hypotheses": STRUCTURAL_WORD_NUM_HYPOTHESES,
                  "max_decoding_length": MAX_DECODING_LENGTH,
                  "selection_authorized_ranks": [0],
              }
              pieces = [
                  {
                      "role": "label",
                      "kind": "translate",
                      "model": "opus",
                      "source_span": [start, label_end],
                      "source_text": label,
                      "model_input": label_model_input,
                      "model_input_source_exact": True,
                      "source_model_input_normalized": False,
                      "selected_rank": 0,
                      "selected_target": label_target,
                      "raw_model_selected": True,
                      "raw_score": label_rank0.get("score"),
                      "hypotheses": label_hypotheses,
                      "generation": dict(generation),
                  },
                  {
                      "role": "separator",
                      "kind": "preserve_source_structure",
                      "source_span": [label_end, separator_end],
                      "source_text": separator,
                      "rendered_text": separator,
                      "source_owned": True,
                  },
                  {
                      "role": "suffix",
                      "kind": "translate",
                      "model": "tc_big",
                      "source_span": [separator_end, suffix_end],
                      "source_text": suffix,
                      "model_input": suffix_model_input,
                      "model_input_source_exact": True,
                      "source_model_input_normalized": False,
                      "selected_rank": 0,
                      "selected_target": suffix_target,
                      "raw_model_selected": True,
                      "raw_score": suffix_rank0.get("score"),
                      "hypotheses": suffix_hypotheses,
                      "generation": dict(generation),
                  },
                  {
                      "role": "trailing",
                      "kind": "preserve_source_structure",
                      "source_span": [suffix_end, end],
                      "source_text": trailing,
                      "rendered_text": trailing,
                      "source_owned": True,
                  },
              ]
              source_plan = {
                  "contract": ILLUSTRATION_SOURCE_PLAN_CONTRACT,
                  "created_before_mt": True,
                  "rendering": "semantic_carrier",
                  "pieces": pieces,
              }
              base_planner = dict((base.get("payload") or {}).get("planner") or {})
              rescue = {
                  "contract": ILLUSTRATION_LABEL_RESCUE_CONTRACT,
                  "selector_contract": ILLUSTRATION_LABEL_SELECTOR_CONTRACT,
                  "trigger_contract": ILLUSTRATION_LABEL_TRIGGER_CONTRACT,
                  "source_plan_contract": ILLUSTRATION_SOURCE_PLAN_CONTRACT,
                  "target_form_contract": ILLUSTRATION_WORD_TARGET_FORM_CONTRACT,
                  "label_target_form_contract": ILLUSTRATION_LABEL_TARGET_FORM_CONTRACT,
                  "applied": True,
                  "candidate_kind": "source_planned_structural_illustration",
                  "role": "semantic_carrier",
                  "rendering": "source_planned_semantic_carrier",
                  "base_translation_segment_id": int(base["id"]),
                  "base_source_span": [start, end],
                  "figure_number": str(plan["figure_number"]),
                  "source_plan": source_plan,
                  "source_plan_created_before_mt": True,
                  "source_owned_structural_passthrough": True,
                  "source_owned_passthrough": False,
                  "trigger_evidence": trigger,
                  "selection": selection,
                  "rendered_target": expected_aggregate,
                  "raw_model_selected": False,
                  "component_raw_model_selected": True,
                  "raw_rank0_only": True,
                  **_safety_flags(),
              }
              payload = {
                  "planner": {
                      **base_planner,
                      "source": "illustration_source_planned_semantic_carrier",
                      "planner_contract": primary_stage.PLANNER_CONTRACT,
                      "split": False,
                      "rescue_strategy": "illustration_source_planned_semantic_carrier",
                      "illustration_label_rescue_contract": ILLUSTRATION_LABEL_RESCUE_CONTRACT,
                  },
                  "illustration_label_rescue": rescue,
              }
              return [
                  {
                      "sequence_number": 0,
                      "kind": "translation_segment",
                      "source_start": start,
                      "source_end": end,
                      "source_text": source,
                      "target_text": expected_aggregate,
                      "payload": payload,
                  }
              ]
          '''
          pattern = re.compile(
              r'def _structural_candidate_rows\([\s\S]*?\n\ndef _unique_rank0\(',
              re.MULTILINE,
          )
          source, count = pattern.subn(replacement + '\n\ndef _unique_rank0(', source, count=1)
          if count != 1:
              raise SystemExit(f'structural function replacement count={count}')
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('rocketdict-product-core/tests/test_translation_illustration_rescue_stage.py')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace(
              'assert ILLUSTRATION_LABEL_RESCUE_CONTRACT.endswith("/4")',
              'assert ILLUSTRATION_LABEL_RESCUE_CONTRACT.endswith("/5")',
          )
          tests = tests.replace(
              'assert ILLUSTRATION_LABEL_SELECTED_PHASE == "illustration-label-selected-v4"',
              'assert ILLUSTRATION_LABEL_SELECTED_PHASE == "illustration-label-selected-v5"',
          )
          new_test = r'''def test_structural_candidate_rows_persist_one_semantic_carrier() -> None:
              row = _structural_failing_row()
              trigger = evaluate_illustration_label_trigger(row)
              plan = dict(trigger["source_plan"])
              label_hypotheses = [
                  {"rank": 0, "text": "[Иллюстрация: FIG. 21.]", "score": -0.1}
              ]
              suffix_hypotheses = [
                  {"rank": 0, "text": "_Иллюстрация._", "score": -0.2}
              ]
              selection = evaluate_structural_separator_candidate(
                  row,
                  label_source=str(plan["label_source"]),
                  separator_source=str(plan["separator_source"]),
                  suffix_source=str(plan["suffix_source"]),
                  trailing_source=str(plan["trailing_source"]),
                  label_target=str(label_hypotheses[0]["text"]),
                  suffix_target=str(suffix_hypotheses[0]["text"]),
              )
              rows = _structural_candidate_rows(
                  base=row,
                  plan=plan,
                  label_model_input=str(plan["label_source"]),
                  suffix_model_input=str(plan["suffix_source"]),
                  label_hypotheses=label_hypotheses,
                  suffix_hypotheses=suffix_hypotheses,
                  label_selected_rank=0,
                  suffix_selected_rank=0,
                  trigger=trigger,
                  selection=selection,
              )
              assert len(rows) == 1
              carrier = rows[0]
              assert carrier["source_start"] == row["source_start"]
              assert carrier["source_end"] == row["source_end"]
              assert carrier["source_text"] == row["source_text"]
              assert carrier["target_text"] == selection["aggregate_target"]
              assert selection["aggregate_verdict"]["strictly_eligible"] is True

              rescue = carrier["payload"]["illustration_label_rescue"]
              assert rescue["role"] == "semantic_carrier"
              assert rescue["rendering"] == "source_planned_semantic_carrier"
              assert rescue["source_owned_passthrough"] is False
              assert rescue["source_owned_structural_passthrough"] is True
              assert rescue["raw_model_selected"] is False
              assert rescue["component_raw_model_selected"] is True
              assert rescue["raw_rank0_only"] is True
              assert rescue["rendered_target"] == carrier["target_text"]
              assert rescue["source_plan_contract"] == ILLUSTRATION_SOURCE_PLAN_CONTRACT
              assert rescue["source_plan_created_before_mt"] is True
              assert rescue["source_bytes_rewritten"] is False
              assert rescue["model_input_source_rewritten"] is False
              assert rescue["target_rewriting"] is False
              assert rescue["post_translation_literal_injection"] is False
              assert rescue["automatic_n_best_cherry_picking"] is False

              pieces = rescue["source_plan"]["pieces"]
              assert [piece["role"] for piece in pieces] == [
                  "label", "separator", "suffix", "trailing"
              ]
              assert "".join(piece["source_text"] for piece in pieces) == row["source_text"]
              assert pieces[0]["model"] == "opus"
              assert pieces[0]["model_input"] == pieces[0]["source_text"]
              assert pieces[0]["model_input_source_exact"] is True
              assert pieces[0]["selected_rank"] == 0
              assert pieces[0]["selected_target"] == "[Иллюстрация: FIG. 21.]"
              assert pieces[1]["source_owned"] is True
              assert pieces[1]["rendered_text"] == pieces[1]["source_text"] == "\n\n"
              assert pieces[2]["model"] == "tc_big"
              assert pieces[2]["model_input"] == pieces[2]["source_text"]
              assert pieces[2]["model_input_source_exact"] is True
              assert pieces[2]["selected_rank"] == 0
              assert pieces[2]["selected_target"] == "_Иллюстрация._"
              assert pieces[3]["source_owned"] is True
              assert pieces[3]["rendered_text"] == pieces[3]["source_text"] == " "
              rendered = (
                  pieces[0]["selected_target"]
                  + pieces[1]["rendered_text"]
                  + pieces[2]["selected_target"]
                  + pieces[3]["rendered_text"]
              )
              assert rendered == carrier["target_text"]
          '''
          test_pattern = re.compile(
              r'def test_structural_candidate_rows_are_four_source_planned_pieces\(\) -> None:[\s\S]*?\n\ndef test_structural_rows_reject_any_non_exact_model_input',
              re.MULTILINE,
          )
          tests, count = test_pattern.subn(
              new_test + '\n\ndef test_structural_rows_reject_any_non_exact_model_input',
              tests,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'structural test replacement count={count}')
          test_path.write_text(tests, encoding='utf-8')

          promotion_path = Path('rocketdict-workbench/tests/real_translation_full_opticks_illustration_structural_promotion.py')
          promotion = promotion_path.read_text(encoding='utf-8')
          promotion = promotion.replace(
              'EXPECTED_FINAL_SEGMENT_COUNT = 3341',
              'EXPECTED_FINAL_SEGMENT_COUNT = 3335',
          )
          provenance = r'''def _assert_structural_provenance(
              final_rows: list[dict[str, Any]], intervals: list[tuple[int, int]]
          ) -> list[dict[str, Any]]:
              cases: list[dict[str, Any]] = []
              for left, right in intervals:
                  carriers = [
                      row for row in _ordered(final_rows)
                      if int(row["source_start"]) == left and int(row["source_end"]) == right
                  ]
                  if len(carriers) != 1:
                      raise RuntimeError(
                          f"structural illustration {left}:{right} did not persist one semantic carrier"
                      )
                  row = carriers[0]
                  source = str(row.get("source_text") or "")
                  target = str(row.get("target_text") or "")
                  rescue = dict((row.get("payload") or {}).get("illustration_label_rescue") or {})
                  if rescue.get("contract") != ILLUSTRATION_LABEL_RESCUE_CONTRACT:
                      raise RuntimeError("illustration structural carrier contract drift")
                  if rescue.get("selector_contract") != ILLUSTRATION_LABEL_SELECTOR_CONTRACT:
                      raise RuntimeError("illustration structural carrier selector drift")
                  if rescue.get("source_plan_contract") != ILLUSTRATION_SOURCE_PLAN_CONTRACT:
                      raise RuntimeError("illustration structural carrier source-plan drift")
                  if rescue.get("applied") is not True or rescue.get("role") != "semantic_carrier":
                      raise RuntimeError("illustration structural carrier provenance drift")
                  if rescue.get("rendering") != "source_planned_semantic_carrier":
                      raise RuntimeError("illustration structural carrier rendering drift")
                  if rescue.get("raw_rank0_only") is not True:
                      raise RuntimeError("illustration structural carrier lost rank0-only provenance")
                  if rescue.get("source_owned_structural_passthrough") is not True:
                      raise RuntimeError("illustration structural carrier lost source-owned structure")
                  if rescue.get("source_owned_passthrough") is not False:
                      raise RuntimeError("mixed semantic carrier marked as pure passthrough")
                  if str(rescue.get("rendered_target") or "") != target:
                      raise RuntimeError("illustration structural carrier target provenance drift")
                  for flag in UNSAFE_FLAGS:
                      if rescue.get(flag) is not False:
                          raise RuntimeError(
                              f"illustration structural carrier unsafe {flag}={rescue.get(flag)!r}"
                          )

                  source_plan = dict(rescue.get("source_plan") or {})
                  if source_plan.get("contract") != ILLUSTRATION_SOURCE_PLAN_CONTRACT:
                      raise RuntimeError("illustration structural nested source-plan drift")
                  if source_plan.get("created_before_mt") is not True:
                      raise RuntimeError("illustration structural source plan was not pre-MT")
                  pieces = list(source_plan.get("pieces") or [])
                  if [piece.get("role") for piece in pieces] != [
                      "label", "separator", "suffix", "trailing"
                  ]:
                      raise RuntimeError("illustration structural piece-role drift")
                  rendered_parts: list[str] = []
                  piece_evidence: list[dict[str, Any]] = []
                  cursor = left
                  for piece in pieces:
                      span = list(piece.get("source_span") or [])
                      if len(span) != 2:
                          raise RuntimeError("illustration structural piece source-span drift")
                      start, end = int(span[0]), int(span[1])
                      if start != cursor or end < start or end > right:
                          raise RuntimeError("illustration structural piece coverage drift")
                      piece_source = str(piece.get("source_text") or "")
                      if source[start - left:end - left] != piece_source:
                          raise RuntimeError("illustration structural piece source bytes drift")
                      role = str(piece.get("role") or "")
                      if role in {"label", "suffix"}:
                          expected_model = "opus" if role == "label" else "tc_big"
                          if piece.get("kind") != "translate" or piece.get("model") != expected_model:
                              raise RuntimeError(f"translated {role} routing drift")
                          if piece.get("model_input_source_exact") is not True:
                              raise RuntimeError(f"translated {role} lost exact source/model identity")
                          if str(piece.get("model_input") or "") != piece_source:
                              raise RuntimeError(f"translated {role} model input differs from source span")
                          if int(piece.get("selected_rank", -1)) != 0:
                              raise RuntimeError(f"translated {role} selected non-rank0")
                          if piece.get("raw_model_selected") is not True:
                              raise RuntimeError(f"translated {role} lost raw-model provenance")
                          rendered_piece = str(piece.get("selected_target") or "")
                      else:
                          if piece.get("kind") != "preserve_source_structure":
                              raise RuntimeError(f"source-owned {role} kind drift")
                          if piece.get("source_owned") is not True:
                              raise RuntimeError(f"source-owned {role} ownership drift")
                          rendered_piece = str(piece.get("rendered_text") or "")
                          if rendered_piece != piece_source:
                              raise RuntimeError(f"source-owned {role} rendered bytes drift")
                      rendered_parts.append(rendered_piece)
                      piece_evidence.append(dict(piece))
                      cursor = end
                  if cursor != right:
                      raise RuntimeError("illustration structural source plan incomplete")
                  if "".join(rendered_parts) != target:
                      raise RuntimeError("illustration structural carrier target is not plan rendering")
                  verdict = evaluate_rescue_pair(source, target)
                  if verdict.get("strictly_eligible") is not True:
                      raise RuntimeError("illustration structural carrier fails maintained gates")
                  cases.append(
                      {
                          "source_span": [left, right],
                          "source_text": source,
                          "target_text": target,
                          "pieces": piece_evidence,
                      }
                  )
              return cases
          '''
          prov_pattern = re.compile(
              r'def _assert_structural_provenance\([\s\S]*?\n\ndef main\(\) -> int:',
              re.MULTILINE,
          )
          promotion, count = prov_pattern.subn(
              provenance + '\n\ndef main() -> int:', promotion, count=1
          )
          if count != 1:
              raise SystemExit(f'promotion provenance replacement count={count}')
          promotion_path.write_text(promotion, encoding='utf-8')
          PY
      - name: Verify targeted and maintained dependency-light regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ./rocketdict-product-core
          python -m pip install -e ./rocketdict-workbench
          python -m compileall -q rocketdict-product-core/src rocketdict-workbench/src
          pytest -q rocketdict-product-core/tests/test_translation_illustration_rescue_stage.py rocketdict-product-core/tests/test_translation_rank0_selection_policy.py
          pytest -q rocketdict-product-core/tests --ignore=rocketdict-product-core/tests/real_runtime_smoke.py
          pytest -q rocketdict-workbench/tests
      - name: Commit verified carrier representation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            rocketdict-product-core/src/rocketdict/translation_illustration_rescue_stage.py \
            rocketdict-product-core/tests/test_translation_illustration_rescue_stage.py \
            rocketdict-workbench/tests/real_translation_full_opticks_illustration_structural_promotion.py
          git diff --cached --check
          git diff --cached --quiet && { echo 'No carrier diff to commit'; exit 1; }
          git commit -m 'Render illustration structural plan through semantic carrier'
          git push origin HEAD:chatgpt/product-core-forward
