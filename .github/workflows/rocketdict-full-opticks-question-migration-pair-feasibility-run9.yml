name: RocketDict Full Opticks Question Migration Pair Feasibility Run9

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - 'rocketdict-product-core/src/rocketdict/runtime.py'
      - 'rocketdict-product-core/src/rocketdict/translation_rescue.py'
      - 'rocketdict-product-core/src/rocketdict/emphasis_markup.py'
      - 'rocketdict-workbench/tests/real_translation_full_opticks_question_migration_pair_feasibility_run9.py'
      - '.github/workflows/rocketdict-full-opticks-question-migration-pair-feasibility-run9.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  question-migration-pair-run9:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_RUN_ID: '34610787826'
      BASE_ARTIFACT_NAME: rocketdict-full-opticks-illustration-label-product-rescue
      BASE_DB_SHA256: 9e79e95f67188c751cf50a348c5d7e54ffdef73cd423c7c92601f5cb8c6332ad
      OPUS_URL: https://object.pouta.csc.fi/OPUS-MT-models/en-ru/opus-2020-02-11.zip
      OPUS_SHA256: 798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677
      ROCKETDICT_OPUS_ASSET_DIR: ${{ github.workspace }}/work/opus-asset
      ROCKETDICT_QUESTION_MIGRATION_PAIR_ROOT: ${{ github.workspace }}/work/question-migration-pair-run9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install maintained Product and Workbench runtimes
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './rocketdict-product-core[production]'
          python -m pip install -e ./rocketdict-workbench
      - name: Download immutable illustration run-9 Product evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BASE_ARTIFACT_NAME }}
          path: work/base
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BASE_RUN_ID }}
      - name: Assemble and verify persisted run-9 database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROCKETDICT_QUESTION_MIGRATION_PAIR_ROOT"
          cp work/base/illustration-product-rescue/rocketdict.sqlite "$ROCKETDICT_QUESTION_MIGRATION_PAIR_ROOT/rocketdict.sqlite"
          echo "$BASE_DB_SHA256  $ROCKETDICT_QUESTION_MIGRATION_PAIR_ROOT/rocketdict.sqlite" | sha256sum -c -
      - name: Restore pinned OPUS archive cache
        uses: actions/cache@v4
        with:
          path: work/opus-2020-02-11.zip
          key: rocketdict-opus-en-ru-2020-02-11-798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677
      - name: Obtain and verify pinned OPUS archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          if [ ! -s work/opus-2020-02-11.zip ]; then
            rm -f work/opus-2020-02-11.zip.tmp
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 "$OPUS_URL" -o work/opus-2020-02-11.zip.tmp
            echo "$OPUS_SHA256  work/opus-2020-02-11.zip.tmp" | sha256sum -c -
            mv work/opus-2020-02-11.zip.tmp work/opus-2020-02-11.zip
          fi
          echo "$OPUS_SHA256  work/opus-2020-02-11.zip" | sha256sum -c -
      - name: Build verified offline CTranslate2 float32 asset
        run: |
          rocketdict-assets build-opus-en-ru work/opus-2020-02-11.zip "$ROCKETDICT_OPUS_ASSET_DIR" | tee work/opus-asset-build.json
          test -s "$ROCKETDICT_OPUS_ASSET_DIR/rocketdict-opus-asset.json"
          test -s "$ROCKETDICT_OPUS_ASSET_DIR/ct2/model.bin"
      - name: Run complementary question-migration pair feasibility
        run: python -u rocketdict-workbench/tests/real_translation_full_opticks_question_migration_pair_feasibility_run9.py
      - name: Verify read-only pair invariants
        shell: bash
        run: |
          set -euo pipefail
          evidence="$ROCKETDICT_QUESTION_MIGRATION_PAIR_ROOT/full-opticks-question-migration-pair-feasibility-run9.json"
          test -s "$evidence"
          echo "$BASE_DB_SHA256  $ROCKETDICT_QUESTION_MIGRATION_PAIR_ROOT/rocketdict.sqlite" | sha256sum -c -
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['ROCKETDICT_QUESTION_MIGRATION_PAIR_ROOT'])
          evidence = json.loads((root / 'full-opticks-question-migration-pair-feasibility-run9.json').read_text(encoding='utf-8'))
          if evidence['schema'] != 'rocketdict-full-opticks-question-migration-pair-feasibility-run9/1':
              raise SystemExit(f"schema drift: {evidence['schema']!r}")
          if evidence['context_sequence'] != 2730 or evidence['complementary_failure_sequences'] != [3016,3020]:
              raise SystemExit('question migration trigger drift')
          expected=[
              {'name':'question_opening_pair','primary_sequences':[3016,3017],'source_start':530302,'source_end':530971,'nlp_token_count':138},
              {'name':'question_closing_pair','primary_sequences':[3019,3020],'source_start':531289,'source_end':531872,'nlp_token_count':132},
          ]
          if evidence['windows'] != expected:
              raise SystemExit(f"pair window drift: {evidence['windows']!r}")
          if evidence['maintained_whole_context_cap'] != 160:
              raise SystemExit('maintained cap drift')
          for case in evidence['cases']:
              if len(case['candidates']) != 6:
                  raise SystemExit(f"n-best cardinality drift for {case['name']}")
              for candidate in case['candidates']:
                  if candidate['mechanically_admissible'] and candidate['emphasis_markup']['passed'] is not True:
                      raise SystemExit(f"emphasis veto bypassed for {case['name']}")
          base=evidence['base_hard_gate_counts']; counter=evidence['counterfactual_hard_gate_counts']
          if any(counter[k] > base[k] for k in ('numeric_symbol','punctuation','length','unique')):
              raise SystemExit(f"counterfactual regression: {counter!r}")
          if evidence['source_coverage_byte_exact'] is not True or evidence['database_unchanged'] is not True:
              raise SystemExit('read-only/source coverage proof missing')
          for flag in ('source_bytes_rewritten','target_rewriting','placeholders','post_translation_literal_injection'):
              if evidence[flag] is not False:
                  raise SystemExit(f"unsafe flag drift: {flag}={evidence[flag]!r}")
          if evidence['promotion_allowed'] is not False or evidence['automatic_product_default_allowed'] is not False:
              raise SystemExit('research unexpectedly authorizes promotion')
          print('Run-9 complementary question migration pair evidence verified.')
          PY
      - name: Record runtime identities
        if: always()
        shell: bash
        run: |
          mkdir -p work/question-migration-pair-runtime
          python -VV > work/question-migration-pair-runtime/python.txt || true
          python -m pip freeze | sort > work/question-migration-pair-runtime/pip-freeze.txt || true
          sha256sum work/opus-2020-02-11.zip > work/question-migration-pair-runtime/opus.sha256 || true
          if [ -s "$ROCKETDICT_QUESTION_MIGRATION_PAIR_ROOT/full-opticks-question-migration-pair-feasibility-run9.json" ]; then
            sha256sum "$ROCKETDICT_QUESTION_MIGRATION_PAIR_ROOT/full-opticks-question-migration-pair-feasibility-run9.json" > work/question-migration-pair-runtime/evidence.sha256
          fi
      - name: Upload question-migration pair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-full-opticks-question-migration-pair-feasibility-run9
          path: |
            work/opus-asset-build.json
            work/question-migration-pair-run9/full-opticks-question-migration-pair-feasibility-run9.json
            work/question-migration-pair-runtime/**
          if-no-files-found: warn
          retention-days: 90
