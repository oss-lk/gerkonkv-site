name: RocketDict Run59 Combined Greek Source Plan DOE

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - 'rocketdict-workbench/tests/real_translation_run59_combined_greek_source_plan_doe.py'
      - '.github/workflows/rocketdict-run59-forward-paragraph-boundary-resegmentation-doe.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  run59-combined-greek-doe:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      RUN59_RUN_ID: '34753122528'
      RUN59_ARTIFACT_NAME: rocketdict-canonical-run59-m2m100-arithmetic
      RUN59_DB_SHA256: 41bafa00619c83b87f55f7e452f8e9e27a1871d601bb5c846d3d561531dbb78d
      OPUS_URL: https://object.pouta.csc.fi/OPUS-MT-models/en-ru/opus-2020-02-11.zip
      OPUS_SHA256: 798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677
      ROCKETDICT_OPUS_ASSET_DIR: ${{ github.workspace }}/work/opus-asset
      ROCKETDICT_RUN59_COMBINED_GREEK_DOE_ROOT: ${{ github.workspace }}/work/run59-combined-greek-source-plan-doe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install maintained Product and Workbench runtimes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e './rocketdict-product-core[production]' -e ./rocketdict-workbench
      - name: Download immutable canonical run59 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.RUN59_ARTIFACT_NAME }}
          path: work/run59
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.RUN59_RUN_ID }}
      - name: Stage exact canonical run59 database
        shell: bash
        run: |
          set -euo pipefail
          source_db=work/run59/canonical/rocketdict.sqlite
          echo "$RUN59_DB_SHA256  $source_db" | sha256sum -c -
          mkdir -p "$ROCKETDICT_RUN59_COMBINED_GREEK_DOE_ROOT"
          cp "$source_db" "$ROCKETDICT_RUN59_COMBINED_GREEK_DOE_ROOT/rocketdict.sqlite"
          echo "$RUN59_DB_SHA256  $ROCKETDICT_RUN59_COMBINED_GREEK_DOE_ROOT/rocketdict.sqlite" | sha256sum -c -
      - name: Restore pinned OPUS archive cache
        uses: actions/cache@v4
        with:
          path: work/opus-2020-02-11.zip
          key: rocketdict-opus-en-ru-2020-02-11-798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677
      - name: Obtain and verify official OPUS archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          if [ ! -s work/opus-2020-02-11.zip ]; then
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 "$OPUS_URL" -o work/opus-2020-02-11.zip
          fi
          echo "$OPUS_SHA256  work/opus-2020-02-11.zip" | sha256sum -c -
      - name: Build verified offline OPUS float32 asset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROCKETDICT_OPUS_ASSET_DIR"
          rocketdict-assets build-opus-en-ru work/opus-2020-02-11.zip "$ROCKETDICT_OPUS_ASSET_DIR" | tee work/combined-greek-opus-asset-build.json
          test -s "$ROCKETDICT_OPUS_ASSET_DIR/ct2/model.bin"
      - name: Prove inference runtime stays Torch-free
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          if importlib.util.find_spec('torch') is not None: raise SystemExit('torch unexpectedly present')
          PY
      - name: Run exact read-only combined Greek source-plan DOE
        shell: bash
        run: |
          set -euo pipefail
          python -u rocketdict-workbench/tests/real_translation_run59_combined_greek_source_plan_doe.py | tee "$ROCKETDICT_RUN59_COMBINED_GREEK_DOE_ROOT/summary.json"
          echo "$RUN59_DB_SHA256  $ROCKETDICT_RUN59_COMBINED_GREEK_DOE_ROOT/rocketdict.sqlite" | sha256sum -c -
      - name: Verify immutable evidence contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROCKETDICT_RUN59_COMBINED_GREEK_DOE_ROOT'])
          e=json.loads((root/'run59-combined-greek-source-plan-doe.json').read_text(encoding='utf-8'))
          assert e['schema']=='rocketdict-run59-combined-greek-source-plan-doe/1'
          assert e['base_run_id']==59 and e['segment_count']==3335
          assert e['combined_greek_row_count']==2 and e['preserved_combined_greek_row_count']==1 and e['trigger_count']==1
          assert e['source_plan']['created_before_mt'] is True and e['source_plan']['source_owned_technical_passthrough'] is True
          assert all(int(x['hypothesis']['rank'])==0 and x['model_input']==(e['source_plan']['prefix_source'] if x['role']=='prefix' else e['source_plan']['suffix_source']) for x in e['lexical_candidates'])
          assert e['source_coverage_byte_exact'] is True and e['database_unchanged'] is True
          assert e['promotion_allowed'] is False and e['automatic_product_default_allowed'] is False
          print(json.dumps({'trigger_sequence':e['trigger_sequence'],'accepted':e['aggregate_selection']['accepted'],'candidate_target':e['candidate_target'],'evidence_sha256':e['evidence_sha256']},ensure_ascii=False,indent=2))
          PY
      - name: Record runtime evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$ROCKETDICT_RUN59_COMBINED_GREEK_DOE_ROOT/runtime-evidence"
          python -VV > "$ROCKETDICT_RUN59_COMBINED_GREEK_DOE_ROOT/runtime-evidence/python.txt" 2>&1
          python -m pip freeze | sort > "$ROCKETDICT_RUN59_COMBINED_GREEK_DOE_ROOT/runtime-evidence/pip-freeze.txt" 2>&1
      - name: Upload read-only DOE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-run59-combined-greek-source-plan-doe
          path: |
            work/run59-combined-greek-source-plan-doe/*.json
            work/run59-combined-greek-source-plan-doe/runtime-evidence
            work/combined-greek-opus-asset-build.json
          if-no-files-found: warn
          retention-days: 90
