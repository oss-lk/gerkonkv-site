name: RocketDict Stage10 default V1 migration

on:
  push:
    branches:
      - chatgpt/product-core-forward
    paths:
      - .github/workflows/rocketdict-stage10-default-v1-fix.yml

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/product-core-forward
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch low-level Stage10 default and regression
        run: |
          python - <<'PY'
          from pathlib import Path

          stages = Path('rocketdict-product-core/src/rocketdict/stages.py')
          text = stages.read_text(encoding='utf-8')
          old = '    implementation: str = "structural-entity-term-discourse-pronoun-v2",\n'
          new = '    implementation: str = "structural-entity-term-discourse-pronoun-v1",\n'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected Stage10 default occurrence count: {text.count(old)}')
          stages.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('rocketdict-product-core/tests/test_stage10_context_coalescing.py')
          text = test.read_text(encoding='utf-8')
          old_name = 'def test_stage10_v2_coalesces_false_parser_boundary_and_invalidates_v1_cache(tmp_path: Path) -> None:\n'
          new_name = 'def test_stage10_default_is_v1_and_explicit_v2_coalesces_false_parser_boundary(tmp_path: Path) -> None:\n'
          if text.count(old_name) != 1:
              raise SystemExit('Stage10 regression test name drifted')
          text = text.replace(old_name, new_name, 1)

          old_block = '''    repaired = run_stage10(db, nlp_run_id=nlp_run_id)\n    assert repaired["schema"] == "rocketdict-product-stage10/2"\n    assert repaired["implementation"] == STAGE10_CONTEXT_IMPLEMENTATION_V2\n'''
          new_block = '''    defaulted = run_stage10(db, nlp_run_id=nlp_run_id)\n    assert defaulted["schema"] == "rocketdict-product-stage10/1"\n    assert defaulted["context_run_id"] == legacy["context_run_id"]\n    assert defaulted["cache_hit"] is True\n\n    repaired = run_stage10(\n        db,\n        nlp_run_id=nlp_run_id,\n        implementation=STAGE10_CONTEXT_IMPLEMENTATION_V2,\n    )\n    assert repaired["schema"] == "rocketdict-product-stage10/2"\n    assert repaired["implementation"] == STAGE10_CONTEXT_IMPLEMENTATION_V2\n'''
          if text.count(old_block) != 1:
              raise SystemExit('Stage10 repaired-call regression block drifted')
          text = text.replace(old_block, new_block, 1)

          old_cached = '    cached = run_stage10(db, nlp_run_id=nlp_run_id)\n'
          new_cached = '''    cached = run_stage10(\n        db,\n        nlp_run_id=nlp_run_id,\n        implementation=STAGE10_CONTEXT_IMPLEMENTATION_V2,\n    )\n'''
          if text.count(old_cached) != 1:
              raise SystemExit('Stage10 cached-call regression block drifted')
          text = text.replace(old_cached, new_cached, 1)
          test.write_text(text, encoding='utf-8')
          PY

      - name: Install focused Product Core test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./rocketdict-product-core pytest

      - name: Verify Stage10 default and boundary behavior
        run: |
          pytest -q \
            rocketdict-product-core/tests/test_stage10_context_coalescing.py \
            rocketdict-product-core/tests/test_context_sentence_boundaries.py \
            rocketdict-product-core/tests/test_product_stages.py

      - name: Persist verified migration and remove one-shot workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/rocketdict-stage10-default-v1-fix.yml
          git add rocketdict-product-core/src/rocketdict/stages.py rocketdict-product-core/tests/test_stage10_context_coalescing.py
          git diff --cached --check
          git commit -m "Keep Stage10 V1 as the low-level default"
          git push origin HEAD:chatgpt/product-core-forward
