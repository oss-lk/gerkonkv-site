name: RocketDict Full Opticks MetricX QE Audit

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - 'rocketdict-workbench/tests/real_translation_full_opticks_metricx_qe_audit.py'
      - '.github/workflows/rocketdict-full-opticks-metricx-qe.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  metricx-qe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASELINE_RUN_ID: '34441822239'
      BASELINE_ARTIFACT_NAME: rocketdict-full-opticks-product-stage12-audit
      BASELINE_JSON_SHA256: 3d899605172decdadbab55eedf9fb161c5dd599a921679bea47fd98adbf2efb4
      BASELINE_DB_SHA256: eff56dab177baa161b6e8126a9ff75ecdc341c19deff5866fec201c6bf232687
      NBEST_RUN_ID: '34453655427'
      NBEST_ARTIFACT_NAME: rocketdict-full-opticks-tc-big-failure-nbest
      METRICX_REPO: google/metricx-24-hybrid-large-v2p6-bfloat16
      METRICX_REVISION: febb720e29a059df2e8af3ffd71dcdc9e0a24910
      METRICX_WEIGHTS_SHA256: b1f2c03ab5ec5318a55b90b42eefa22431daa7b1a8e28a97a6aef23d18a24278
      METRICX_CODE_REVISION: fc4978eb064670f7cc33e93ea4f52d38396b8ae6
      TOKENIZER_REPO: google/mt5-large
      TOKENIZER_REVISION: 50b7223e98fcd124b0cabb1ec81bc6324c7df107
      ROCKETDICT_METRICX_MODEL_DIR: ${{ github.workspace }}/work/metricx-model
      ROCKETDICT_METRICX_TOKENIZER_DIR: ${{ github.workspace }}/work/metricx-tokenizer
      ROCKETDICT_QE_ROOT: ${{ github.workspace }}/work/qe-input
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # transformers 4.30.2 requires tokenizers <0.14. The pinned
          # tokenizers 0.13.3 has a manylinux CPython 3.11 wheel, whereas
          # Python 3.12 falls back to a fragile source build of this old stack.
          python-version: '3.11'
      - name: Install pinned MetricX runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
          python -m pip install \
            'transformers==4.30.2' \
            'tokenizers==0.13.3' \
            'huggingface_hub==0.34.4' \
            'sentencepiece==0.2.1' \
            'protobuf==3.20.3'
      - name: Download immutable Product baseline
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BASELINE_ARTIFACT_NAME }}
          path: work/baseline
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BASELINE_RUN_ID }}
      - name: Download immutable TC-big n-best evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.NBEST_ARTIFACT_NAME }}
          path: work/nbest
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.NBEST_RUN_ID }}
      - name: Assemble and verify immutable QE inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROCKETDICT_QE_ROOT"
          root=work/baseline/full-opticks-numeric-stress
          cp "$root/full-opticks-numeric-stress.json" "$ROCKETDICT_QE_ROOT/full-opticks-numeric-stress.json"
          cp "$root/project/data/rocketdict.sqlite" "$ROCKETDICT_QE_ROOT/rocketdict.sqlite"
          cp work/nbest/baseline/full-opticks-numeric-stress/full-opticks-tc-big-failure-nbest.json \
            "$ROCKETDICT_QE_ROOT/full-opticks-tc-big-failure-nbest.json"
          echo "$BASELINE_JSON_SHA256  $ROCKETDICT_QE_ROOT/full-opticks-numeric-stress.json" | sha256sum -c -
          echo "$BASELINE_DB_SHA256  $ROCKETDICT_QE_ROOT/rocketdict.sqlite" | sha256sum -c -
      - name: Restore exact MetricX model cache
        uses: actions/cache@v4
        with:
          path: work/metricx-model
          key: rocketdict-metricx24-large-bf16-febb720-b1f2c03a
      - name: Obtain exact pinned MetricX model
        shell: bash
        run: |
          set -euo pipefail
          required=(README.md config.json pytorch_model.bin)
          cache_ok=1
          for relative in "${required[@]}"; do
            if [ ! -s "$ROCKETDICT_METRICX_MODEL_DIR/$relative" ]; then
              cache_ok=0
              break
            fi
          done
          if [ "$cache_ok" = 1 ] && echo "$METRICX_WEIGHTS_SHA256  $ROCKETDICT_METRICX_MODEL_DIR/pytorch_model.bin" | sha256sum -c - >/dev/null; then
            echo "Using exact cached MetricX snapshot."
          else
            rm -rf "$ROCKETDICT_METRICX_MODEL_DIR"
            python - <<'PY'
          import os
          import time
          from huggingface_hub import snapshot_download

          kwargs = dict(
              repo_id=os.environ['METRICX_REPO'],
              revision=os.environ['METRICX_REVISION'],
              local_dir=os.environ['ROCKETDICT_METRICX_MODEL_DIR'],
              allow_patterns=['README.md', 'config.json', 'pytorch_model.bin'],
          )
          for attempt in range(5):
              try:
                  snapshot_download(**kwargs)
                  break
              except Exception:
                  if attempt == 4:
                      raise
                  time.sleep(15 * (attempt + 1))
          PY
          fi
          for relative in "${required[@]}"; do
            test -s "$ROCKETDICT_METRICX_MODEL_DIR/$relative"
          done
          echo "$METRICX_WEIGHTS_SHA256  $ROCKETDICT_METRICX_MODEL_DIR/pytorch_model.bin" | sha256sum -c -
          grep -qi 'license: apache-2.0' "$ROCKETDICT_METRICX_MODEL_DIR/README.md"
      - name: Restore exact mT5 tokenizer cache
        uses: actions/cache@v4
        with:
          path: work/metricx-tokenizer
          key: rocketdict-mt5-large-tokenizer-50b7223
      - name: Obtain exact pinned mT5 tokenizer
        shell: bash
        run: |
          set -euo pipefail
          required=(config.json special_tokens_map.json spiece.model tokenizer_config.json)
          cache_ok=1
          for relative in "${required[@]}"; do
            if [ ! -s "$ROCKETDICT_METRICX_TOKENIZER_DIR/$relative" ]; then
              cache_ok=0
              break
            fi
          done
          if [ "$cache_ok" != 1 ]; then
            rm -rf "$ROCKETDICT_METRICX_TOKENIZER_DIR"
            python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id=os.environ['TOKENIZER_REPO'],
              revision=os.environ['TOKENIZER_REVISION'],
              local_dir=os.environ['ROCKETDICT_METRICX_TOKENIZER_DIR'],
              allow_patterns=[
                  'config.json',
                  'special_tokens_map.json',
                  'spiece.model',
                  'tokenizer_config.json',
              ],
          )
          PY
          fi
          for relative in "${required[@]}"; do
            test -s "$ROCKETDICT_METRICX_TOKENIZER_DIR/$relative"
          done
      - name: Obtain exact MetricX inference code
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/google-research/metricx.git work/metricx-code
          git -C work/metricx-code checkout --detach "$METRICX_CODE_REVISION"
          test "$(git -C work/metricx-code rev-parse HEAD)" = "$METRICX_CODE_REVISION"
      - name: Run MetricX reference-free QE research audit
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="${{ github.workspace }}/work/metricx-code${PYTHONPATH:+:$PYTHONPATH}"
          python -u rocketdict-workbench/tests/real_translation_full_opticks_metricx_qe_audit.py
      - name: Re-verify immutable Product database
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$ROCKETDICT_QE_ROOT/rocketdict.sqlite"
          echo "$BASELINE_DB_SHA256  $ROCKETDICT_QE_ROOT/rocketdict.sqlite" | sha256sum -c -
      - name: Record runtime identities and resources
        if: always()
        shell: bash
        run: |
          mkdir -p work/metricx-qe-runtime-evidence
          python -VV > work/metricx-qe-runtime-evidence/python.txt || true
          python -m pip freeze | sort > work/metricx-qe-runtime-evidence/pip-freeze.txt || true
          df -h > work/metricx-qe-runtime-evidence/disk.txt || true
          free -h > work/metricx-qe-runtime-evidence/memory.txt || true
          sha256sum "$ROCKETDICT_METRICX_MODEL_DIR"/* > work/metricx-qe-runtime-evidence/model-files.sha256 || true
          sha256sum "$ROCKETDICT_METRICX_TOKENIZER_DIR"/* > work/metricx-qe-runtime-evidence/tokenizer-files.sha256 || true
          git -C work/metricx-code rev-parse HEAD > work/metricx-qe-runtime-evidence/metricx-code-revision.txt || true
      - name: Upload MetricX QE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-full-opticks-metricx-qe-audit
          path: |
            work/qe-input/full-opticks-metricx-qe-audit.json
            work/metricx-qe-runtime-evidence/**
          if-no-files-found: warn
          retention-days: 90
