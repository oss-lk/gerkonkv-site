name: RocketDict Stage 8 independent validation R1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rocketdict-stage8-independent-validation-r1.yml'
      - 'rocketdict-ci/stage8_independent_validation_r1.py'
      - 'rocketdict-ci/stage8_independent_validation_r1_shard.py'
      - 'rocketdict-ci/stage8_independent_validation_r1_combine.py'
      - 'rocketdict-ci/stage8_validation_selection_r1.py'
      - 'rocketdict-ci/stage8_v9_term_rescue_gate.py'
      - 'rocketdict-ci/stage8_whole_context_structural_q1.py'
      - 'rocketdict-ci/stage8_term_case_consistency_p1.py'
      - 'rocketdict-ci/stage8_semantic_term_retention_o2.py'
      - 'rocketdict-ci/stage8_semantic_regression_proxy.py'
      - 'rocketdict-ci/stage8_ghi_reconstruction_v8.py'
      - 'rocketdict-ci/stage8_ghi_reconstruction_v7.py'
      - 'rocketdict-ci/stage8_ghi_reconstruction_v6.py'
      - 'rocketdict-ci/stage8_ghi_reconstruction_v5.py'
      - 'rocketdict-ci/stage8_ghi_reconstruction_v4.py'
      - 'rocketdict-ci/stage8_ghi_reconstruction_v3.py'
      - 'rocketdict-ci/stage8_ghi_reconstruction_gate.py'
      - 'rocketdict-ci/stage8_g_nbest_probe.py'
      - 'rocketdict-ci/real_opus_gate.py'
      - 'rocketdict-ci/stage8-independent-validation-r1-trigger.txt'
  workflow_dispatch:

jobs:
  forward-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install real OPUS runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'ctranslate2>=4.5,<5' 'sentencepiece>=0.2,<1' 'PyYAML>=6,<7' 'sacrebleu>=2.4,<3' 'nltk>=3.9,<4'
      - name: Run frozen v8 forward shard
        env:
          R1_SHARD_INDEX: ${{ matrix.shard }}
          R1_SHARD_COUNT: '8'
        run: python rocketdict-ci/stage8_independent_validation_r1_shard.py
      - name: Upload forward shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-stage8-r1-forward-${{ matrix.shard }}
          path: |
            work-stage8-independent-validation-r1-shards/shard-${{ matrix.shard }}/forward-shard.json
            work-stage8-independent-validation-r1-shards/shard-${{ matrix.shard }}/units-shard.jsonl
            work-stage8-independent-validation-r1-shards/shard-${{ matrix.shard }}/v8-evidence/**
          if-no-files-found: warn
          retention-days: 30

  combine-and-semantic:
    needs: forward-shards
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download all forward shards
        uses: actions/download-artifact@v4
        with:
          pattern: rocketdict-stage8-r1-forward-*
          path: downloaded-r1-forward
          merge-multiple: false
      - name: Install pinned semantic runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'ctranslate2>=4.5,<5' 'sentencepiece>=0.2,<1' 'PyYAML>=6,<7' 'sacrebleu>=2.4,<3' 'nltk>=3.9,<4'
      - name: Recombine exact 103-unit R1 and continue unchanged O-v2/Q-v1
        run: python rocketdict-ci/stage8_independent_validation_r1_combine.py downloaded-r1-forward
      - name: Upload independent validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-stage8-independent-validation-r1
          path: |
            work-stage8-independent-validation-r1/evidence/**
            work-stage8-ghi-reconstruction/evidence/**
          if-no-files-found: warn
          retention-days: 30
