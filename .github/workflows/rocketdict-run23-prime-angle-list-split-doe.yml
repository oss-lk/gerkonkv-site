name: RocketDict Run23 Prime Angle-List Split DOE

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - 'rocketdict-workbench/tests/real_translation_run23_prime_angle_list_split_doe.py'
      - '.github/workflows/rocketdict-run23-prime-angle-list-split-doe.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  run23-prime-angle-list-split-doe:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      BASE_RUN_ID: '34688874921'
      BASE_ARTIFACT_NAME: rocketdict-full-opticks-emphasized-modifier-boundary-rescue
      BASE_DB_SHA256: 75ec63ea1b8b905af17a757a2a0dcd2697718945a6e9d354d494bb05d2364ca8
      OPUS_URL: https://object.pouta.csc.fi/OPUS-MT-models/en-ru/opus-2020-02-11.zip
      OPUS_SHA256: 798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677
      TC_BIG_REPO: Helsinki-NLP/opus-mt-tc-big-en-zle
      TC_BIG_REVISION: 708be1d372fe4c358a352f404e6dc9ca0126ba48
      TC_BIG_WEIGHTS_SHA256: e68caa9a233c177a3489257b69c18cece6da97767ab2581918ce3fc3c3899416
      TC_BIG_SNAPSHOT: ${{ github.workspace }}/work/tc-big-snapshot
      ROCKETDICT_OPUS_ASSET_DIR: ${{ github.workspace }}/work/opus-asset
      ROCKETDICT_TC_BIG_ASSET_DIR: ${{ github.workspace }}/work/tc-big-asset
      ROCKETDICT_RUN23_PRIME_ANGLE_LIST_SPLIT_DOE_ROOT: ${{ github.workspace }}/work/run23-prime-angle-list-split-doe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install maintained research runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e './rocketdict-product-core[production,alt-mt]' -e ./rocketdict-workbench \
            'ctranslate2==4.8.2' 'sentencepiece==0.2.1' \
            'transformers==4.56.2' 'sacremoses==0.1.1' \
            'huggingface_hub==0.34.4' 'safetensors==0.6.2'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
      - name: Download exact persisted run23 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BASE_ARTIFACT_NAME }}
          path: work/base
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BASE_RUN_ID }}
      - name: Stage and verify exact run23 database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROCKETDICT_RUN23_PRIME_ANGLE_LIST_SPLIT_DOE_ROOT"
          cp work/base/full-opticks-emphasized-modifier-boundary-rescue/rocketdict.sqlite "$ROCKETDICT_RUN23_PRIME_ANGLE_LIST_SPLIT_DOE_ROOT/rocketdict.sqlite"
          echo "$BASE_DB_SHA256  $ROCKETDICT_RUN23_PRIME_ANGLE_LIST_SPLIT_DOE_ROOT/rocketdict.sqlite" | sha256sum -c -
      - name: Restore pinned OPUS archive cache
        uses: actions/cache@v4
        with:
          path: work/opus-2020-02-11.zip
          key: rocketdict-opus-en-ru-2020-02-11-798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677
      - name: Obtain and verify pinned OPUS archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          if [ ! -s work/opus-2020-02-11.zip ]; then
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 "$OPUS_URL" -o work/opus-2020-02-11.zip.tmp
            echo "$OPUS_SHA256  work/opus-2020-02-11.zip.tmp" | sha256sum -c -
            mv work/opus-2020-02-11.zip.tmp work/opus-2020-02-11.zip
          fi
          echo "$OPUS_SHA256  work/opus-2020-02-11.zip" | sha256sum -c -
      - name: Build verified offline OPUS asset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROCKETDICT_OPUS_ASSET_DIR"
          rocketdict-assets build-opus-en-ru work/opus-2020-02-11.zip "$ROCKETDICT_OPUS_ASSET_DIR" | tee work/opus-asset-build.json
      - name: Restore pinned TC-big snapshot cache
        uses: actions/cache@v4
        with:
          path: work/tc-big-snapshot
          key: rocketdict-tc-big-en-zle-708be1d372fe4c358a352f404e6dc9ca0126ba48-e68caa9a
      - name: Obtain exact pinned TC-big snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id=os.environ['TC_BIG_REPO'],
              revision=os.environ['TC_BIG_REVISION'],
              local_dir=os.environ['TC_BIG_SNAPSHOT'],
              allow_patterns=['README.md','config.json','generation_config.json','model.safetensors','source.spm','special_tokens_map.json','target.spm','tokenizer_config.json','vocab.json'],
          )
          PY
          echo "$TC_BIG_WEIGHTS_SHA256  $TC_BIG_SNAPSHOT/model.safetensors" | sha256sum -c -
      - name: Build byte-verified offline TC-big asset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROCKETDICT_TC_BIG_ASSET_DIR"
          rocketdict-assets build-tc-big-en-ru "$TC_BIG_SNAPSHOT" "$ROCKETDICT_TC_BIG_ASSET_DIR" | tee work/tc-big-asset-build.json
      - name: Run exact read-only prime angle-list split DOE
        run: python -u rocketdict-workbench/tests/real_translation_run23_prime_angle_list_split_doe.py
      - name: Verify immutable DOE contract
        shell: bash
        run: |
          set -euo pipefail
          echo "$BASE_DB_SHA256  $ROCKETDICT_RUN23_PRIME_ANGLE_LIST_SPLIT_DOE_ROOT/rocketdict.sqlite" | sha256sum -c -
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['ROCKETDICT_RUN23_PRIME_ANGLE_LIST_SPLIT_DOE_ROOT'])
          e = json.loads((root/'run23-prime-angle-list-split-doe.json').read_text(encoding='utf-8'))
          if e['schema'] != 'rocketdict-run23-prime-angle-list-split-doe/1': raise SystemExit('schema drift')
          if e['family_count'] != 1 or e['family_sequence'] != 2346: raise SystemExit('family census drift')
          if e['database_unchanged'] is not True or e['source_coverage_byte_exact'] is not True: raise SystemExit('read-only invariant drift')
          if e['target_separator_injected'] is not False or e['automatic_n_best_cherry_picking'] is not False: raise SystemExit('selection safety drift')
          if e['selected_hypothesis_ranks'] != [0]: raise SystemExit('rank0 contract drift')
          if e['promotion_allowed'] is not False or e['automatic_product_default_allowed'] is not False: raise SystemExit('DOE unexpectedly authorizes promotion')
          print('Run23 prime angle-list split DOE verified.')
          PY
      - name: Upload DOE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-run23-prime-angle-list-split-doe
          path: |
            work/opus-asset-build.json
            work/tc-big-asset-build.json
            work/run23-prime-angle-list-split-doe/*.json
          if-no-files-found: error
          retention-days: 90
