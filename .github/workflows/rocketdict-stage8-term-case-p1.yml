name: RocketDict Stage 8 Q-v1 whole-context structural probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rocketdict-stage8-term-case-p1.yml'
      - 'rocketdict-ci/stage8_whole_context_structural_q1.py'
      - 'rocketdict-ci/stage8_term_case_consistency_p1.py'
      - 'rocketdict-ci/stage8_term_case_consistency_p2.py'
      - 'rocketdict-ci/stage8_semantic_term_retention_o2.py'
      - 'rocketdict-ci/stage8_semantic_regression_proxy.py'
      - 'rocketdict-ci/stage8_ghi_reconstruction_v8.py'
      - 'rocketdict-ci/stage8_ghi_reconstruction_v7.py'
      - 'rocketdict-ci/stage8_ghi_reconstruction_v6.py'
      - 'rocketdict-ci/stage8_ghi_reconstruction_v5.py'
      - 'rocketdict-ci/stage8_g_nbest_probe.py'
      - 'rocketdict-ci/real_opus_gate.py'
      - 'rocketdict-ci/stage8-term-case-p1-trigger.txt'
  workflow_dispatch:

jobs:
  q1-whole-context-structural:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install real OPUS and metric runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'ctranslate2>=4.5,<5' 'sentencepiece>=0.2,<1' 'PyYAML>=6,<7' 'sacrebleu>=2.4,<3' 'nltk>=3.9,<4'
      - name: Run Q-v1 whole-context source-planned structural probe
        run: python rocketdict-ci/stage8_whole_context_structural_q1.py
      - name: Upload Q-v1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-stage8-whole-context-structural-q1
          path: work-stage8-q1/evidence/**
          if-no-files-found: warn
          retention-days: 14
