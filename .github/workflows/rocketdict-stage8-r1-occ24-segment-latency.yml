name: RocketDict Stage 8 R1 occurrence 24 segment latency

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rocketdict-stage8-r1-occ24-segment-latency.yml'
      - 'rocketdict-ci/stage8_r1_occ24_segment_latency.py'
  workflow_dispatch:

jobs:
  segment:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        mode: [before, divider, after, without-divider]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact OPUS runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'ctranslate2>=4.5,<5' 'sentencepiece>=0.2,<1' 'PyYAML>=6,<7' 'sacrebleu>=2.4,<3' 'nltk>=3.9,<4'
      - name: Translate isolated source segment
        env:
          OCC24_SEGMENT_MODE: ${{ matrix.mode }}
        run: python rocketdict-ci/stage8_r1_occ24_segment_latency.py
      - name: Upload segment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-stage8-r1-occ24-${{ matrix.mode }}
          path: work-stage8-r1-occ24-segment/${{ matrix.mode }}/**
          if-no-files-found: warn
          retention-days: 7
