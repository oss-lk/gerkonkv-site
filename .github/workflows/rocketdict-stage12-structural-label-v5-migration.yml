name: RocketDict Stage12 Structural Label V5 Migration

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - 'tools/stage12_structural_label_v5_migration.py'
      - '.github/workflows/rocketdict-stage12-structural-label-v5-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/product-core-forward
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply assertion-heavy Stage12 v5 migration
        run: python tools/stage12_structural_label_v5_migration.py
      - name: Install maintained Product Core, Workbench and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./rocketdict-product-core -e ./rocketdict-workbench pytest
      - name: Compile changed maintained modules
        run: |
          python -m py_compile \
            rocketdict-product-core/src/rocketdict/structural_labels.py \
            rocketdict-product-core/src/rocketdict/translation_stage.py \
            rocketdict-product-core/src/rocketdict/api/registry.py \
            rocketdict-product-core/tests/test_translation_stage_structural_labels.py
      - name: Run focused Stage12 structural-label regressions
        run: |
          python -m pytest -q \
            rocketdict-product-core/tests/test_structural_labels.py \
            rocketdict-product-core/tests/test_translation_stage_structural_labels.py \
            rocketdict-product-core/tests/test_translation_stage_planner.py \
            rocketdict-product-core/tests/test_translation_stage_emphasis_regression.py \
            rocketdict-product-core/tests/test_numeric_integrity.py \
            rocketdict-product-core/tests/test_numeric_public_contract.py
      - name: Run complete dependency-light Product Core suite
        run: python -m pytest -q rocketdict-product-core/tests
      - name: Validate and commit Stage12 v5
        env:
          BRANCH: chatgpt/product-core-forward
        run: |
          git diff --check
          git status --short
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            rocketdict-product-core/src/rocketdict/structural_labels.py \
            rocketdict-product-core/src/rocketdict/translation_stage.py \
            rocketdict-product-core/src/rocketdict/api/registry.py \
            rocketdict-product-core/tests/test_translation_stage_structural_labels.py
          git commit -m "Promote structural labels to Stage12 planner v5"
          git push origin "HEAD:${BRANCH}"
