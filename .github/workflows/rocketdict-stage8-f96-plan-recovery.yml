name: RocketDict Stage 8 F96 plan recovery

on:
  push:
    branches: [main]
    paths:
      - 'rocketdict-ci/stage8_f96_plan_recovery.py'
      - 'rocketdict-ci/stage8_f96_plan_recovery_v2.py'
      - 'rocketdict-ci/stage8_f96_plan_recovery_v3.py'
      - '.github/workflows/rocketdict-stage8-f96-plan-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact tokenizer runtime
        run: python -m pip install --disable-pip-version-check 'sentencepiece==0.2.2'
      - name: Run fail-closed F96 planning recovery DOE v3
        run: python rocketdict-ci/stage8_f96_plan_recovery_v3.py
      - name: Upload recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-stage8-f96-plan-recovery
          path: work-stage8-f96-plan-recovery/output
          if-no-files-found: error
