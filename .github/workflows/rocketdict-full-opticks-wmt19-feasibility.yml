name: RocketDict Full Opticks WMT19 Feasibility

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - 'rocketdict-workbench/tests/real_translation_full_opticks_wmt19_feasibility.py'
      - '.github/workflows/rocketdict-full-opticks-wmt19-feasibility.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  wmt19-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASELINE_RUN_ID: '34441822239'
      BASELINE_ARTIFACT_NAME: rocketdict-full-opticks-product-stage12-audit
      BASELINE_JSON_SHA256: 3d899605172decdadbab55eedf9fb161c5dd599a921679bea47fd98adbf2efb4
      OPTIN_JSON_SHA256: e5b46bbf8e6db4b1e755f2c4bb6b9d382b83074c5dcf2a6528fd600cfee9fa87
      BASELINE_DB_SHA256: eff56dab177baa161b6e8126a9ff75ecdc341c19deff5866fec201c6bf232687
      WMT19_MODEL_REPO: facebook/wmt19-en-ru
      WMT19_MODEL_REVISION: 834cdada94e68977b9d6c1224ca43a37390936ef
      WMT19_MODEL_SAFETENSORS_SHA256: ee0ce2988699b06bb7cd8a0152807f93638b66d653c76fb09e1f28aa4791398d
      ROCKETDICT_WMT19_MODEL_DIR: ${{ github.workspace }}/work/wmt19-model
      ROCKETDICT_NUMERIC_STRESS_ROOT: ${{ github.workspace }}/work/baseline/full-opticks-numeric-stress
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install maintained evaluator and pinned WMT19 runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./rocketdict-product-core -e ./rocketdict-workbench
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'
          python -m pip install \
            'transformers==4.56.2' \
            'huggingface_hub==0.34.4' \
            'safetensors==0.6.2' \
            'sentencepiece==0.2.1' \
            'sacremoses==0.1.1'
      - name: Download immutable full Opticks baseline artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BASELINE_ARTIFACT_NAME }}
          path: work/baseline
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BASELINE_RUN_ID }}
      - name: Verify replay baseline bytes and contracts
        shell: bash
        run: |
          set -euo pipefail
          root="$ROCKETDICT_NUMERIC_STRESS_ROOT"
          echo "$BASELINE_JSON_SHA256  $root/full-opticks-numeric-stress.json" | sha256sum -c -
          echo "$OPTIN_JSON_SHA256  $root/full-opticks-selective-rescue-optin.json" | sha256sum -c -
          echo "$BASELINE_DB_SHA256  $root/project/data/rocketdict.sqlite" | sha256sum -c -
      - name: Restore pinned WMT19 model cache
        uses: actions/cache@v4
        with:
          path: work/wmt19-model
          key: rocketdict-wmt19-en-ru-834cdad-ee0ce298
      - name: Obtain exact WMT19 snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id=os.environ['WMT19_MODEL_REPO'],
              revision=os.environ['WMT19_MODEL_REVISION'],
              local_dir=os.environ['ROCKETDICT_WMT19_MODEL_DIR'],
              allow_patterns=[
                  'README.md',
                  'config.json',
                  'generation_config.json',
                  'merges.txt',
                  'model.safetensors',
                  'tokenizer_config.json',
                  'vocab-src.json',
                  'vocab-tgt.json',
              ],
          )
          PY
          test -s "$ROCKETDICT_WMT19_MODEL_DIR/model.safetensors"
          echo "$WMT19_MODEL_SAFETENSORS_SHA256  $ROCKETDICT_WMT19_MODEL_DIR/model.safetensors" | sha256sum -c -
      - name: Run WMT19 differential on immutable focused failure spans
        run: python -u rocketdict-workbench/tests/real_translation_full_opticks_wmt19_feasibility.py
      - name: Re-verify immutable replay database
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$ROCKETDICT_NUMERIC_STRESS_ROOT/project/data/rocketdict.sqlite"
          echo "$BASELINE_DB_SHA256  $ROCKETDICT_NUMERIC_STRESS_ROOT/project/data/rocketdict.sqlite" | sha256sum -c -
      - name: Record runtime identities and resources
        if: always()
        run: |
          mkdir -p work/wmt19-runtime-evidence
          python -VV > work/wmt19-runtime-evidence/python.txt || true
          python -m pip freeze | sort > work/wmt19-runtime-evidence/pip-freeze.txt || true
          df -h > work/wmt19-runtime-evidence/disk.txt || true
          free -h > work/wmt19-runtime-evidence/memory.txt || true
          sha256sum "$ROCKETDICT_WMT19_MODEL_DIR"/* > work/wmt19-runtime-evidence/model-files.sha256 || true
      - name: Upload WMT19 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-full-opticks-wmt19-feasibility
          path: |
            work/baseline/full-opticks-numeric-stress/full-opticks-wmt19-feasibility.json
            work/wmt19-runtime-evidence/**
          if-no-files-found: warn
          retention-days: 90
