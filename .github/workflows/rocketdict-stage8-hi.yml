name: RocketDict Stage 8 H-I structural probes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rocketdict-stage8-hi.yml'
      - 'rocketdict-ci/stage8_hi_structural_probe.py'
      - 'rocketdict-ci/stage8_g_nbest_probe.py'
      - 'rocketdict-ci/stage8-hi-trigger.txt'
  workflow_dispatch:

jobs:
  stage8-hi-structural-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install real OPUS runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'ctranslate2>=4.5,<5' 'sentencepiece>=0.2,<1' 'PyYAML>=6,<7'
      - name: Run Stage 8 H/I structural mechanism probes
        run: python rocketdict-ci/stage8_hi_structural_probe.py
      - name: Upload Stage 8 H/I evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-stage8-hi-structural-probes
          path: work-stage8-hi/evidence/**
          if-no-files-found: warn
          retention-days: 14
