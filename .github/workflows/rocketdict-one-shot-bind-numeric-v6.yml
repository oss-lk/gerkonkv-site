name: RocketDict One-shot Bind Numeric V6

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - '.github/workflows/rocketdict-one-shot-bind-numeric-v6.yml'

permissions:
  contents: write

jobs:
  bind-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind public registry and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('rocketdict-product-core/src/rocketdict/api/registry.py')
          text = path.read_text(encoding='utf-8')
          old = 'NUMERIC_INTEGRITY_CONTRACT = "rocketdict-maintained-numeric-integrity/5"'
          new = 'NUMERIC_INTEGRITY_CONTRACT = "rocketdict-maintained-numeric-integrity/6"'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale registry contract, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/rocketdict-one-shot-bind-numeric-v6.yml
          git diff --check
          git diff --exit-code -- rocketdict-product-core/src/rocketdict/api/registry.py >/dev/null && {
            echo 'registry did not change' >&2
            exit 1
          }
      - name: Commit exact registry propagation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rocketdict-product-core/src/rocketdict/api/registry.py .github/workflows/rocketdict-one-shot-bind-numeric-v6.yml
          git commit -m 'Bind public registry to numeric integrity v6'
          git push origin HEAD:chatgpt/product-core-forward
