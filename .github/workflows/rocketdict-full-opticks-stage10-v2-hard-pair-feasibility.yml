name: RocketDict Full Opticks Stage10 v2 Hard-Pair Feasibility

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - 'rocketdict-workbench/tests/real_translation_full_opticks_stage10_v2_hard_pair_feasibility.py'
      - '.github/workflows/rocketdict-full-opticks-stage10-v2-hard-pair-feasibility.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  hard-pair-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUN16_RUN_ID: '34645769684'
      RUN16_ARTIFACT_NAME: rocketdict-full-opticks-tc-big-angular-dms-composed-product-rescue
      RUN16_DB_SHA256: 573a32c5dd3ba46f6bb16a91d7a3ca949c521dcf4f033b4ff040bf498cc2ad11
      OPUS_URL: https://object.pouta.csc.fi/OPUS-MT-models/en-ru/opus-2020-02-11.zip
      OPUS_SHA256: 798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677
      TC_BIG_REPO: Helsinki-NLP/opus-mt-tc-big-en-zle
      TC_BIG_REVISION: 708be1d372fe4c358a352f404e6dc9ca0126ba48
      TC_BIG_WEIGHTS_SHA256: e68caa9a233c177a3489257b69c18cece6da97767ab2581918ce3fc3c3899416
      TC_BIG_SNAPSHOT: ${{ github.workspace }}/work/tc-big-snapshot
      ROCKETDICT_OPUS_ASSET_DIR: ${{ github.workspace }}/work/opus-asset
      ROCKETDICT_TC_BIG_ASSET_DIR: ${{ github.workspace }}/work/tc-big-asset
      ROCKETDICT_STAGE10_HARD_PAIR_ROOT: ${{ github.workspace }}/work/full-opticks-stage10-v2-hard-pair-feasibility
      HF_HUB_DISABLE_XET: '1'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install asset builders
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e './rocketdict-product-core[alt-mt]' \
            'ctranslate2==4.8.2' 'sentencepiece==0.2.1' \
            'transformers==4.56.2' 'sacremoses==0.1.1' \
            'huggingface_hub==0.34.4' 'safetensors==0.6.2'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'

      - name: Download immutable run-16 evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.RUN16_ARTIFACT_NAME }}
          path: work/run16
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.RUN16_RUN_ID }}

      - name: Stage exact run-16 database read-only basis
        shell: bash
        run: |
          set -euo pipefail
          source_db=work/run16/tc-big-angular-dms-composed-product-rescue/rocketdict.sqlite
          test -s "$source_db"
          echo "$RUN16_DB_SHA256  $source_db" | sha256sum -c -
          mkdir -p "$ROCKETDICT_STAGE10_HARD_PAIR_ROOT"
          cp "$source_db" "$ROCKETDICT_STAGE10_HARD_PAIR_ROOT/rocketdict.sqlite"
          echo "$RUN16_DB_SHA256  $ROCKETDICT_STAGE10_HARD_PAIR_ROOT/rocketdict.sqlite" | sha256sum -c -

      - name: Restore pinned OPUS archive cache
        uses: actions/cache@v4
        with:
          path: work/opus-2020-02-11.zip
          key: rocketdict-opus-en-ru-2020-02-11-798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677

      - name: Obtain exact pinned OPUS archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          if [ ! -s work/opus-2020-02-11.zip ]; then
            rm -f work/opus-2020-02-11.zip.tmp
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
              "$OPUS_URL" -o work/opus-2020-02-11.zip.tmp
            echo "$OPUS_SHA256  work/opus-2020-02-11.zip.tmp" | sha256sum -c -
            mv work/opus-2020-02-11.zip.tmp work/opus-2020-02-11.zip
          fi
          echo "$OPUS_SHA256  work/opus-2020-02-11.zip" | sha256sum -c -

      - name: Build byte-verified offline OPUS asset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROCKETDICT_OPUS_ASSET_DIR"
          rocketdict-assets build-opus-en-ru work/opus-2020-02-11.zip "$ROCKETDICT_OPUS_ASSET_DIR" \
            | tee work/stage10-hard-pair-opus-asset-build.json

      - name: Restore pinned TC-big snapshot cache
        uses: actions/cache@v4
        with:
          path: work/tc-big-snapshot
          key: rocketdict-tc-big-en-zle-708be1d372fe4c358a352f404e6dc9ca0126ba48-e68caa9a

      - name: Obtain exact pinned TC-big snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id=os.environ['TC_BIG_REPO'],
              revision=os.environ['TC_BIG_REVISION'],
              local_dir=os.environ['TC_BIG_SNAPSHOT'],
              allow_patterns=[
                  'README.md','config.json','generation_config.json','model.safetensors',
                  'source.spm','special_tokens_map.json','target.spm','tokenizer_config.json','vocab.json'
              ],
          )
          PY
          echo "$TC_BIG_WEIGHTS_SHA256  $TC_BIG_SNAPSHOT/model.safetensors" | sha256sum -c -

      - name: Build byte-verified offline TC-big asset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROCKETDICT_TC_BIG_ASSET_DIR"
          rocketdict-assets build-tc-big-en-ru "$TC_BIG_SNAPSHOT" "$ROCKETDICT_TC_BIG_ASSET_DIR" \
            | tee work/stage10-hard-pair-tc-big-asset-build.json

      - name: Build torch-free feasibility runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m venv work/stage10-hard-pair-runtime
          work/stage10-hard-pair-runtime/bin/python -m pip install --upgrade pip
          work/stage10-hard-pair-runtime/bin/python -m pip install \
            -e './rocketdict-product-core[alt-mt]' -e ./rocketdict-workbench
          work/stage10-hard-pair-runtime/bin/python - <<'PY'
          import importlib.util
          if importlib.util.find_spec('torch') is not None:
              raise SystemExit('Torch unexpectedly installed in feasibility inference runtime')
          PY

      - name: Generate and audit exact hard-pair n-best candidates
        shell: bash
        run: |
          set -euo pipefail
          work/stage10-hard-pair-runtime/bin/python -u \
            rocketdict-workbench/tests/real_translation_full_opticks_stage10_v2_hard_pair_feasibility.py \
            | tee "$ROCKETDICT_STAGE10_HARD_PAIR_ROOT/summary.json"
          echo "$RUN16_DB_SHA256  $ROCKETDICT_STAGE10_HARD_PAIR_ROOT/rocketdict.sqlite" | sha256sum -c -

      - name: Verify fail-closed feasibility evidence
        shell: bash
        run: |
          set -euo pipefail
          work/stage10-hard-pair-runtime/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['ROCKETDICT_STAGE10_HARD_PAIR_ROOT'])
          evidence = json.loads((root/'full-opticks-stage10-v2-hard-pair-feasibility.json').read_text(encoding='utf-8'))
          if evidence['schema'] != 'rocketdict-full-opticks-stage10-v2-hard-pair-feasibility/1':
              raise SystemExit('schema drift')
          if evidence['base_hard_gate_counts'] != {'numeric_symbol':20,'punctuation':18,'length':0,'unique':37}:
              raise SystemExit(f"base hard-gate drift: {evidence['base_hard_gate_counts']!r}")
          expected = [54796,112001,522572]
          observed = [row['boundary_offset'] for row in evidence['cohort']]
          if evidence['cohort_count'] != 3 or observed != expected:
              raise SystemExit(f'cohort drift: {observed!r}')
          for row in evidence['cohort']:
              if len(row['candidates']) != 16:
                  raise SystemExit(f"n-best cardinality drift at {row['boundary_offset']}: {len(row['candidates'])}")
              if row['stage10_v2_decision']['merge'] is not True:
                  raise SystemExit('unproven Stage10 boundary entered cohort')
          if evidence['database_mutated'] is not False:
              raise SystemExit('read-only feasibility mutated its database')
          if any(evidence.get(flag) is not False for flag in (
              'source_bytes_rewritten','target_rewriting','placeholders',
              'post_translation_literal_injection','corpus_specific_target_patches','evaluator_weakened'
          )):
              raise SystemExit('unsafe evidence flag')
          print(json.dumps({
              'cohort': [
                  {
                      'offset': row['boundary_offset'],
                      'mechanically_admissible': row['mechanically_admissible_candidates'],
                      'mechanically_and_diagnostic': row['mechanically_and_diagnostic_candidates'],
                  }
                  for row in evidence['cohort']
              ],
              'evidence_sha256': evidence['evidence_sha256'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Record runtime evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$ROCKETDICT_STAGE10_HARD_PAIR_ROOT/runtime-evidence"
          work/stage10-hard-pair-runtime/bin/python -VV > "$ROCKETDICT_STAGE10_HARD_PAIR_ROOT/runtime-evidence/python.txt" 2>&1
          work/stage10-hard-pair-runtime/bin/python -m pip freeze | sort > "$ROCKETDICT_STAGE10_HARD_PAIR_ROOT/runtime-evidence/pip-freeze.txt" 2>&1
          sha256sum work/opus-2020-02-11.zip > "$ROCKETDICT_STAGE10_HARD_PAIR_ROOT/runtime-evidence/opus.sha256" 2>&1
          sha256sum "$TC_BIG_SNAPSHOT/model.safetensors" > "$ROCKETDICT_STAGE10_HARD_PAIR_ROOT/runtime-evidence/tc-big-weights.sha256" 2>&1

      - name: Upload hard-pair feasibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-full-opticks-stage10-v2-hard-pair-feasibility
          path: |
            work/full-opticks-stage10-v2-hard-pair-feasibility/full-opticks-stage10-v2-hard-pair-feasibility.json
            work/full-opticks-stage10-v2-hard-pair-feasibility/summary.json
            work/full-opticks-stage10-v2-hard-pair-feasibility/runtime-evidence
            work/stage10-hard-pair-opus-asset-build.json
            work/stage10-hard-pair-tc-big-asset-build.json
          if-no-files-found: warn
          retention-days: 90
