name: RocketDict Full Opticks Table Cells

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - 'rocketdict-product-core/src/rocketdict/api/**'
      - 'rocketdict-product-core/src/rocketdict/lexical.py'
      - 'rocketdict-product-core/src/rocketdict/lexical_target_evidence.py'
      - 'rocketdict-product-core/src/rocketdict/numeric_integrity.py'
      - 'rocketdict-product-core/src/rocketdict/numeric_words.py'
      - 'rocketdict-product-core/src/rocketdict/research_diagnostics.py'
      - 'rocketdict-product-core/src/rocketdict/runtime.py'
      - 'rocketdict-product-core/src/rocketdict/table_structure.py'
      - 'rocketdict-product-core/src/rocketdict/table_logical_structure.py'
      - 'rocketdict-product-core/src/rocketdict/table_stage12.py'
      - 'rocketdict-product-core/src/rocketdict/translation_stage.py'
      - 'rocketdict-product-core/tests/test_table_structure.py'
      - 'rocketdict-product-core/tests/test_table_logical_structure.py'
      - 'rocketdict-product-core/tests/test_table_stage12.py'
      - 'rocketdict-product-core/tests/test_stage18_table_target_evidence.py'
      - 'rocketdict-workbench/tests/real_translation_table_cells_feasibility.py'
      - 'rocketdict-workbench/tests/real_translation_table_logical_cells_feasibility.py'
      - 'rocketdict-workbench/tests/real_table_product_integration_smoke.py'
      - '.github/workflows/rocketdict-full-opticks-table-cells.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-opticks-table-cells:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPUS_URL: https://object.pouta.csc.fi/OPUS-MT-models/en-ru/opus-2020-02-11.zip
      OPUS_SHA256: 798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677
      OPTICKS_URL: https://www.gutenberg.org/cache/epub/33504/pg33504.txt
      OPTICKS_SHA256: 1e25ec2c54fc6e9fa05d7f0a663e05cf2ee671231c65731f4845df2539dfb217
      ROCKETDICT_OPUS_ASSET_DIR: ${{ github.workspace }}/work/opus-asset
      ROCKETDICT_OPTICKS_SOURCE: ${{ github.workspace }}/work/opticks.txt
      ROCKETDICT_TABLE_CELLS_ROOT: ${{ github.workspace }}/work/full-opticks-table-cells
      ROCKETDICT_TABLE_LOGICAL_ROOT: ${{ github.workspace }}/work/full-opticks-table-logical-cells
      ROCKETDICT_REAL_TABLE_SMOKE_ROOT: ${{ github.workspace }}/work/real-table-product-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install maintained Product table research runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './rocketdict-product-core[production]'
          python -m pip install -e ./rocketdict-workbench
          python -m pip install 'https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl'
      - name: Restore pinned OPUS archive cache
        uses: actions/cache@v4
        with:
          path: work/opus-2020-02-11.zip
          key: rocketdict-opus-en-ru-2020-02-11-798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677
      - name: Obtain and verify pinned OPUS and Opticks sources
        run: |
          mkdir -p work
          if [ ! -s work/opus-2020-02-11.zip ]; then
            rm -f work/opus-2020-02-11.zip.tmp
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 "$OPUS_URL" -o work/opus-2020-02-11.zip.tmp
            echo "$OPUS_SHA256  work/opus-2020-02-11.zip.tmp" | sha256sum -c -
            mv work/opus-2020-02-11.zip.tmp work/opus-2020-02-11.zip
          fi
          echo "$OPUS_SHA256  work/opus-2020-02-11.zip" | sha256sum -c -
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 "$OPTICKS_URL" -o "$ROCKETDICT_OPTICKS_SOURCE"
          echo "$OPTICKS_SHA256  $ROCKETDICT_OPTICKS_SOURCE" | sha256sum -c -
      - name: Build verified offline CTranslate2 float32 asset
        run: |
          rocketdict-assets build-opus-en-ru work/opus-2020-02-11.zip "$ROCKETDICT_OPUS_ASSET_DIR" | tee work/opus-asset-build.json
          test -s "$ROCKETDICT_OPUS_ASSET_DIR/rocketdict-opus-asset.json"
          test -s "$ROCKETDICT_OPUS_ASSET_DIR/ct2/model.bin"
      - name: Run physical full Opticks table-cells baseline
        run: python -u rocketdict-workbench/tests/real_translation_table_cells_feasibility.py
      - name: Run logical full Opticks table-cell feasibility
        run: python -u rocketdict-workbench/tests/real_translation_table_logical_cells_feasibility.py
      - name: Run real Product Stage8 through Stage19 table integration smoke
        run: python -u rocketdict-workbench/tests/real_table_product_integration_smoke.py
      - name: Record runtime identities and resources
        if: always()
        run: |
          mkdir -p work/full-opticks-table-cells/runtime-evidence
          python -VV > work/full-opticks-table-cells/runtime-evidence/python.txt || true
          python -m pip freeze | sort > work/full-opticks-table-cells/runtime-evidence/pip-freeze.txt || true
          df -h > work/full-opticks-table-cells/runtime-evidence/disk.txt || true
          free -h > work/full-opticks-table-cells/runtime-evidence/memory.txt || true
          sha256sum work/opus-2020-02-11.zip > work/full-opticks-table-cells/runtime-evidence/opus.sha256 || true
          sha256sum "$ROCKETDICT_OPTICKS_SOURCE" > work/full-opticks-table-cells/runtime-evidence/opticks.sha256 || true
      - name: Upload full Opticks table evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-full-opticks-table-cells
          path: |
            work/opus-asset-build.json
            work/full-opticks-table-cells/full-opticks-table-cells-feasibility.json
            work/full-opticks-table-logical-cells/full-opticks-table-logical-cells-feasibility.json
            work/real-table-product-smoke/real-table-product-integration-smoke.json
            work/full-opticks-table-cells/runtime-evidence/**
          if-no-files-found: warn
          retention-days: 90
