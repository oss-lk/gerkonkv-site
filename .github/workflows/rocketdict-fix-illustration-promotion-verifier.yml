name: RocketDict fix illustration promotion verifier

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - '.github/workflows/rocketdict-fix-illustration-promotion-verifier.yml'

permissions:
  contents: write

jobs:
  patch-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/product-core-forward
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Patch stale carrier expectations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/rocketdict-full-opticks-illustration-structural-promotion.yml')
          text=path.read_text(encoding='utf-8')
          old="if evidence['promoted_segment_count'] != 3341:"
          new="if evidence['promoted_segment_count'] != 3335:"
          if old not in text:
              raise SystemExit('stale segment-count expectation not found')
          text=text.replace(old,new,1)
          old_block="""          for case in evidence['structural_cases']:\n              if [piece['role'] for piece in case['pieces']] != ['label','separator','suffix','trailing']:\n                  raise SystemExit('promotion structural role order drift')\n              if case['pieces'][1]['target_text'] != case['pieces'][1]['source_text'] or case['pieces'][3]['target_text'] != case['pieces'][3]['source_text']:\n                  raise SystemExit('promotion structural passthrough drift')\n              for piece in (case['pieces'][0],case['pieces'][2]):\n                  if piece['model_input'] != piece['source_text'] or piece['selected_rank'] != 0:\n                      raise SystemExit('promotion exact model-input/rank0 drift')\n"""
          new_block="""          for case in evidence['structural_cases']:\n              pieces=case['pieces']\n              if [piece['role'] for piece in pieces] != ['label','separator','suffix','trailing']:\n                  raise SystemExit('promotion structural role order drift')\n              if pieces[1]['rendered_text'] != pieces[1]['source_text'] or pieces[3]['rendered_text'] != pieces[3]['source_text']:\n                  raise SystemExit('promotion structural passthrough drift')\n              if pieces[0]['model'] != 'opus' or pieces[2]['model'] != 'tc_big':\n                  raise SystemExit('promotion structural model-route drift')\n              for piece in (pieces[0],pieces[2]):\n                  if piece['model_input'] != piece['source_text'] or piece['selected_rank'] != 0 or piece['raw_model_selected'] is not True:\n                      raise SystemExit('promotion exact model-input/rank0 drift')\n              rendered=pieces[0]['selected_target']+pieces[1]['rendered_text']+pieces[2]['selected_target']+pieces[3]['rendered_text']\n              if rendered != case['target_text']:\n                  raise SystemExit('promotion semantic-carrier rendering drift')\n"""
          if old_block not in text:
              raise SystemExit('stale structural verifier block not found')
          text=text.replace(old_block,new_block,1)
          old_guard="""          if 72401 in census['residual_sequences'] or 90105 in census['residual_sequences']:\n              raise SystemExit('invalid sequence/start comparison guard')\n"""
          new_guard="""          residual_starts=[int(record['source_start']) for record in census['records']]\n          if 72401 in residual_starts or 90105 in residual_starts:\n              raise SystemExit('promoted illustration source start remains in residual census')\n"""
          if old_guard not in text:
              raise SystemExit('stale sequence/start guard not found')
          text=text.replace(old_guard,new_guard,1)
          path.write_text(text,encoding='utf-8')
          PY
          git diff --check
      - name: Commit verifier correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/rocketdict-full-opticks-illustration-structural-promotion.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'No verifier diff to commit'; exit 1; }
          git commit -m 'Fix illustration carrier promotion verifier'
          git push origin HEAD:chatgpt/product-core-forward
