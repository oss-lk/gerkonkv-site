name: RocketDict Stage 8 selection artifact recovery

on:
  push:
    branches: [main]
    paths:
      - 'rocketdict-ci/recover_stage8_selection_artifacts.py'
      - '.github/workflows/rocketdict-stage8-selection-artifact-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover-selection-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Scan historical artifact contents for challenge selection and clipping evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python rocketdict-ci/recover_stage8_selection_artifacts.py
      - name: Upload selection recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-stage8-selection-artifact-recovery
          path: rocketdict-stage8-selection-artifact-recovery
          if-no-files-found: error
