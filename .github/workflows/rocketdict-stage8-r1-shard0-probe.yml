name: RocketDict Stage 8 R1 shard0 latency probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rocketdict-stage8-r1-shard0-probe.yml'
  workflow_dispatch:

jobs:
  probe-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix:
        position: [0, 8, 16, 24, 32, 40, 48, 56, 64, 72, 80, 88, 96]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install real OPUS runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'ctranslate2>=4.5,<5' 'sentencepiece>=0.2,<1' 'PyYAML>=6,<7' 'sacrebleu>=2.4,<3' 'nltk>=3.9,<4'
      - name: Run exact single R1 unit through frozen v8
        env:
          R1_SHARD_INDEX: ${{ matrix.position }}
          R1_SHARD_COUNT: '104'
        run: python rocketdict-ci/stage8_independent_validation_r1_shard.py
      - name: Upload latency probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-stage8-r1-shard0-probe-${{ matrix.position }}
          path: |
            work-stage8-independent-validation-r1-shards/shard-${{ matrix.position }}/forward-shard.json
            work-stage8-independent-validation-r1-shards/shard-${{ matrix.position }}/units-shard.jsonl
          if-no-files-found: warn
          retention-days: 7
