name: RocketDict M2M100 Windows Reproducibility DOE

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - '.github/workflows/rocketdict-m2m100-windows-repro-doe.yml'
      - 'rocketdict-workbench/tests/real_translation_m2m100_ct2_determinism_doe.py'
      - 'rocketdict-workbench/tests/real_translation_m2m100_ct2_mkl_cnr_doe.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PARITY_RUN_ID: '34748655508'
      PARITY_ARTIFACT_NAME: rocketdict-m2m100-ct2-arithmetic-parity
      PARITY_EVIDENCE_SHA256: bc739df0594e5f73331c2a2d5301bdb6d6eb27d9ab3921703dc99a16237dac57
      M2M100_REPO: facebook/m2m100_418M
      M2M100_REVISION: 55c2e61bbf05dfb8d7abccdc3fae6fc8512fd636
      M2M100_WEIGHTS_SHA256: d907ea45e4e4b9db163382a6674f6218b3c59566fe06d77f4055c208b4e87ed1
      M2M100_SNAPSHOT: ${{ github.workspace }}\work\m2m100-418m
      ROCKETDICT_M2M100_ASSET_DIR: ${{ github.workspace }}\work\m2m100-asset
      HF_HUB_DISABLE_XET: '1'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact converter stack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          python -m pip install -e './rocketdict-product-core[alt-mt-build]' -e ./rocketdict-workbench 'huggingface_hub==0.34.4' 'ctranslate2==4.8.2'
          python -c "import ctranslate2,transformers,torch; print({'ct2':ctranslate2.__version__,'transformers':transformers.__version__,'torch':torch.__version__}); assert ctranslate2.__version__=='4.8.2'; assert transformers.__version__=='4.56.2'; assert torch.__version__.startswith('2.8.')"

      - name: Download authenticated CT2 parity evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PARITY_ARTIFACT_NAME }}
          path: work/parity
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PARITY_RUN_ID }}

      - name: Authenticate parity evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parity = (Get-ChildItem -Path work/parity -Recurse -Filter m2m100-ct2-arithmetic-restatement-parity.json | Select-Object -First 1).FullName
          if (-not $parity) { throw 'parity evidence missing' }
          $env:PARITY = $parity
          @'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ['PARITY']); e=json.loads(p.read_text(encoding='utf-8'))
          c=dict(e); recorded=c.pop('evidence_sha256')
          actual=hashlib.sha256(json.dumps(c,ensure_ascii=False,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          if recorded!=os.environ['PARITY_EVIDENCE_SHA256'] or actual!=recorded: raise SystemExit('parity SHA drift')
          if e['source_start']!=483234 or e['exact_target_parity'] is not True: raise SystemExit('parity identity drift')
          '@ | python -
          "PARITY_EVIDENCE=$parity" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore Windows pinned M2M100 snapshot cache
        uses: actions/cache@v4
        with:
          path: work/m2m100-418m
          key: rocketdict-windows-m2m100-418m-55c2e61bbf05dfb8d7abccdc3fae6fc8512fd636

      - name: Obtain exact source snapshot and build Windows CT2 asset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib,os
          from pathlib import Path
          from huggingface_hub import snapshot_download
          root=Path(os.environ['M2M100_SNAPSHOT'])
          snapshot_download(repo_id=os.environ['M2M100_REPO'],revision=os.environ['M2M100_REVISION'],local_dir=root,allow_patterns=['config.json','pytorch_model.bin','sentencepiece.bpe.model','special_tokens_map.json','tokenizer_config.json','vocab.json'])
          h=hashlib.sha256((root/'pytorch_model.bin').read_bytes()).hexdigest()
          if h!=os.environ['M2M100_WEIGHTS_SHA256']: raise SystemExit(f'weights SHA drift: {h}')
          '@ | python -
          if (Test-Path $env:ROCKETDICT_M2M100_ASSET_DIR) { Remove-Item -Recurse -Force $env:ROCKETDICT_M2M100_ASSET_DIR }
          rocketdict-assets build-m2m100-en-ru $env:M2M100_SNAPSHOT $env:ROCKETDICT_M2M100_ASSET_DIR | Out-File -FilePath work/m2m100-windows-asset-build.json -Encoding utf8
          Get-Content work/m2m100-windows-asset-build.json

      - name: Build exact torch-free Windows CT2 4.8.2 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m venv work/runtime-venv
          work/runtime-venv/Scripts/python.exe -m pip install --upgrade pip
          work/runtime-venv/Scripts/python.exe -m pip install -e './rocketdict-product-core[alt-mt]' -e ./rocketdict-workbench 'ctranslate2==4.8.2'
          work/runtime-venv/Scripts/python.exe -c "import importlib.util,ctranslate2; assert importlib.util.find_spec('torch') is None; assert ctranslate2.__version__=='4.8.2'"

      - name: Run current and portable Windows raw-rank0 matrix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path .).Path + '\work\windows-determinism'
          $env:ROCKETDICT_M2M100_DETERMINISM_ROOT = $root
          work/runtime-venv/Scripts/python.exe -u rocketdict-workbench/tests/real_translation_m2m100_ct2_determinism_doe.py --parity-evidence $env:PARITY_EVIDENCE --root $root | Tee-Object -FilePath work/windows-determinism.log

      - name: Run forced MKL COMPATIBLE Windows matrix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path .).Path + '\work\windows-mkl-cnr'
          $env:ROCKETDICT_M2M100_MKL_CNR_ROOT = $root
          work/runtime-venv/Scripts/python.exe -u rocketdict-workbench/tests/real_translation_m2m100_ct2_mkl_cnr_doe.py --parity-evidence $env:PARITY_EVIDENCE --root $root | Tee-Object -FilePath work/windows-mkl-cnr.log

      - name: Assemble Windows reproducibility evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib,json,os,platform
          from pathlib import Path
          det=json.loads((Path('work/windows-determinism')/'m2m100-ct2-determinism-doe.json').read_text(encoding='utf-8'))
          cnr=json.loads((Path('work/windows-mkl-cnr')/'m2m100-ct2-mkl-cnr-doe.json').read_text(encoding='utf-8'))
          build=json.loads(Path('work/m2m100-windows-asset-build.json').read_text(encoding='utf-8-sig'))
          result={
            'schema':'rocketdict-m2m100-windows-reproducibility/1',
            'promotion_allowed':False,
            'automatic_product_default_allowed':False,
            'platform':platform.platform(),
            'machine':platform.machine(),
            'asset':build,
            'determinism_evidence_sha256':det['evidence_sha256'],
            'cnr_evidence_sha256':cnr['evidence_sha256'],
            'configs':det['configs'],
            'cnr_configs':cnr['configs'],
          }
          raw=json.dumps(result,ensure_ascii=False,sort_keys=True,separators=(',',':'),allow_nan=False).encode(); result['evidence_sha256']=hashlib.sha256(raw).hexdigest()
          out=Path('work/windows-evidence'); out.mkdir(parents=True,exist_ok=True)
          (out/'evidence.json').write_text(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps({'asset_tree':build['payload_tree_sha256'],'current':{k:{'targets':v['unique_target_sha256'],'exact_parity':v['all_exact_parity_target'],'selector':v['all_selector_accepted']} for k,v in det['configs'].items()},'cnr':{k:{'targets':v['unique_target_sha256'],'exact_parity':v['all_exact_parity_target'],'selector':v['all_selector_accepted']} for k,v in cnr['configs'].items()},'evidence_sha256':result['evidence_sha256']},ensure_ascii=False,sort_keys=True))
          '@ | work/runtime-venv/Scripts/python.exe -

      - name: Upload Windows reproducibility replica
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-m2m100-windows-repro-${{ matrix.replica }}
          path: |
            work/m2m100-windows-asset-build.json
            work/windows-determinism.log
            work/windows-mkl-cnr.log
            work/windows-evidence/evidence.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rocketdict-m2m100-windows-repro-*
          path: work/replicas

      - name: Aggregate Windows asset and raw-rank0 identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          paths=sorted(Path('work/replicas').rglob('evidence.json'))
          if len(paths)!=2: raise SystemExit(f'Windows replica cardinality drift: {paths}')
          ev=[json.loads(p.read_text(encoding='utf-8')) for p in paths]
          names=sorted(ev[0]['configs'])
          cnames=sorted(ev[0]['cnr_configs'])
          def agg(section,names):
              out={}
              for name in names:
                  rows=[e[section][name] for e in ev]
                  targets=sorted({x for r in rows for x in r['unique_target_sha256']})
                  tokens=sorted({x for r in rows for x in r['unique_tokens_sha256']})
                  out[name]={'unique_target_sha256':targets,'unique_tokens_sha256':tokens,'cross_runner_deterministic':len(targets)==1 and len(tokens)==1,'all_exact_parity_target':all(r['all_exact_parity_target'] for r in rows),'all_selector_accepted':all(r['all_selector_accepted'] for r in rows)}
              return out
          result={
            'schema':'rocketdict-m2m100-windows-reproducibility-cross-runner/1',
            'promotion_allowed':False,
            'automatic_product_default_allowed':False,
            'replica_count':2,
            'asset_payload_tree_sha256':sorted({e['asset']['payload_tree_sha256'] for e in ev}),
            'current_configs':agg('configs',names),
            'cnr_configs':agg('cnr_configs',cnames),
            'platforms':[e['platform'] for e in ev],
            'replica_evidence_sha256':[e['evidence_sha256'] for e in ev],
          }
          raw=json.dumps(result,ensure_ascii=False,sort_keys=True,separators=(',',':'),allow_nan=False).encode(); result['evidence_sha256']=hashlib.sha256(raw).hexdigest()
          out=Path('work/cross-runner'); out.mkdir(parents=True,exist_ok=True); (out/'evidence.json').write_text(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True))
          PY

      - name: Upload Windows cross-runner evidence
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-m2m100-windows-repro-cross-runner
          path: work/cross-runner/evidence.json
          if-no-files-found: error
          retention-days: 90
