name: RocketDict Full Opticks Illustration Structural Promotion

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - 'rocketdict-workbench/tests/real_translation_full_opticks_illustration_structural_promotion.py'
      - '.github/workflows/rocketdict-full-opticks-illustration-structural-promotion.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  illustration-structural-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE_WORKFLOW_RUN_ID: '34695164876'
      BASE_ARTIFACT_NAME: rocketdict-full-opticks-rank0-clean-replay
      BASE_DB_SHA256: e48df8a90a3aa5e07bbc7e86c150d7b65ce450e7b6a0ec0d2e34a0caf9846e2e
      BASE_REPLAY_EVIDENCE_SHA256: e7504ef18ead81e9c437ab8236b787a7d59082c272ef102fcc9bae6e281deac1
      OPUS_URL: https://object.pouta.csc.fi/OPUS-MT-models/en-ru/opus-2020-02-11.zip
      OPUS_SHA256: 798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677
      TC_BIG_REPO: Helsinki-NLP/opus-mt-tc-big-en-zle
      TC_BIG_REVISION: 708be1d372fe4c358a352f404e6dc9ca0126ba48
      TC_BIG_WEIGHTS_SHA256: e68caa9a233c177a3489257b69c18cece6da97767ab2581918ce3fc3c3899416
      TC_BIG_SNAPSHOT: ${{ github.workspace }}/work/tc-big-snapshot
      ROCKETDICT_OPUS_ASSET_DIR: ${{ github.workspace }}/work/opus-asset
      ROCKETDICT_TC_BIG_ASSET_DIR: ${{ github.workspace }}/work/tc-big-asset
      ROCKETDICT_ILLUSTRATION_PROMOTION_ROOT: ${{ github.workspace }}/work/illustration-structural-promotion
      ROCKETDICT_RESIDUAL_CENSUS_ROOT: ${{ github.workspace }}/work/illustration-structural-promotion-census
      HF_HUB_DISABLE_XET: '1'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install asset builders
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e './rocketdict-product-core[production,alt-mt]' -e ./rocketdict-workbench \
            'ctranslate2==4.8.2' 'sentencepiece==0.2.1' 'transformers==4.56.2' \
            'sacremoses==0.1.1' 'huggingface_hub==0.34.4' 'safetensors==0.6.2'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'

      - name: Download exact run41 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BASE_ARTIFACT_NAME }}
          path: work/base
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BASE_WORKFLOW_RUN_ID }}

      - name: Authenticate and stage exact run41 database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROCKETDICT_ILLUSTRATION_PROMOTION_ROOT"
          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          base=Path('work/base')
          evidence_paths=list(base.rglob('full-opticks-rank0-clean-replay.json'))
          dbs=[p for p in base.rglob('rocketdict.sqlite') if p.parent.name == 'full-opticks-rank0-clean-replay']
          if len(evidence_paths)!=1 or len(dbs)!=1:
              raise SystemExit(f'run41 artifact cardinality drift: {evidence_paths=} {dbs=}')
          evidence=json.loads(evidence_paths[0].read_text(encoding='utf-8'))
          canonical=dict(evidence)
          recorded=canonical.pop('evidence_sha256')
          actual=hashlib.sha256(json.dumps(canonical,ensure_ascii=False,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          if recorded != os.environ['BASE_REPLAY_EVIDENCE_SHA256'] or actual != recorded:
              raise SystemExit('run41 replay evidence drift')
          dbsha=hashlib.sha256(dbs[0].read_bytes()).hexdigest()
          if dbsha != os.environ['BASE_DB_SHA256'] or evidence.get('final_database_sha256') != dbsha:
              raise SystemExit('run41 database drift')
          if evidence.get('final_translation_run_id') != 41:
              raise SystemExit('run41 translation id drift')
          out=Path(os.environ['ROCKETDICT_ILLUSTRATION_PROMOTION_ROOT'])/'rocketdict.sqlite'
          shutil.copyfile(dbs[0], out)
          print(json.dumps({'database_sha256':dbsha,'evidence_sha256':recorded,'translation_run_id':41},indent=2))
          PY
          echo "$BASE_DB_SHA256  $ROCKETDICT_ILLUSTRATION_PROMOTION_ROOT/rocketdict.sqlite" | sha256sum -c -

      - name: Restore pinned OPUS archive cache
        uses: actions/cache@v4
        with:
          path: work/opus-2020-02-11.zip
          key: rocketdict-opus-en-ru-2020-02-11-798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677

      - name: Obtain and verify pinned OPUS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          if [ ! -s work/opus-2020-02-11.zip ]; then
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 "$OPUS_URL" -o work/opus.tmp
            echo "$OPUS_SHA256  work/opus.tmp" | sha256sum -c -
            mv work/opus.tmp work/opus-2020-02-11.zip
          fi
          echo "$OPUS_SHA256  work/opus-2020-02-11.zip" | sha256sum -c -
          rm -rf "$ROCKETDICT_OPUS_ASSET_DIR"
          rocketdict-assets build-opus-en-ru work/opus-2020-02-11.zip "$ROCKETDICT_OPUS_ASSET_DIR" | tee work/illustration-promotion-opus.json

      - name: Restore pinned TC-big snapshot cache
        uses: actions/cache@v4
        with:
          path: work/tc-big-snapshot
          key: rocketdict-tc-big-en-zle-708be1d372fe4c358a352f404e6dc9ca0126ba48-e68caa9a

      - name: Obtain and build pinned TC-big
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id=os.environ['TC_BIG_REPO'],
              revision=os.environ['TC_BIG_REVISION'],
              local_dir=os.environ['TC_BIG_SNAPSHOT'],
              allow_patterns=['README.md','config.json','generation_config.json','model.safetensors','source.spm','special_tokens_map.json','target.spm','tokenizer_config.json','vocab.json'],
          )
          PY
          echo "$TC_BIG_WEIGHTS_SHA256  $TC_BIG_SNAPSHOT/model.safetensors" | sha256sum -c -
          rm -rf "$ROCKETDICT_TC_BIG_ASSET_DIR"
          rocketdict-assets build-tc-big-en-ru "$TC_BIG_SNAPSHOT" "$ROCKETDICT_TC_BIG_ASSET_DIR" | tee work/illustration-promotion-tc-big.json

      - name: Build torch-free promotion runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m venv work/promotion-venv
          work/promotion-venv/bin/python -m pip install --upgrade pip
          work/promotion-venv/bin/python -m pip install -e './rocketdict-product-core[production,alt-mt]' -e ./rocketdict-workbench
          work/promotion-venv/bin/python - <<'PY'
          import importlib.util
          if importlib.util.find_spec('torch') is not None:
              raise SystemExit('torch leaked into inference runtime')
          PY

      - name: Replay maintained Stage12 chain with promoted illustration wrapper
        shell: bash
        run: |
          set -euo pipefail
          export ROCKETDICT_ILLUSTRATION_PROMOTION_DB="$ROCKETDICT_ILLUSTRATION_PROMOTION_ROOT/rocketdict.sqlite"
          work/promotion-venv/bin/python -u rocketdict-workbench/tests/real_translation_full_opticks_illustration_structural_promotion.py | tee work/illustration-promotion-run.log
          python - <<'PY' >> "$GITHUB_ENV"
          import json, os
          from pathlib import Path
          p=Path(os.environ['ROCKETDICT_ILLUSTRATION_PROMOTION_ROOT'])/'full-opticks-illustration-structural-promotion.json'
          e=json.loads(p.read_text(encoding='utf-8'))
          print(f"PROMOTED_TRANSLATION_RUN_ID={e['promoted_translation_run_id']}")
          print(f"PROMOTED_DB_SHA256={e['promoted_database_sha256']}")
          print(f"PROMOTED_OUTPUT_SHA256={e['promoted_translation_output_sha256']}")
          print(f"PROMOTED_TEXT_SHA256={e['promoted_text_sha256']}")
          PY

      - name: Independently census promoted persisted output
        shell: bash
        run: |
          set -euo pipefail
          export ROCKETDICT_RESIDUAL_CENSUS_DB="$ROCKETDICT_ILLUSTRATION_PROMOTION_ROOT/rocketdict.sqlite"
          export ROCKETDICT_RESIDUAL_TRANSLATION_RUN_ID="$PROMOTED_TRANSLATION_RUN_ID"
          export ROCKETDICT_RESIDUAL_EXPECTED_DB_SHA256="$PROMOTED_DB_SHA256"
          work/promotion-venv/bin/python -u rocketdict-workbench/tests/audit_translation_residual_census.py | tee work/illustration-promotion-census.log
          echo "$PROMOTED_DB_SHA256  $ROCKETDICT_ILLUSTRATION_PROMOTION_ROOT/rocketdict.sqlite" | sha256sum -c -

      - name: Verify promotion and independent census evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['ROCKETDICT_ILLUSTRATION_PROMOTION_ROOT'])
          evidence=json.loads((root/'full-opticks-illustration-structural-promotion.json').read_text(encoding='utf-8'))
          census=json.loads((Path(os.environ['ROCKETDICT_RESIDUAL_CENSUS_ROOT'])/'translation-residual-census.json').read_text(encoding='utf-8'))
          if evidence['schema'] != 'rocketdict-full-opticks-illustration-structural-promotion/1':
              raise SystemExit('promotion schema drift')
          if evidence['base_translation_run_id'] != 41 or evidence['base_database_sha256'] != os.environ['BASE_DB_SHA256']:
              raise SystemExit('promotion base identity drift')
          if evidence['base_hard_gate_counts'] != {'numeric_symbol':18,'punctuation':16,'length':0,'unique':33}:
              raise SystemExit('promotion base census drift')
          if evidence['promoted_hard_gate_counts'] != {'numeric_symbol':18,'punctuation':14,'length':0,'unique':31}:
              raise SystemExit('promotion hard-gate result drift')
          if evidence['hard_gate_delta'] != {'numeric_symbol':0,'punctuation':-2,'length':0,'unique':-2}:
              raise SystemExit('promotion hard-gate delta drift')
          if evidence['illustration_attempted_source_starts'] != [72401,90105,203786]:
              raise SystemExit('promotion attempt cohort drift')
          if evidence['illustration_accepted_source_starts'] != [72401,90105,203786] or evidence['illustration_rejected_source_starts'] != []:
              raise SystemExit('promotion acceptance cohort drift')
          if evidence['illustration_selected_ranks'] != [0,0,0,0,0]:
              raise SystemExit('promotion selected-rank drift')
          if evidence['promoted_segment_count'] != 3341:
              raise SystemExit('promotion segment-count drift')
          if evidence['unrelated_base_span_target_exact_count'] != 3333:
              raise SystemExit('promotion unrelated-span exactness drift')
          for key in ('source_coverage_byte_exact','unrelated_translation_spans_target_exact','source_plan_created_before_mt','source_owned_structural_passthrough','model_inputs_source_exact','raw_rank0_only'):
              if evidence[key] is not True:
                  raise SystemExit(f'promotion invariant {key} drift')
          for key in ('source_bytes_rewritten','model_input_source_rewritten','target_rewriting','placeholders','post_translation_literal_injection','corpus_specific_target_patches','evaluator_weakened','n_best_cherry_picking','automatic_n_best_cherry_picking'):
              if evidence[key] is not False:
                  raise SystemExit(f'unsafe promotion flag {key}')
          if [case['source_span'][0] for case in evidence['structural_cases']] != [72401,90105]:
              raise SystemExit('promotion structural-case cohort drift')
          for case in evidence['structural_cases']:
              if [piece['role'] for piece in case['pieces']] != ['label','separator','suffix','trailing']:
                  raise SystemExit('promotion structural role order drift')
              if case['pieces'][1]['target_text'] != case['pieces'][1]['source_text'] or case['pieces'][3]['target_text'] != case['pieces'][3]['source_text']:
                  raise SystemExit('promotion structural passthrough drift')
              for piece in (case['pieces'][0],case['pieces'][2]):
                  if piece['model_input'] != piece['source_text'] or piece['selected_rank'] != 0:
                      raise SystemExit('promotion exact model-input/rank0 drift')
          canonical=dict(evidence); recorded=canonical.pop('evidence_sha256')
          actual=hashlib.sha256(json.dumps(canonical,ensure_ascii=False,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          if recorded != actual:
              raise SystemExit('promotion evidence SHA drift')
          if census['translation_run_id'] != evidence['promoted_translation_run_id']:
              raise SystemExit('independent census run-id drift')
          if census['translation_output_sha256'] != evidence['promoted_translation_output_sha256']:
              raise SystemExit('independent census output-SHA drift')
          if census['database_sha256'] != evidence['promoted_database_sha256']:
              raise SystemExit('independent census database-SHA drift')
          if census['hard_gate_counts'] != evidence['promoted_hard_gate_counts']:
              raise SystemExit('independent census hard-gate drift')
          if 72401 in census['residual_sequences'] or 90105 in census['residual_sequences']:
              raise SystemExit('invalid sequence/start comparison guard')
          print(json.dumps({
              'promoted_translation_run_id':evidence['promoted_translation_run_id'],
              'promoted_translation_output_sha256':evidence['promoted_translation_output_sha256'],
              'promoted_database_sha256':evidence['promoted_database_sha256'],
              'promoted_text_sha256':evidence['promoted_text_sha256'],
              'hard_gate_counts':evidence['promoted_hard_gate_counts'],
              'hard_gate_delta':evidence['hard_gate_delta'],
              'illustration_accepted_source_starts':evidence['illustration_accepted_source_starts'],
              'illustration_selected_targets':evidence['illustration_selected_targets'],
              'unrelated_base_span_target_exact_count':evidence['unrelated_base_span_target_exact_count'],
              'promotion_evidence_sha256':recorded,
              'census_evidence_sha256':census['evidence_sha256'],
          },ensure_ascii=False,indent=2,sort_keys=True))
          PY

      - name: Upload promotion evidence and persisted database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-full-opticks-illustration-structural-promotion
          path: |
            work/illustration-promotion-opus.json
            work/illustration-promotion-tc-big.json
            work/illustration-promotion-run.log
            work/illustration-promotion-census.log
            work/illustration-structural-promotion/*.json
            work/illustration-structural-promotion/*.txt
            work/illustration-structural-promotion/rocketdict.sqlite
            work/illustration-structural-promotion-census/*.json
          if-no-files-found: warn
          retention-days: 90
