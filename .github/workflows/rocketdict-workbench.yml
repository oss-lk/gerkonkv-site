name: RocketDict Workbench

on:
  push:
    branches: [main]
    paths:
      - 'rocketdict-workbench/**'
      - '.github/workflows/rocketdict-workbench.yml'
  pull_request:
    paths:
      - 'rocketdict-workbench/**'
      - '.github/workflows/rocketdict-workbench.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Workbench test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ./rocketdict-workbench
      - name: Compile package
        run: python -m compileall -q rocketdict-workbench/src
      - name: Run dependency-light tests
        run: pytest -q rocketdict-workbench/tests
