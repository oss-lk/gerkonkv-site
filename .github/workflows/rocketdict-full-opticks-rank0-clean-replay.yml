name: RocketDict Full Opticks Rank0 Clean Replay

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - 'rocketdict-workbench/tests/real_translation_full_opticks_rank0_clean_replay.py'
      - '.github/workflows/rocketdict-full-opticks-rank0-clean-replay.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  full-opticks-rank0-clean-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HISTORICAL_RUN_ID: '34688874921'
      HISTORICAL_ARTIFACT_NAME: rocketdict-full-opticks-emphasized-modifier-boundary-rescue
      HISTORICAL_DB_SHA256: 75ec63ea1b8b905af17a757a2a0dcd2697718945a6e9d354d494bb05d2364ca8
      OPUS_URL: https://object.pouta.csc.fi/OPUS-MT-models/en-ru/opus-2020-02-11.zip
      OPUS_SHA256: 798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677
      TC_BIG_REPO: Helsinki-NLP/opus-mt-tc-big-en-zle
      TC_BIG_REVISION: 708be1d372fe4c358a352f404e6dc9ca0126ba48
      TC_BIG_WEIGHTS_SHA256: e68caa9a233c177a3489257b69c18cece6da97767ab2581918ce3fc3c3899416
      TC_BIG_SNAPSHOT: ${{ github.workspace }}/work/tc-big-snapshot
      ROCKETDICT_OPUS_ASSET_DIR: ${{ github.workspace }}/work/opus-asset
      ROCKETDICT_TC_BIG_ASSET_DIR: ${{ github.workspace }}/work/tc-big-asset
      ROCKETDICT_RANK0_CLEAN_REPLAY_ROOT: ${{ github.workspace }}/work/full-opticks-rank0-clean-replay
      ROCKETDICT_RESIDUAL_CENSUS_ROOT: ${{ github.workspace }}/work/rank0-clean-census
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install maintained replay and audit runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e './rocketdict-product-core[production,alt-mt]' -e ./rocketdict-workbench \
            'ctranslate2==4.8.2' 'sentencepiece==0.2.1' \
            'transformers==4.56.2' 'sacremoses==0.1.1' \
            'huggingface_hub==0.34.4' 'safetensors==0.6.2'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0'

      - name: Download exact historical run23 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.HISTORICAL_ARTIFACT_NAME }}
          path: work/historical
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.HISTORICAL_RUN_ID }}

      - name: Stage and authenticate exact historical run23 database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROCKETDICT_RANK0_CLEAN_REPLAY_ROOT"
          HISTORICAL_DB="work/historical/full-opticks-emphasized-modifier-boundary-rescue/rocketdict.sqlite"
          test -s "$HISTORICAL_DB"
          echo "$HISTORICAL_DB_SHA256  $HISTORICAL_DB" | sha256sum -c -
          cp "$HISTORICAL_DB" "$ROCKETDICT_RANK0_CLEAN_REPLAY_ROOT/rocketdict.sqlite"
          echo "$HISTORICAL_DB_SHA256  $ROCKETDICT_RANK0_CLEAN_REPLAY_ROOT/rocketdict.sqlite" | sha256sum -c -

      - name: Restore pinned OPUS archive cache
        uses: actions/cache@v4
        with:
          path: work/opus-2020-02-11.zip
          key: rocketdict-opus-en-ru-2020-02-11-798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677

      - name: Obtain and verify pinned OPUS archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          if [ ! -s work/opus-2020-02-11.zip ]; then
            rm -f work/opus-2020-02-11.zip.tmp
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 "$OPUS_URL" -o work/opus-2020-02-11.zip.tmp
            echo "$OPUS_SHA256  work/opus-2020-02-11.zip.tmp" | sha256sum -c -
            mv work/opus-2020-02-11.zip.tmp work/opus-2020-02-11.zip
          fi
          echo "$OPUS_SHA256  work/opus-2020-02-11.zip" | sha256sum -c -

      - name: Build verified offline OPUS asset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROCKETDICT_OPUS_ASSET_DIR"
          rocketdict-assets build-opus-en-ru work/opus-2020-02-11.zip "$ROCKETDICT_OPUS_ASSET_DIR" | tee work/rank0-clean-opus-asset-build.json

      - name: Restore pinned TC-big snapshot cache
        uses: actions/cache@v4
        with:
          path: work/tc-big-snapshot
          key: rocketdict-tc-big-en-zle-708be1d372fe4c358a352f404e6dc9ca0126ba48-e68caa9a

      - name: Obtain exact pinned TC-big snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id=os.environ['TC_BIG_REPO'],
              revision=os.environ['TC_BIG_REVISION'],
              local_dir=os.environ['TC_BIG_SNAPSHOT'],
              allow_patterns=[
                  'README.md','config.json','generation_config.json','model.safetensors',
                  'source.spm','special_tokens_map.json','target.spm','tokenizer_config.json','vocab.json'
              ],
          )
          PY
          echo "$TC_BIG_WEIGHTS_SHA256  $TC_BIG_SNAPSHOT/model.safetensors" | sha256sum -c -

      - name: Build byte-verified offline TC-big asset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ROCKETDICT_TC_BIG_ASSET_DIR"
          rocketdict-assets build-tc-big-en-ru "$TC_BIG_SNAPSHOT" "$ROCKETDICT_TC_BIG_ASSET_DIR" | tee work/rank0-clean-tc-big-asset-build.json

      - name: Run exact post-run8 rank0-clean full Opticks replay
        run: python -u rocketdict-workbench/tests/real_translation_full_opticks_rank0_clean_replay.py

      - name: Verify persisted rank0-clean replay and publish census inputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['ROCKETDICT_RANK0_CLEAN_REPLAY_ROOT'])
          e = json.loads((root/'full-opticks-rank0-clean-replay.json').read_text(encoding='utf-8'))
          if e['schema'] != 'rocketdict-full-opticks-rank0-clean-lineage-replay/1': raise SystemExit('schema drift')
          if e['historical_translation_run_id'] != 23 or e['clean_start_run_id'] != 8: raise SystemExit('historical/clean-start lineage drift')
          if e['clean_start_reused_exactly'] is not True: raise SystemExit('clean-start cache was not reused exactly')
          if e['first_new_run_id'] != 24 or e['final_translation_run_id'] != 38 or e['new_run_count'] != 15: raise SystemExit('new lineage cardinality drift')
          if len(e['new_lineage']) != 15: raise SystemExit('lineage record cardinality drift')
          expected_base = 8
          for record in e['new_lineage']:
              if record['base_translation_run_id'] != expected_base: raise SystemExit('lineage base drift')
              expected_base = record['run_id']
              for ranks in record['selected_rank_outputs'].values():
                  if any(rank != 0 for rank in ranks): raise SystemExit('non-rank0 selection persisted')
          if e['historical_hard_gate_counts'] != {'numeric_symbol':17,'punctuation':14,'length':0,'unique':30}: raise SystemExit('historical census drift')
          if e['source_coverage_byte_exact'] is not True or e['database_integrity_check'] != 'ok' or e['foreign_key_violation_count'] != 0: raise SystemExit('integrity drift')
          if e['promotion_allowed'] is not False or e['automatic_product_default_allowed'] is not False: raise SystemExit('unsafe promotion flag')
          for flag in ('source_bytes_rewritten','target_rewriting','placeholders','post_translation_literal_injection','corpus_specific_target_patches','evaluator_weakened','n_best_cherry_picking','automatic_n_best_cherry_picking'):
              if e[flag] is not False: raise SystemExit(f'unsafe flag drift: {flag}')
          canonical=dict(e); recorded=canonical.pop('evidence_sha256')
          actual=hashlib.sha256(json.dumps(canonical,ensure_ascii=False,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          if actual != recorded: raise SystemExit('canonical evidence SHA drift')
          db=root/'rocketdict.sqlite'
          h=hashlib.sha256(db.read_bytes()).hexdigest()
          if h != e['final_database_sha256']: raise SystemExit('persisted database SHA drift')
          env=Path(os.environ['GITHUB_ENV'])
          with env.open('a', encoding='utf-8') as f:
              f.write(f"ROCKETDICT_RESIDUAL_CENSUS_DB={db}\n")
              f.write(f"ROCKETDICT_RESIDUAL_TRANSLATION_RUN_ID={e['final_translation_run_id']}\n")
              f.write(f"ROCKETDICT_RESIDUAL_EXPECTED_DB_SHA256={e['final_database_sha256']}\n")
              f.write(f"ROCKETDICT_CLEAN_EXPECTED_OUTPUT_SHA256={e['final_translation_output_sha256']}\n")
              f.write(f"ROCKETDICT_CLEAN_EXPECTED_COUNTS={json.dumps(e['final_hard_gate_counts'],separators=(',',':'))}\n")
          print(json.dumps({'run':e['final_translation_run_id'],'counts':e['final_hard_gate_counts'],'segments':e['final_segment_count'],'changed_rank_gt0_spans':[k for k,v in e['historical_rank_gt0_span_audit'].items() if v['target_changed']],'database_sha256':e['final_database_sha256'],'evidence_sha256':e['evidence_sha256']}, indent=2, ensure_ascii=False))
          PY

      - name: Run residual census over rank0-clean final run
        run: python -u rocketdict-workbench/tests/audit_translation_residual_census.py

      - name: Verify clean census agrees with replay evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "$ROCKETDICT_RESIDUAL_EXPECTED_DB_SHA256  $ROCKETDICT_RESIDUAL_CENSUS_DB" | sha256sum -c -
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['ROCKETDICT_RESIDUAL_CENSUS_ROOT'])
          e=json.loads((root/'translation-residual-census.json').read_text(encoding='utf-8'))
          expected=json.loads(os.environ['ROCKETDICT_CLEAN_EXPECTED_COUNTS'])
          if e['hard_gate_counts'] != expected: raise SystemExit(f"census/replay count mismatch: {e['hard_gate_counts']!r} != {expected!r}")
          if e['translation_output_sha256'] != os.environ['ROCKETDICT_CLEAN_EXPECTED_OUTPUT_SHA256']: raise SystemExit('clean output SHA mismatch')
          if e['database_sha256'] != os.environ['ROCKETDICT_RESIDUAL_EXPECTED_DB_SHA256']: raise SystemExit('clean database SHA mismatch')
          if e['source_coverage_byte_exact'] is not True or e['database_unchanged'] is not True: raise SystemExit('census immutability drift')
          print(json.dumps({'counts':e['hard_gate_counts'],'residual_sequences':e['residual_sequences'],'numeric_classes':e['numeric_defect_class_counts'],'source_features':e['source_feature_counts'],'evidence_sha256':e['evidence_sha256']}, indent=2, ensure_ascii=False))
          PY

      - name: Record runtime evidence
        if: always()
        shell: bash
        run: |
          mkdir -p work/rank0-clean-runtime
          python -VV > work/rank0-clean-runtime/python.txt || true
          python -m pip freeze | sort > work/rank0-clean-runtime/pip-freeze.txt || true
          sha256sum work/opus-2020-02-11.zip > work/rank0-clean-runtime/opus.sha256 || true
          sha256sum "$TC_BIG_SNAPSHOT/model.safetensors" > work/rank0-clean-runtime/tc-big-weights.sha256 || true

      - name: Upload persisted rank0-clean baseline and census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-full-opticks-rank0-clean-replay
          path: |
            work/rank0-clean-opus-asset-build.json
            work/rank0-clean-tc-big-asset-build.json
            work/full-opticks-rank0-clean-replay/**
            work/rank0-clean-census/*.json
            work/rank0-clean-runtime/**
          if-no-files-found: error
          retention-days: 90
