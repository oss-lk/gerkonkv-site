name: RocketDict verify illustration carrier promotion artifact

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - '.github/workflows/rocketdict-verify-illustration-carrier-promotion-artifact.yml'

permissions:
  contents: read
  actions: read

jobs:
  verify-persisted-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_RUN_ID: '34743281964'
      SOURCE_ARTIFACT_NAME: rocketdict-full-opticks-illustration-structural-promotion
      SOURCE_ARTIFACT_ID: '10312992185'
      SOURCE_ARTIFACT_DIGEST: sha256:81be4996bce174e7aaa21c41da8ef531a9b6d0f59346c26b7fb6328861ab451a
      EXPECTED_DB_SHA256: cb4568584e70be0fb4d011cd9de212ae01edd046dec8c5ec104ee3bb0e91dc56
      EXPECTED_OUTPUT_SHA256: 2971fb099674aa81c14e0b75590c5fbcb943d1ea3477efb0ceedbd81bd69fbc5
      EXPECTED_TEXT_SHA256: 705dac5de010af8d5c08a3da49b7ec5d568ddf144e435f4617b5cbe2e604f73d
      EXPECTED_PROMOTION_EVIDENCE_SHA256: d6dfe0771e0a0c41506494b860c1733981adace656afb6a0130c291cfdfb57ff
      EXPECTED_CENSUS_EVIDENCE_SHA256: 8c79ba9f8bd17790b41bff9e10f8b89ee5706733780ddc6dcd8bebe93c77857e
    steps:
      - uses: actions/checkout@v4
      - name: Download persisted promotion artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_ARTIFACT_NAME }}
          path: work/promotion
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Verify persisted promotion independently
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, sqlite3
          from pathlib import Path

          root=Path('work/promotion')
          evidence_paths=list(root.rglob('full-opticks-illustration-structural-promotion.json'))
          census_paths=list(root.rglob('translation-residual-census.json'))
          dbs=list(root.rglob('rocketdict.sqlite'))
          if len(evidence_paths)!=1 or len(census_paths)!=1 or len(dbs)!=1:
              raise SystemExit(f'artifact cardinality drift: {evidence_paths=} {census_paths=} {dbs=}')
          evidence=json.loads(evidence_paths[0].read_text(encoding='utf-8'))
          census=json.loads(census_paths[0].read_text(encoding='utf-8'))
          db=dbs[0]

          def canonical_sha(value):
              return hashlib.sha256(json.dumps(value,ensure_ascii=False,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          def file_sha(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for block in iter(lambda:f.read(8*1024*1024),b''):
                      h.update(block)
              return h.hexdigest()

          promotion_copy=dict(evidence)
          promotion_recorded=promotion_copy.pop('evidence_sha256')
          if canonical_sha(promotion_copy)!=promotion_recorded or promotion_recorded!=os.environ['EXPECTED_PROMOTION_EVIDENCE_SHA256']:
              raise SystemExit('promotion evidence SHA drift')
          census_copy=dict(census)
          census_recorded=census_copy.pop('evidence_sha256')
          if canonical_sha(census_copy)!=census_recorded or census_recorded!=os.environ['EXPECTED_CENSUS_EVIDENCE_SHA256']:
              raise SystemExit('census evidence SHA drift')

          if evidence['schema']!='rocketdict-full-opticks-illustration-structural-promotion/1':
              raise SystemExit('promotion schema drift')
          if evidence['base_translation_run_id']!=41:
              raise SystemExit('base run drift')
          if evidence['promoted_translation_run_id']!=56:
              raise SystemExit('promoted run drift')
          expected_counts={'numeric_symbol':18,'punctuation':14,'length':0,'unique':31}
          if evidence['promoted_hard_gate_counts']!=expected_counts or census['hard_gate_counts']!=expected_counts:
              raise SystemExit('promoted hard-gate count drift')
          if evidence['hard_gate_delta']!={'numeric_symbol':0,'punctuation':-2,'length':0,'unique':-2}:
              raise SystemExit('hard-gate delta drift')
          if evidence['promoted_segment_count']!=3335:
              raise SystemExit('semantic-carrier segment count drift')
          if evidence['unrelated_base_span_target_exact_count']!=3333 or evidence['unrelated_translation_spans_target_exact'] is not True:
              raise SystemExit('unrelated translation drift')
          if evidence['illustration_attempted_source_starts']!=[72401,90105,203786]:
              raise SystemExit('illustration attempt cohort drift')
          if evidence['illustration_accepted_source_starts']!=[72401,90105,203786] or evidence['illustration_rejected_source_starts']!=[]:
              raise SystemExit('illustration acceptance cohort drift')
          if evidence['illustration_selected_ranks']!=[0,0,0,0,0]:
              raise SystemExit('illustration selected-rank drift')

          required_true=(
              'source_coverage_byte_exact','unrelated_translation_spans_target_exact',
              'source_plan_created_before_mt','source_owned_structural_passthrough',
              'model_inputs_source_exact','raw_rank0_only',
          )
          for key in required_true:
              if evidence.get(key) is not True:
                  raise SystemExit(f'promotion invariant {key} drift')
          required_false=(
              'source_bytes_rewritten','model_input_source_rewritten','target_rewriting',
              'placeholders','post_translation_literal_injection','corpus_specific_target_patches',
              'evaluator_weakened','n_best_cherry_picking','automatic_n_best_cherry_picking',
          )
          for key in required_false:
              if evidence.get(key) is not False:
                  raise SystemExit(f'unsafe promotion flag {key}')

          structural=evidence['structural_cases']
          if [case['source_span'][0] for case in structural]!=[72401,90105]:
              raise SystemExit('structural cohort drift')
          for case in structural:
              pieces=case['pieces']
              if [piece['role'] for piece in pieces]!=['label','separator','suffix','trailing']:
                  raise SystemExit('structural role order drift')
              if pieces[0]['model']!='opus' or pieces[2]['model']!='tc_big':
                  raise SystemExit('structural model routing drift')
              rendered=[]
              for piece in pieces:
                  if piece['role'] in ('label','suffix'):
                      if piece['model_input']!=piece['source_text'] or piece['model_input_source_exact'] is not True:
                          raise SystemExit('exact lexical model input drift')
                      if piece['selected_rank']!=0 or piece['raw_model_selected'] is not True:
                          raise SystemExit('rank0 provenance drift')
                      rendered.append(piece['selected_target'])
                  else:
                      if piece['kind']!='preserve_source_structure' or piece['source_owned'] is not True:
                          raise SystemExit('structural ownership drift')
                      if piece['rendered_text']!=piece['source_text']:
                          raise SystemExit('structural passthrough drift')
                      rendered.append(piece['rendered_text'])
              if ''.join(rendered)!=case['target_text']:
                  raise SystemExit('semantic carrier render drift')

          residual_starts=[int(record['source_start']) for record in census['records']]
          if 72401 in residual_starts or 90105 in residual_starts:
              raise SystemExit('promoted illustration remains residual')
          if census['translation_run_id']!=56 or census['translation_output_sha256']!=os.environ['EXPECTED_OUTPUT_SHA256']:
              raise SystemExit('independent census translation identity drift')
          if census['database_sha256']!=os.environ['EXPECTED_DB_SHA256']:
              raise SystemExit('independent census database identity drift')
          if evidence['promoted_translation_output_sha256']!=os.environ['EXPECTED_OUTPUT_SHA256']:
              raise SystemExit('promotion output SHA drift')
          if evidence['promoted_text_sha256']!=os.environ['EXPECTED_TEXT_SHA256']:
              raise SystemExit('promotion text SHA drift')
          if evidence['promoted_database_sha256']!=os.environ['EXPECTED_DB_SHA256']:
              raise SystemExit('promotion database SHA drift')
          observed_db_sha=file_sha(db)
          if observed_db_sha!=os.environ['EXPECTED_DB_SHA256']:
              raise SystemExit(f'persisted database bytes drift: {observed_db_sha}')

          con=sqlite3.connect(f'file:{db.resolve().as_posix()}?mode=ro',uri=True)
          integrity=con.execute('PRAGMA integrity_check').fetchone()[0]
          foreign_keys=con.execute('PRAGMA foreign_key_check').fetchall()
          row=con.execute('SELECT status,output_sha256 FROM stage_runs WHERE id=56').fetchone()
          segment_count=con.execute("SELECT COUNT(*) FROM run_items WHERE run_id=56 AND kind='translation_segment'").fetchone()[0]
          con.close()
          if integrity!='ok' or foreign_keys:
              raise SystemExit(f'SQLite integrity drift: {integrity=} fk={len(foreign_keys)}')
          if row is None or row[0]!='completed' or row[1]!=os.environ['EXPECTED_OUTPUT_SHA256']:
              raise SystemExit('persisted run56 identity/status drift')
          if segment_count!=3335:
              raise SystemExit('persisted run56 segment count drift')

          verification={
              'schema':'rocketdict-illustration-carrier-promotion-artifact-verification/1',
              'source_workflow_run_id':int(os.environ['SOURCE_RUN_ID']),
              'source_artifact_id':int(os.environ['SOURCE_ARTIFACT_ID']),
              'source_artifact_digest':os.environ['SOURCE_ARTIFACT_DIGEST'],
              'promoted_translation_run_id':56,
              'promoted_translation_output_sha256':os.environ['EXPECTED_OUTPUT_SHA256'],
              'promoted_text_sha256':os.environ['EXPECTED_TEXT_SHA256'],
              'promoted_database_sha256':observed_db_sha,
              'promotion_evidence_sha256':promotion_recorded,
              'census_evidence_sha256':census_recorded,
              'hard_gate_counts':expected_counts,
              'segment_count':segment_count,
              'sqlite_integrity_check':integrity,
              'sqlite_foreign_key_violation_count':len(foreign_keys),
              'source_coverage_byte_exact':True,
              'unrelated_translation_spans_target_exact':True,
              'source_plan_created_before_mt':True,
              'model_inputs_source_exact':True,
              'raw_rank0_only':True,
              'unsafe_flags_all_false':True,
          }
          verification['verification_sha256']=canonical_sha(verification)
          out=Path('work/illustration-carrier-promotion-artifact-verification.json')
          out.write_text(json.dumps(verification,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(verification,ensure_ascii=False,sort_keys=True))
          PY
      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-illustration-carrier-promotion-artifact-verification
          path: work/illustration-carrier-promotion-artifact-verification.json
          if-no-files-found: error
          retention-days: 90
