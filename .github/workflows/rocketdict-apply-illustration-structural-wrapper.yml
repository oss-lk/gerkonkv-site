name: RocketDict apply illustration structural wrapper

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - '.github/workflows/rocketdict-apply-illustration-structural-wrapper.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/product-core-forward
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize reviewed source and tests
        shell: bash
        run: |
          python - <<'PYCODE'
          import base64, gzip
          from pathlib import Path
          payloads = {
              Path('rocketdict-product-core/src/rocketdict/translation_illustration_rescue_stage.py'): '',
              Path('rocketdict-product-core/tests/test_translation_illustration_rescue_stage.py'): '',
          }
          for path, encoded in payloads.items():
              data = gzip.decompress(base64.b64decode(encoded))
              path.write_bytes(data)
              print(path, len(data))
          PYCODE
          echo 'fb6740c76ef42885f0e4293b22edcb499094cfeecb62e64f61913b98108a20aa  rocketdict-product-core/src/rocketdict/translation_illustration_rescue_stage.py' | sha256sum -c -
          echo 'efb9c27f1862f0dfefcb8933e5aacb51e0ffdd279072bf9d58e71d6398001a76  rocketdict-product-core/tests/test_translation_illustration_rescue_stage.py' | sha256sum -c -
      - name: Install dependency-light maintained trees
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ./rocketdict-product-core
          python -m pip install -e ./rocketdict-workbench
      - name: Verify illustration wrapper and maintained dependency-light regressions
        run: |
          python -m compileall -q rocketdict-product-core/src rocketdict-workbench/src
          pytest -q rocketdict-product-core/tests/test_translation_illustration_rescue_stage.py
          pytest -q rocketdict-product-core/tests --ignore=rocketdict-product-core/tests/real_runtime_smoke.py
          pytest -q rocketdict-workbench/tests
      - name: Commit verified engineering change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rocketdict-product-core/src/rocketdict/translation_illustration_rescue_stage.py rocketdict-product-core/tests/test_translation_illustration_rescue_stage.py
          git diff --cached --check
          git diff --cached --quiet && { echo 'No engineering diff to commit'; exit 1; }
          git commit -m 'Implement source-planned illustration structural wrapper'
          git push origin HEAD:chatgpt/product-core-forward
