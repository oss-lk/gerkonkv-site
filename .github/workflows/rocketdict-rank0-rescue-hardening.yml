name: RocketDict rank0 hardening cleanup

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - '.github/workflows/rocketdict-rank0-rescue-hardening.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/product-core-forward
          fetch-depth: 0
      - name: Remove generated bytecode and temporary patch machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch rocketdict-product-core/src/rocketdict/__pycache__
          git rm -r --ignore-unmatch rocketdict-product-core/tests/__pycache__
          cat > .gitignore <<'EOF'
          __pycache__/
          *.py[cod]
          .pytest_cache/
          EOF
          git add .gitignore
          git rm --ignore-unmatch .github/scripts/rank0_hardening_patch.py
          git rm --ignore-unmatch .github/workflows/rocketdict-rank0-rescue-hardening.yml
      - name: Commit repository hygiene repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove generated Python bytecode from rank0 hardening'
          git push origin HEAD:chatgpt/product-core-forward
