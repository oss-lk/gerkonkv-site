name: RocketDict rank0 rescue hardening

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - '.github/workflows/rocketdict-rank0-rescue-hardening.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/product-core-forward
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply rank0-only selector policy
        run: python .github/scripts/rank0_hardening_patch.py
      - name: Install Product Core test runtime
        run: python -m pip install -e ./rocketdict-product-core pytest
      - name: Run rank0 hardening regressions
        run: |
          python -m pytest -q \
            rocketdict-product-core/tests/test_translation_rank0_selection_policy.py \
            rocketdict-product-core/tests/test_translation_illustration_rescue_stage.py \
            rocketdict-product-core/tests/test_translation_tc_big_delimiter_rescue_stage.py \
            rocketdict-product-core/tests/test_translation_tc_big_footnote_reference_rescue_stage.py \
            rocketdict-product-core/tests/test_translation_tc_big_semicolon_question_rescue_stage.py \
            rocketdict-product-core/tests/test_translation_tc_big_equals_addition_rescue_stage.py
      - name: Commit hardened selectors
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rocketdict-product-core/src/rocketdict rocketdict-product-core/tests
          git commit -m 'Enforce rank0-only rescue selection across n-best wrappers'
          git push origin HEAD:chatgpt/product-core-forward
