name: RocketDict Stage8 overlay prefix recovery

on:
  push:
    branches: [main]
    paths:
      - 'rocketdict-ci/recover_stage8_overlay_prefix.py'
      - 'rocketdict/payload/stage8-overlay/part-000.b64'
      - '.github/workflows/rocketdict-stage8-overlay-prefix-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Recover verified tar prefix from surviving Stage8 overlay chunk
        run: python rocketdict-ci/recover_stage8_overlay_prefix.py
      - name: Print recovery report
        run: cat rocketdict-recovery-prefix/report.json
      - name: Upload recovered prefix evidence
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-stage8-overlay-prefix-recovery
          path: rocketdict-recovery-prefix
          if-no-files-found: error

