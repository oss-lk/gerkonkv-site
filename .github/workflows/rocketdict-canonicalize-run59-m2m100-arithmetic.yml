name: RocketDict Canonical Run59 M2M100 Arithmetic Promotion

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - '.github/workflows/rocketdict-canonicalize-run59-m2m100-arithmetic.yml'
      - 'rocketdict-workbench/tests/verify_run59_m2m100_arithmetic_canonical_promotion.py'
      - 'rocketdict-workbench/tests/audit_translation_residual_census.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      REPLAY_RUN_ID: '34752772395'
      REPLAY_AGGREGATE_ARTIFACT: rocketdict-run58-m2m100-arithmetic-replay-aggregate
      REPLAY_REPLICA_ARTIFACT: rocketdict-run58-m2m100-arithmetic-replay-1
      EXPECTED_REPLICA_DB_SHA256: 41bafa00619c83b87f55f7e452f8e9e27a1871d601bb5c846d3d561531dbb78d
      ROCKETDICT_RUN59_CANONICAL_ROOT: ${{ github.workspace }}/work/canonical
      ROCKETDICT_RUN59_CANONICAL_DB: ${{ github.workspace }}/work/canonical/rocketdict.sqlite
      ROCKETDICT_RESIDUAL_CENSUS_ROOT: ${{ github.workspace }}/work/canonical/residual-census
      ROCKETDICT_RESIDUAL_CENSUS_DB: ${{ github.workspace }}/work/canonical/rocketdict.sqlite
      ROCKETDICT_RESIDUAL_TRANSLATION_RUN_ID: '59'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install read-only verification runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ./rocketdict-product-core -e ./rocketdict-workbench

      - name: Download replicated replay aggregate authority
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.REPLAY_AGGREGATE_ARTIFACT }}
          path: work/replay-aggregate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.REPLAY_RUN_ID }}

      - name: Download selected persisted run59 replica
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.REPLAY_REPLICA_ARTIFACT }}
          path: work/replay-replica
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.REPLAY_RUN_ID }}

      - name: Authenticate replay authority and stage exact replica database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROCKETDICT_RUN59_CANONICAL_ROOT"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path

          agg_paths=list(Path('work/replay-aggregate').rglob('run58-m2m100-arithmetic-public-replay-aggregate.json'))
          rep_paths=list(Path('work/replay-replica').rglob('run58-m2m100-arithmetic-public-replay.json'))
          db_paths=list(Path('work/replay-replica').rglob('rocketdict.sqlite'))
          if len(agg_paths)!=1 or len(rep_paths)!=1 or len(db_paths)!=1:
              raise SystemExit(f'artifact cardinality drift: {agg_paths=} {rep_paths=} {db_paths=}')

          def auth(path, schema):
              e=json.loads(path.read_text(encoding='utf-8'))
              if e.get('schema')!=schema: raise SystemExit(f'schema drift: {path}')
              c=dict(e); recorded=c.pop('evidence_sha256','')
              actual=hashlib.sha256(json.dumps(c,ensure_ascii=False,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
              if actual!=recorded: raise SystemExit(f'evidence SHA drift: {path}')
              return e

          aggregate=auth(agg_paths[0],'rocketdict-run58-m2m100-arithmetic-public-replay-aggregate/1')
          replica=auth(rep_paths[0],'rocketdict-run58-m2m100-arithmetic-public-replay/1')
          if aggregate.get('canonical_promotion_authorized') is not True or aggregate.get('parent_replacement_allowed') is not False:
              raise SystemExit('aggregate authority boundary drift')
          if replica.get('evidence_sha256') not in aggregate.get('replica_evidence_sha256',[]):
              raise SystemExit('selected replica not authenticated by aggregate')
          raw=db_paths[0].read_bytes(); sha=hashlib.sha256(raw).hexdigest()
          if sha!=os.environ['EXPECTED_REPLICA_DB_SHA256'] or sha!=replica.get('persisted_database_sha256'):
              raise SystemExit(f'selected replica DB identity drift: {sha}')
          Path(os.environ['ROCKETDICT_RUN59_CANONICAL_DB']).write_bytes(raw)
          env=Path(os.environ['GITHUB_ENV'])
          with env.open('a',encoding='utf-8') as f:
              f.write(f'ROCKETDICT_RUN59_AGGREGATE_EVIDENCE={agg_paths[0].resolve()}\n')
              f.write(f'ROCKETDICT_RUN59_REPLICA_EVIDENCE={rep_paths[0].resolve()}\n')
          print(json.dumps({
              'aggregate_evidence_sha256':aggregate['evidence_sha256'],
              'replica_evidence_sha256':replica['evidence_sha256'],
              'database_sha256':sha,
              'promoted_output_sha256':replica['promoted_translation_output_sha256'],
          },indent=2,sort_keys=True))
          PY
          export ROCKETDICT_RESIDUAL_EXPECTED_DB_SHA256="$EXPECTED_REPLICA_DB_SHA256"
          echo "ROCKETDICT_RESIDUAL_EXPECTED_DB_SHA256=$EXPECTED_REPLICA_DB_SHA256" >> "$GITHUB_ENV"
          sha256sum "$ROCKETDICT_RUN59_CANONICAL_DB"

      - name: Run independent persisted residual census
        shell: bash
        run: |
          set -euo pipefail
          python -u rocketdict-workbench/tests/audit_translation_residual_census.py \
            | tee "$ROCKETDICT_RUN59_CANONICAL_ROOT/residual-census.log"
          CENSUS="$ROCKETDICT_RESIDUAL_CENSUS_ROOT/translation-residual-census.json"
          test -s "$CENSUS"
          echo "ROCKETDICT_RUN59_CENSUS_EVIDENCE=$CENSUS" >> "$GITHUB_ENV"

      - name: Verify canonical run59 promotion authority
        shell: bash
        run: |
          set -euo pipefail
          python -u rocketdict-workbench/tests/verify_run59_m2m100_arithmetic_canonical_promotion.py \
            | tee "$ROCKETDICT_RUN59_CANONICAL_ROOT/canonical-verifier.log"

      - name: Independently cross-check canonical evidence and SQLite
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,sqlite3
          from pathlib import Path
          root=Path(os.environ['ROCKETDICT_RUN59_CANONICAL_ROOT'])
          p=root/'run59-m2m100-arithmetic-canonical-promotion.json'
          e=json.loads(p.read_text(encoding='utf-8'))
          c=dict(e); recorded=c.pop('evidence_sha256')
          actual=hashlib.sha256(json.dumps(c,ensure_ascii=False,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
          if actual!=recorded: raise SystemExit('canonical evidence SHA drift')
          if e.get('schema')!='rocketdict-run59-m2m100-arithmetic-canonical-promotion/1': raise SystemExit('canonical schema drift')
          if e.get('parent_replacement_allowed') is not True: raise SystemExit('canonical parent replacement not authorized')
          if e.get('canonical_translation_run_id')!=59 or e.get('base_translation_run_id')!=58: raise SystemExit('canonical run ancestry drift')
          if e.get('hard_gate_counts')!={'numeric_symbol':15,'punctuation':10,'length':0,'unique':24}: raise SystemExit('canonical hard counts drift')
          if e.get('changed_target_sequences')!=[2739]: raise SystemExit('canonical changed-target drift')
          db=Path(os.environ['ROCKETDICT_RUN59_CANONICAL_DB'])
          sha=hashlib.sha256(db.read_bytes()).hexdigest()
          if sha!=e.get('database_sha256'): raise SystemExit('canonical DB SHA drift')
          con=sqlite3.connect(db)
          integrity=con.execute('PRAGMA integrity_check').fetchone()[0]
          fk=len(con.execute('PRAGMA foreign_key_check').fetchall())
          con.close()
          if integrity!='ok' or fk!=0: raise SystemExit(f'canonical SQLite integrity drift: {integrity=} {fk=}')
          print(json.dumps({
              'parent_replacement_allowed':True,
              'canonical_run_id':59,
              'output_sha256':e['translation_output_sha256'],
              'parameters_sha256':e['parameters_sha256'],
              'database_sha256':sha,
              'target_text_sha256':e['target_text_sha256'],
              'hard_gate_counts':e['hard_gate_counts'],
              'canonical_evidence_sha256':recorded,
              'census_evidence_sha256':e['residual_census_evidence_sha256'],
          },indent=2,sort_keys=True))
          PY

      - name: Upload canonical run59 parent and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-canonical-run59-m2m100-arithmetic
          path: |
            work/canonical/rocketdict.sqlite
            work/canonical/*.json
            work/canonical/*.log
            work/canonical/residual-census/*.json
            work/replay-aggregate/**
            work/replay-replica/**/run58-m2m100-arithmetic-public-replay.json
          if-no-files-found: error
          retention-days: 90
