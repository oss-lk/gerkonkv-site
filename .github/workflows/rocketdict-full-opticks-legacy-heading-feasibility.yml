name: RocketDict Full Opticks Legacy Heading Feasibility

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - 'rocketdict-workbench/tests/real_translation_full_opticks_legacy_heading_feasibility.py'
      - '.github/workflows/rocketdict-full-opticks-legacy-heading-feasibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-heading-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPUS_URL: https://object.pouta.csc.fi/OPUS-MT-models/en-ru/opus-2020-02-11.zip
      OPUS_SHA256: 798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677
      OPTICKS_URL: https://www.gutenberg.org/cache/epub/33504/pg33504.txt
      OPTICKS_SHA256: 1e25ec2c54fc6e9fa05d7f0a663e05cf2ee671231c65731f4845df2539dfb217
      ROCKETDICT_OPUS_ASSET_DIR: ${{ github.workspace }}/work/opus-asset
      ROCKETDICT_OPTICKS_SOURCE: ${{ github.workspace }}/work/opticks.txt
      ROCKETDICT_HEADING_FEASIBILITY_ROOT: ${{ github.workspace }}/work/legacy-heading-feasibility
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install maintained Product MT runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './rocketdict-product-core[production]'
      - name: Restore pinned OPUS archive cache
        uses: actions/cache@v4
        with:
          path: work/opus-2020-02-11.zip
          key: rocketdict-opus-en-ru-2020-02-11-798027c7e4ae7ddf89fea13ce80de517b6726d7e710fa5a9b5a376316dbf1677
      - name: Obtain and verify pinned OPUS and Opticks sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          if [ ! -s work/opus-2020-02-11.zip ]; then
            rm -f work/opus-2020-02-11.zip.tmp
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 "$OPUS_URL" -o work/opus-2020-02-11.zip.tmp
            echo "$OPUS_SHA256  work/opus-2020-02-11.zip.tmp" | sha256sum -c -
            mv work/opus-2020-02-11.zip.tmp work/opus-2020-02-11.zip
          fi
          echo "$OPUS_SHA256  work/opus-2020-02-11.zip" | sha256sum -c -
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 "$OPTICKS_URL" -o "$ROCKETDICT_OPTICKS_SOURCE"
          echo "$OPTICKS_SHA256  $ROCKETDICT_OPTICKS_SOURCE" | sha256sum -c -
      - name: Build verified offline CTranslate2 float32 asset
        run: |
          rocketdict-assets build-opus-en-ru work/opus-2020-02-11.zip "$ROCKETDICT_OPUS_ASSET_DIR" | tee work/opus-asset-build.json
          test -s "$ROCKETDICT_OPUS_ASSET_DIR/rocketdict-opus-asset.json"
          test -s "$ROCKETDICT_OPUS_ASSET_DIR/ct2/model.bin"
      - name: Evaluate complete legacy block-heading inventory
        run: python -u rocketdict-workbench/tests/real_translation_full_opticks_legacy_heading_feasibility.py
      - name: Record runtime identities and resources
        if: always()
        run: |
          mkdir -p work/legacy-heading-runtime-evidence
          python -VV > work/legacy-heading-runtime-evidence/python.txt || true
          python -m pip freeze | sort > work/legacy-heading-runtime-evidence/pip-freeze.txt || true
          df -h > work/legacy-heading-runtime-evidence/disk.txt || true
          free -h > work/legacy-heading-runtime-evidence/memory.txt || true
          sha256sum work/opus-2020-02-11.zip > work/legacy-heading-runtime-evidence/opus.sha256 || true
          sha256sum "$ROCKETDICT_OPTICKS_SOURCE" > work/legacy-heading-runtime-evidence/opticks.sha256 || true
      - name: Upload legacy heading feasibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocketdict-full-opticks-legacy-heading-feasibility
          path: |
            work/opus-asset-build.json
            work/legacy-heading-feasibility/full-opticks-legacy-heading-feasibility.json
            work/legacy-heading-runtime-evidence/**
          if-no-files-found: warn
          retention-days: 90
