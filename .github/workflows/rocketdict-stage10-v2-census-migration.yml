name: RocketDict Stage10 v2 Census Migration

on:
  push:
    branches: [chatgpt/product-core-forward]
    paths:
      - '.github/workflows/rocketdict-stage10-v2-census-migration.yml'

permissions:
  contents: write
  actions: write

jobs:
  migrate-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/product-core-forward
      - name: Replace stale five-boundary assumption with exact full-corpus census
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          offsets = (
              655, 10277, 18355, 23464, 50306, 54796, 63563, 64046, 64118,
              89748, 92716, 106061, 112001, 132089, 137981, 146358, 155895,
              166588, 168067, 180246, 189201, 203830, 220080, 223062, 228046,
              247799, 266720, 301082, 349036, 355851, 412197, 434836, 455648,
              507039, 522572, 545343, 548282, 556573,
          )
          assert len(offsets) == 38 and len(set(offsets)) == 38

          comparison = Path('rocketdict-workbench/tests/real_translation_full_opticks_stage10_v2_comparison.py')
          text = comparison.read_text(encoding='utf-8')
          old = 'EXPECTED_COALESCED_BOUNDARIES = 5\nWHENCE_FIRST_START = 522555'
          rendered = ',\n    '.join(str(value) for value in offsets)
          new = (
              'EXPECTED_COALESCED_BOUNDARIES = 38\n'
              'EXPECTED_BOUNDARY_OFFSETS = (\n    ' + rendered + ',\n)\n'
              'WHENCE_FIRST_START = 522555'
          )
          if old in text:
              text = text.replace(old, new)
          elif 'EXPECTED_COALESCED_BOUNDARIES = 38' not in text:
              raise SystemExit('comparison count constant patch point drift')
          text = text.replace(
              'raise RuntimeError("Stage10 v2 sentence-count delta does not equal the five removed boundaries")',
              'raise RuntimeError("Stage10 v2 sentence-count delta does not equal the exact full-corpus merge census")',
          )
          needle = '    boundary_offsets = [int(row["source_offset"]) for row in boundary_decisions]\n'
          exact_check = (
              '    if boundary_offsets != list(EXPECTED_BOUNDARY_OFFSETS):\n'
              '        raise RuntimeError(\n'
              '            f"Stage10 v2 exact boundary-offset census drift: {boundary_offsets!r}"\n'
              '        )\n'
          )
          if exact_check not in text:
              if text.count(needle) != 1:
                  raise SystemExit('comparison exact-offset patch point drift')
              text = text.replace(needle, needle + exact_check)
          comparison.write_text(text, encoding='utf-8')

          tests = Path('rocketdict-product-core/tests/test_context_sentence_boundaries.py')
          text = tests.read_text(encoding='utf-8')
          marker = 'def test_figure_reference_lowercase_markup_continuation_is_coalesced()'
          if marker not in text:
              text += '''\n\n\ndef test_figure_reference_lowercase_markup_continuation_is_coalesced() -> None:\n    content = "Suppose that RS [in _Fig._ 1.] represents the ray."\n    rs = content.index("RS")\n    reference = content.index("[in")\n    decision = evaluate_spacy_sentence_boundary(\n        content, 0, [_token(content, "RS", rs, token_index=0)],\n        1, [_token(content, "[in _Fig._ 1.]", reference, token_index=1)],\n    )\n    assert decision["merge"] is True\n    assert decision["lowercase_continuation"] is True\n    assert decision["source_offset"] == reference\n\n\ndef test_split_inside_gutenberg_emphasis_is_coalesced() -> None:\n    content = "Variable _q_ is on the axis."\n    underscore = content.index("_q_")\n    q_start = underscore + 1\n    decision = evaluate_spacy_sentence_boundary(\n        content, 7, [_token(content, "_", underscore, token_index=7)],\n        8, [_token(content, "q_", q_start, token_index=8)],\n    )\n    assert decision["merge"] is True\n    assert decision["lowercase_continuation"] is True\n\n\ndef test_split_inside_gutenberg_greek_markup_is_coalesced() -> None:\n    content = "Line _A[Greek:a]_ in the figure."\n    left_start = content.index("[Greek:")\n    right_start = content.index("a]")\n    decision = evaluate_spacy_sentence_boundary(\n        content, 2, [_token(content, "[Greek:", left_start, token_index=2)],\n        3, [_token(content, "a]", right_start, token_index=3)],\n    )\n    assert decision["merge"] is True\n    assert decision["source_offset"] == right_start\n\n\ndef test_lowercase_conjunction_continuation_is_coalesced() -> None:\n    content = "The ratio is fixed; and these sines remain proportional."\n    left_start = content.index("and")\n    right_start = content.index("these")\n    decision = evaluate_spacy_sentence_boundary(\n        content, 11, [_token(content, "and", left_start, token_index=11)],\n        12, [_token(content, "these", right_start, token_index=12)],\n    )\n    assert decision["merge"] is True\n\n\ndef test_markup_with_uppercase_first_lexical_character_stays_separate() -> None:\n    content = "Heading [Next] section"\n    right_start = content.index("[Next]")\n    decision = evaluate_spacy_sentence_boundary(\n        content, 0, [_token(content, "Heading", 0, token_index=0)],\n        1, [_token(content, "[Next]", right_start, token_index=1)],\n    )\n    assert decision["merge"] is False\n    assert decision["lowercase_continuation"] is False\n    assert decision["reason"] == "continuation_not_lowercase"\n'''
          tests.write_text(text, encoding='utf-8')
          PY

      - name: Commit code and test migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rocketdict-workbench/tests/real_translation_full_opticks_stage10_v2_comparison.py \
                  rocketdict-product-core/tests/test_context_sentence_boundaries.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Correct Stage10 v2 full-corpus census invariants'
          git push origin HEAD:chatgpt/product-core-forward

      - name: Explicitly dispatch terminal Product verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run rocketdict-product-core.yml --ref chatgpt/product-core-forward
